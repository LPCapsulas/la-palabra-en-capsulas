<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>
  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      --paper: #fff;
      --bg: #f2f0ec;
      --quote: #f7f4ef;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.75;
      zoom: 90%;
    }
    
    .page {
      width: min(900px, calc(100% - 32px));
      margin: 32px auto;
      background: var(--paper);
      padding: 48px 72px 56px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    
    /* ===================================================== IMAGEN DE PORTADA ===================================================== */
    .banner-container {
      text-align: center;
      margin: 0 auto 24px;
      width: 100%;
      max-width: 800px;
    }
    
    .capsules-img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      border: 0;
      outline: none;
    }
    
    /* ===================================================== TEXTO DINÁMICO EN CASCADA ===================================================== */
    .welcome-text {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 48px;
      /* Ajuste perfecto para computadoras y tablets grandes */
      font-size: 24px; 
      line-height: 1.8;
      font-weight: 500;
      color: var(--text);
    }
    
    .welcome-text p {
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .welcome-text strong {
      color: var(--text);
      font-weight: 700;
    }
    
    /* ===================================================== BOTÓN PRINCIPAL — EXPLORA ===================================================== */
    .explore-button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 auto 24px;
    }
    
    .explore-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 230px;
      padding: 16px 44px;
      background: #ffffff;
      color: var(--accent);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-decoration: none;
      border: 2px solid var(--accent);
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(23,54,93,.08);
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
    }
    
    .explore-button:hover {
      background: var(--accent);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(23,54,93,.18);
    }
    
    .explore-button:active {
      transform: translateY(0);
    }
    
    /* ===================================================== TELÉFONO VERTICAL (MÓVIL) ===================================================== */
    @media(max-width:700px) and (orientation:portrait) {
      body {
        zoom: 100%;
      }
      .page {
        padding: 32px 24px 40px;
        margin: 0 auto;
        width: 100%;
      }
      .banner-container {
        margin-bottom: 24px;
      }
      /* Escalado adaptativo para que las letras no se compriman en celulares */
      .welcome-text {
        font-size: 21px; 
        line-height: 1.65;
        margin-bottom: 40px;
      }
      .explore-button-container {
        margin-bottom: 24px;
      }
      .explore-button {
        min-width: 200px;
        padding: 14px 36px;
        font-size: 17px;
      }
    }
    
    /* ===================================================== TELÉFONO HORIZONTAL ===================================================== */
    @media(max-width:700px) and (orientation:landscape) {
      body {
        zoom: 100%;
      }
      .page {
        padding: 30px 24px 40px;
        margin: 0 auto;
        width: 100%;
      }
      .banner-container {
        margin-bottom: 24px;
      }
      .welcome-text {
        font-size: 22px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .explore-button-container {
        margin-bottom: 24px;
      }
      .explore-button {
        min-width: 210px;
        padding: 14px 38px;
        font-size: 17px;
      }
    }
  </style>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <main class="page">
    
    <!-- ===================================================== IMAGEN DE PORTADA RECORTADA ===================================================== -->
    <div class="banner-container">
      <img class="capsules-img" src="Explora/portada.png" alt="La Palabra en Cápsulas — Portada">
    </div>

    <!-- ===================================================== TEXTO EN CASCADA INDEPENDIENTE ===================================================== -->
    <div class="welcome-text">
      <p>
        Bienvenido a este espacio. Un lugar<br>
        dedicado a compartir ideas<br>
        prácticas, profundas y<br>
        accesibles para un<br>
        caminar seguro<br>
        con <strong>Dios</strong>
      </p>
    </div>

    <!-- ===================================================== BOTÓN INTERACTIVO EXPLORA ===================================================== -->
    <div class="explore-button-container">
      <a class="explore-button" href="Explora/index.html" aria-label="Explorar La Palabra en Cápsulas">
        <span>EXPLORA</span>
      </a>
    </div>

  </main>

</body>
</html>
