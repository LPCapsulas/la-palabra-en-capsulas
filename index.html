   <script>
    (function () {
      "use strict";
      const estadisticasHablantes = {
        "en": 1493, "zh": 1183, "hi": 611, "es": 561, "ar": 335,
        "fr": 334, "pt": 269, "ru": 210, "de": 133, "ja": 126, "it": 68
      };
      const contenedorNav = document.querySelector(".language-bar");
      if (contenedorNav) {
        const botones = Array.from(contenedorNav.querySelectorAll(".language-button"));
        const botonHebreo = botones.find(btn => btn.getAttribute("data-lang") === "he");
        const otrosBotones = botones.filter(btn => btn.getAttribute("data-lang") !== "he");

        otrosBotones.sort((a, b) => {
          const hablantesA = estadisticasHablantes[a.getAttribute("data-lang")] || 0;
          const hablantesB = estadisticasHablantes[b.getAttribute("data-lang")] || 0;
          return hablantesB - hablantesA;
        });

        contenedorNav.textContent = "";
        if (botonHebreo) contenedorNav.appendChild(botonHebreo);
        otrosBotones.forEach(btn => contenedorNav.appendChild(btn));
      }
    })();
   </script>

function updateContent(langCode) {

span.className = "welcome-line";
span.innerHTML = line;

});
buttons.forEach(function (btn) {
if (btn.getAttribute("data-lang") === langCode) {
btn.classList.add("active");
btn.setAttribute("aria-pressed", "true");
} else {
btn.classList.remove("active");
btn.setAttribute("aria-pressed", "false");
}
});
