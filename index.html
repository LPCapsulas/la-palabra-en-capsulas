   :root { --azul: #17365D; --azul-boton: #0F4C81; --fondo: #F8F4EC; --dorado: #B99A59; } * { box-sizing: border-box; } html { min-height: 100%; background: var(--fondo); } body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--azul); font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; } .page { width: 100%; max-width: 1400px; min-height: 100vh; margin: 0 auto; padding: 8px 16px 20px; display: flex; flex-direction: column; align-items: center; } .language-bar { width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 19px; padding: 5px 0 10px; } .language-button { border: 0; padding: 4px 2px; background: transparent; color: var(--azul); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; } .language-button:hover, .language-button:focus-visible { color: var(--dorado); text-decoration: underline; } .language-button.active { font-weight: 700; text-decoration: underline; text-decoration-color: var(--dorado); text-underline-offset: 4px; } .separator { width: 100%; max-width: 1000px; height: 1px; flex-shrink: 0; background: var(--dorado); margin: 0 auto 8px; } .cover-area { width: 100%; display: flex; flex-direction: column; align-items: center; } .cover-image { display: block; width: 100%; max-width: 1200px; height: auto; max-height: 48svh; object-fit: contain; object-position: center; margin: 0 auto; } .welcome { width: 100%; max-width: 1000px; margin: 13px auto 20px; padding: 0 10px; color: var(--azul); text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: clamp(17px, 1.35vw, 20px); line-height: 1.25; } .welcome-line { display: block; opacity: 0; transform: translateY(18px); animation: cascade-in 0.7s ease forwards; } .welcome-line:first-child { margin-bottom: 22px; font-size: 1.2em; font-weight: 700; line-height: 1.2; } .welcome-line:last-child { font-weight: 700; color: var(--azul-boton); } @keyframes cascade-in { to { opacity: 1; transform: translateY(0); } } .explore-button { display: inline-flex; justify-content: center; align-items: center; min-width: 200px; min-height: 52px; margin: 0 auto 8px; padding: 12px 34px; border: 1px solid var(--azul-boton); border-radius: 7px; background: var(--azul-boton); color: #fff; text-decoration: none; text-align: center; font-size: 19px; font-weight: 600; box-shadow: 0 3px 8px rgba(23, 54, 93, 0.15); transition: background 0.2s ease, transform 0.2s ease; } .explore-button:hover, .explore-button:focus-visible { background: var(--azul); transform: translateY(-1px); } html[dir="rtl"] .welcome { direction: rtl; } /* PC y pantallas grandes */ @media (min-width: 761px) { .page { padding-top: 6px; } .cover-image { max-height: 48svh; } .welcome { margin-top: 9px; margin-bottom: 22px; font-size: clamp(18px, 1.55vw, 22px); line-height: 1.22; } .welcome-line:first-child { margin-bottom: 18px; } .explore-button { margin-top: -10px; margin-bottom: 12px; } } /* Celular */ @media (max-width: 760px) { .page { min-height: 100svh; padding: 5px 0 12px; } .language-bar { gap: 4px 13px; padding: 5px 8px 9px; } .language-button { font-size: 13px; padding: 4px 1px; } .separator { width: calc(100% - 24px); margin-bottom: 5px; } .cover-image { width: 100%; max-width: 100%; height: 40svh; max-height: 40svh; object-fit: contain; object-position: center; } .welcome { margin: 10px auto 18px; padding: 0 12px; font-size: clamp(20px, 5.3vw, 25px); line-height: 1.3; } .welcome-line:first-child { margin-bottom: 17px; font-size: 1.2em; } .explore-button { min-width: 180px; min-height: 46px; margin-top: 0; margin-bottom: 10px; padding: 10px 28px; font-size: 18px; } } @media (max-width: 380px) { .language-bar { column-gap: 10px; row-gap: 3px; } .language-button { font-size: 12px; } .cover-image { height: 38svh; max-height: 38svh; } .welcome { margin-top: 8px; margin-bottom: 15px; padding: 0 10px; font-size: 19px; line-height: 1.27; } .welcome-line:first-child { margin-bottom: 15px; } .explore-button { min-height: 45px; } } /* Pantallas de celular con poca altura */ @media (max-height: 700px) and (max-width: 760px) { .cover-image { height: 34svh; max-height: 34svh; } .welcome { margin-top: 5px; margin-bottom: 11px; font-size: 18px; line-height: 1.22; } .welcome-line:first-child { margin-bottom: 12px; } .explore-button { min-height: 42px; padding-top: 8px; padding-bottom: 8px; } } @media (prefers-reduced-motion: reduce) { .welcome-line { opacity: 1; transform: none; animation: none; } * { transition: none !important; } }

  <!-- MOTOR DE ORDENAMIENTO AUTOMÁTICO DE IDIOMAS -->
  <script>
   (function () {
     "use strict";

     // 1. Matriz de Población (Hablantes Totales en Millones según Ethnologue)
     // Si agregas un nuevo idioma en el futuro, sólo debes registrar su código aquí.
     const estadisticasHablantes = {
       "en": 1493, // Inglés
       "zh": 1183, // Chino Mandarín
       "hi": 611,  // Hindi
       "es": 561,  // Español
       "ar": 335,  // Árabe Standard
       "fr": 334,  // Francés
       "pt": 269,  // Portugués
       "ru": 210,  // Ruso
       "de": 133,  // Alemán
       "ja": 126,  // Japonés
       "it": 68    // Italiano
     };

     // 2. Capturar el contenedor del menú y todos los botones actuales
     const contenedorNav = document.getElementById("navIdiomas");
     if (contenedorNav) {
       const botones = Array.from(contenedorNav.querySelectorAll(".language-button"));

       // 3. Clasificación: Aislar el Hebreo y separar los demás
       const botonHebreo = botones.find(btn => btn.getAttribute("data-lang") === "he");
       const otrosBotones = botones.filter(btn => btn.getAttribute("data-lang") !== "he");

       // 4. Algoritmo de ordenamiento: Mayor a menor población
       otrosBotones.sort((a, b) => {
         const langA = a.getAttribute("data-lang");
         const langB = b.getAttribute("data-lang");
         
         const hablantesA = estadisticasHablantes[langA] || 0; 
         const hablantesB = estadisticasHablantes[langB] || 0;

         return hablantesB - hablantesA;
       });

       // 5. Re-inyección limpia en el HTML
       contenedorNav.textContent = ""; // Vacía el menú previo
       
       if (botonHebreo) {
         contenedorNav.appendChild(botonHebreo); // El hebreo se ancla obligatoriamente de primero
       }
       
       otrosBotones.forEach(btn => contenedorNav.appendChild(btn)); // Se imprimen los demás ordenados
     }
   })();
  </script>
