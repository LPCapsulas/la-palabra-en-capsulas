
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --text: #252525;
  --muted: #666;
  --accent: #17365D;
  --brand-blue: #112952;
  --paper: #fff;
  --bg: #f2f0ec;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  font-size: 17px;
  line-height: 1.7;
}

.page {
  width: min(900px, calc(100% - 32px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 12px 36px 24px;
  background: var(--paper);
  box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
  display: flex;
  flex-direction: column;
}

.language-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px 9px;
  padding: 5px 0 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid #f0ede6;
  font-size: 13px;
  flex-shrink: 0;
}

.lang-link {
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}

.lang-link:hover,
.lang-link:focus-visible {
  color: var(--accent);
  text-decoration: underline;
}

.lang-link.active {
  color: var(--accent);
  font-weight: 700;
}

.cover-area {
  width: 100%;
  text-align: center;
}

.cover-image {
  display: block;
  width: auto;
  max-width: 100%;
  height: auto;
  max-height: 67vh;
  object-fit: contain;
  margin: 0 auto;
}

.text-container {
  text-align: center;
  padding: 14px 0 8px;
}

.text-container h1 {
  margin: 0 0 4px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(23px, 4vw, 32px);
  line-height: 1.3;
}

.text-container p {
  margin: 0;
  font-size: 17px;
  line-height: 1.6;
}

.action-container {
  text-align: center;
  padding: 14px 0 22px;
  margin-top: auto;
}

.btn-explore {
  display: inline-block;
  min-width: 170px;
  padding: 12px 32px;
  border-radius: 4px;
  background: var(--brand-blue);
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  transition: background .2s ease;
}

.btn-explore:hover,
.btn-explore:focus-visible {
  background: var(--accent);
}

@media (min-width: 601px) {
  .page {
    min-height: 100vh;
  }

  .cover-image {
    max-height: 64vh;
  }
}

@media (max-width: 600px) {
  .page {
    width: calc(100% - 12px);
    min-height: 100vh;
    padding: 10px 12px 18px;
  }

  .language-bar {
    justify-content: center;
    column-gap: 7px;
    row-gap: 5px;
    font-size: 12px;
    padding-bottom: 10px;
    margin-bottom: 12px;
  }

  .cover-image {
    width: 100%;
    max-height: none;
  }

  .text-container {
    padding-top: 12px;
  }

  .text-container h1 {
    font-size: 25px;
  }

  .text-container p {
    font-size: 17px;
  }

  .action-container {
    padding-top: 14px;
    padding-bottom: 14px;
  }

  .btn-explore {
    min-width: 160px;
    padding: 12px 26px;
  }
}
</style>
</head>

<body>
<div class="page">

  <nav class="language-bar" aria-label="Seleccionar idioma">
    <a href="#" class="lang-link active" data-lang="es" lang="es">Español</a>
    <a href="#" class="lang-link" data-lang="en" lang="en">English</a>
    <a href="#" class="lang-link" data-lang="fr" lang="fr">Français</a>
    <a href="#" class="lang-link" data-lang="zh" lang="zh">中文</a>
    <a href="#" class="lang-link" data-lang="it" lang="it">Italiano</a>
    <a href="#" class="lang-link" data-lang="pt" lang="pt">Português</a>
    <a href="#" class="lang-link" data-lang="he" lang="he">עברית</a>
    <a href="#" class="lang-link" data-lang="ar" lang="ar">العربية</a>
  </nav>

  <main>
    <div class="cover-area">
      <img
        id="cover-image"
        class="cover-image"
        src="/Explora/portada.jpg"
        alt="Portada de La Palabra en Cápsulas: Fe, Poder y Vida"
        fetchpriority="high"
      >
    </div>

    <div class="text-container">
      <h1 id="title">La Palabra en Cápsulas</h1>
      <p id="subtitle">Fe, Poder y Vida</p>
    </div>
  </main>

  <div class="action-container">
    <a
      id="explore-button"
      class="btn-explore"
      href="/Explora/menu.html?lang=es"
    >Explora</a>
  </div>

</div>

<script>
(function () {
  "use strict";

  const SPANISH_IMAGE = "/Explora/portada.jpg";

  const translations = {
    es: {
      title: "La Palabra en Cápsulas",
      subtitle: "Fe, Poder y Vida",
      button: "Explora",
      menu: "/Explora/menu.html?lang=es",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },

    en: {
      title: "The Word in Capsules",
      subtitle: "Faith, Power and Life",
      button: "Explore",
      menu: "/Explora/menu.html?lang=en",
      image: "/Explora/portada-en.png",
      direction: "ltr"
    },

    fr: {
      title: "La Parole en Capsules",
      subtitle: "Foi, Puissance et Vie",
      button: "Explorer",
      menu: "/Explora/menu.html?lang=fr",
      image: "/Explora/portada-fr.png",
      direction: "ltr"
    },

    zh: {
      title: "胶囊话语",
      subtitle: "信心、能力与生命",
      button: "探索",
      menu: "/Explora/menu.html?lang=zh",
      image: "/Explora/portada-zh.png",
      direction: "ltr"
    },

    it: {
      title: "La Parola in Capsule",
      subtitle: "Fede, Potenza e Vita",
      button: "Esplora",
      menu: "/Explora/menu.html?lang=it",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },

    pt: {
      title: "A Palavra em Cápsulas",
      subtitle: "Fé, Poder e Vida",
      button: "Explore",
      menu: "/Explora/menu.html?lang=pt",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },

    he: {
      title: "המילה בכמוסות",
      subtitle: "אמונה, כוח וחיים",
      button: "גלה",
      menu: "/Explora/menu.html?lang=he",
      image: SPANISH_IMAGE,
      direction: "rtl"
    },

    ar: {
      title: "الكلمة في كبسولات",
      subtitle: "الإيمان والقوة والحياة",
      button: "استكشف",
      menu: "/Explora/menu.html?lang=ar",
      image: SPANISH_IMAGE,
      direction: "rtl"
    }
  };

  const image = document.getElementById("cover-image");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const button = document.getElementById("explore-button");
  const languageLinks = document.querySelectorAll(".lang-link");

  let currentLanguage = "es";

  /*
    Si una imagen traducida no está disponible,
    se muestra la portada española como alternativa.
  */
  image.addEventListener("error", function () {
    if (!image.src.endsWith(SPANISH_IMAGE)) {
      image.src = SPANISH_IMAGE;
      image.alt = "Portada de La Palabra en Cápsulas";
    }
  });

  function rememberLanguage(lang) {
    try {
      localStorage.setItem("lpc-language", lang);
      localStorage.setItem("user_language", lang);
    } catch (error) {
      // La página continúa funcionando sin almacenamiento local.
    }
  }

  function getInitialLanguage() {
    const params = new URLSearchParams(window.location.search);
    const requested = params.get("lang");

    if (requested && translations[requested]) {
      return requested;
    }

    try {
      const saved =
        localStorage.getItem("lpc-language") ||
        localStorage.getItem("user_language");

      if (saved && translations[saved]) {
        return saved;
      }
    } catch (error) {
      // Español será el idioma predeterminado.
    }

    return "es";
  }

  function setLanguage(lang) {
    if (!translations[lang]) {
      lang = "es";
    }

    const content = translations[lang];
    currentLanguage = lang;

    document.documentElement.lang = lang;
    document.documentElement.dir = content.direction;

    title.textContent = content.title;
    subtitle.textContent = content.subtitle;
    button.textContent = content.button;
    button.href = content.menu;

    languageLinks.forEach(function (link) {
      const selected = link.dataset.lang === lang;

      link.classList.toggle("active", selected);

      if (selected) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    });

    /*
      La imagen española ya está en el HTML.
      Solo se cambia al seleccionar otro idioma.
    */
    if (lang === "es") {
      if (!image.src.endsWith(SPANISH_IMAGE)) {
        image.src = SPANISH_IMAGE;
      }
      image.alt = "Portada de La Palabra en Cápsulas: Fe, Poder y Vida";
    } else {
      image.alt = content.title;
      image.src = content.image || SPANISH_IMAGE;
    }

    rememberLanguage(lang);
  }

  languageLinks.forEach(function (link) {
    link.addEventListener("click", function (event) {
      event.preventDefault();
      setLanguage(link.dataset.lang);
    });
  });

  setLanguage(getInitialLanguage());
})();
</script>

</body>
</html>
