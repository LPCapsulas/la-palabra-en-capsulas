<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --text: #252525;
  --muted: #666;
  --accent: #17365D;
  --brand-blue: #112952;
  --paper: #fff;
  --bg: #f2f0ec;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.page {
  width: min(1000px, calc(100% - 24px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 8px 20px 16px;
  background: var(--paper);
  box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
  display: flex;
  flex-direction: column;
}

.language-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px 10px;
  padding: 5px 0 10px;
  margin-bottom: 8px;
  border-bottom: 1px solid #f0ede6;
  font-size: 13px;
  flex-shrink: 0;
}

.lang-link {
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}

.lang-link:hover,
.lang-link:focus-visible {
  color: var(--accent);
  text-decoration: underline;
}

.lang-link.active {
  color: var(--accent);
  font-weight: 700;
}

.cover-area {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cover-image {
  display: block;
  width: auto;
  max-width: 100%;
  height: auto;
  max-height: calc(100vh - 115px);
  object-fit: contain;
  margin: 0 auto;
}

.action-container {
  text-align: center;
  padding: 12px 0 4px;
  flex-shrink: 0;
}

.btn-explore {
  display: inline-block;
  min-width: 170px;
  padding: 12px 32px;
  border-radius: 4px;
  background: var(--brand-blue);
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  transition: background .2s ease;
}

.btn-explore:hover,
.btn-explore:focus-visible {
  background: var(--accent);
}

@media (min-width: 601px) {
  .page {
    width: min(1100px, calc(100% - 24px));
  }

  .cover-image {
    max-height: calc(100vh - 105px);
  }
}

@media (max-width: 600px) {
  .page {
    width: 100%;
    min-height: 100vh;
    padding: 8px 10px 14px;
  }

  .language-bar {
    justify-content: center;
    column-gap: 8px;
    row-gap: 5px;
    font-size: 12px;
    padding-bottom: 10px;
    margin-bottom: 6px;
  }

  .cover-area {
    flex: 1;
  }

  .cover-image {
    width: 100%;
    max-width: 100%;
    max-height: none;
  }

  .action-container {
    padding: 10px 0 2px;
  }

  .btn-explore {
    min-width: 160px;
    padding: 12px 26px;
  }
}
</style>
</head>

<body>
<div class="page">

  <nav class="language-bar" aria-label="Seleccionar idioma">
    <a href="#" class="lang-link active" data-lang="es" lang="es">Español</a>
    <a href="#" class="lang-link" data-lang="en" lang="en">English</a>
    <a href="#" class="lang-link" data-lang="fr" lang="fr">Français</a>
    <a href="#" class="lang-link" data-lang="zh" lang="zh">中文</a>
    <a href="#" class="lang-link" data-lang="it" lang="it">Italiano</a>
    <a href="#" class="lang-link" data-lang="pt" lang="pt">Português</a>
    <a href="#" class="lang-link" data-lang="he" lang="he">עברית</a>
    <a href="#" class="lang-link" data-lang="ar" lang="ar">العربية</a>
  </nav>

  <main class="cover-area">
    <img
      id="cover-image"
      class="cover-image"
      src="/Explora/portada.jpg"
      alt="Portada de La Palabra en Cápsulas: Fe, Poder y Vida"
      fetchpriority="high"
    >
  </main>

  <div class="action-container">
    <a
      id="explore-button"
      class="btn-explore"
      href="/Explora/menu.html?lang=es"
    >Explora</a>
  </div>

</div>

<script>
(function () {
  "use strict";

  const SPANISH_IMAGE = "/Explora/portada.jpg";

  const translations = {
    es: {
      button: "Explora",
      menu: "/Explora/menu.html?lang=es",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },
    en: {
      button: "Explore",
      menu: "/Explora/menu.html?lang=en",
      image: "/Explora/portada-en.png",
      direction: "ltr"
    },
    fr: {
      button: "Explorer",
      menu: "/Explora/menu.html?lang=fr",
      image: "/Explora/portada-fr.png",
      direction: "ltr"
    },
    zh: {
      button: "探索",
      menu: "/Explora/menu.html?lang=zh",
      image: "/Explora/portada-zh.png",
      direction: "ltr"
    },
    it: {
      button: "Esplora",
      menu: "/Explora/menu.html?lang=it",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },
    pt: {
      button: "Explore",
      menu: "/Explora/menu.html?lang=pt",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },
    he: {
      button: "גלה",
      menu: "/Explora/menu.html?lang=he",
      image: SPANISH_IMAGE,
      direction: "rtl"
    },
    ar: {
      button: "استكشف",
      menu: "/Explora/menu.html?lang=ar",
      image: SPANISH_IMAGE,
      direction: "rtl"
    }
  };

  const image = document.getElementById("cover-image");
  const button = document.getElementById("explore-button");
  const languageLinks = document.querySelectorAll(".lang-link");

  image.addEventListener("error", function () {
    if (!image.src.endsWith(SPANISH_IMAGE)) {
      image.src = SPANISH_IMAGE;
      image.alt = "Portada de La Palabra en Cápsulas";
    }
  });

  function rememberLanguage(lang) {
    try {
      localStorage.setItem("lpc-language", lang);
      localStorage.setItem("user_language", lang);
    } catch (error) {
      // La página sigue funcionando sin almacenamiento local.
    }
  }

  function getInitialLanguage() {
    const params = new URLSearchParams(window.location.search);
    const requested = params.get("lang");

    if (requested && translations[requested]) {
      return requested;
    }

    try {
      const saved =
        localStorage.getItem("lpc-language") ||
        localStorage.getItem("user_language");

      if (saved && translations[saved]) {
        return saved;
      }
    } catch (error) {
      // Español será el idioma predeterminado.
    }

    return "es";
  }

  function setLanguage(lang) {
    if (!translations[lang]) {
      lang = "es";
    }

    const content = translations[lang];

    document.documentElement.lang = lang;
    document.documentElement.dir = content.direction;

    button.textContent = content.button;
    button.href = content.menu;

    languageLinks.forEach(function (link) {
      const selected = link.dataset.lang === lang;
      link.classList.toggle("active", selected);

      if (selected) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    });

    if (lang === "es") {
      if (!image.src.endsWith(SPANISH_IMAGE)) {
        image.src = SPANISH_IMAGE;
      }
      image.alt = "Portada de La Palabra en Cápsulas: Fe, Poder y Vida";
    } else {
      image.alt = "Portada de " + content.button;
      image.src = content.image || SPANISH_IMAGE;
    }

    rememberLanguage(lang);
  }

  languageLinks.forEach(function (link) {
    link.addEventListener("click", function (event) {
      event.preventDefault();
      setLanguage(link.dataset.lang);
    });
  });

  setLanguage(getInitialLanguage());
})();
</script>

</body>
</html>
