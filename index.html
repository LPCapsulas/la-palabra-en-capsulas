<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>

  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      --brand-blue: #112952;
      --paper: #fff;
      --bg: #f2f0ec;
      --quote: #f7f4ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 17px;
      line-height: 1.8;
      zoom: 100%;
    }

    /* =====================================================
       PÁGINA PRINCIPAL — PC
       ===================================================== */

    .page {
      width: min(900px, calc(100% - 32px));
      margin: 2px auto;
      background: var(--paper);
      padding: 10px 72px 22px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    /* =====================================================
       BARRA DE SELECCIÓN DE IDIOMAS
       ===================================================== */

    .language-bar {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      padding: 8px 0 16px 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      border-bottom: 1px solid #f0ede6;
      margin-bottom: 15px;
    }

    .lang-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }

    .lang-link:hover {
      color: var(--accent);
    }

    .lang-link.active {
      color: var(--brand-blue);
      font-weight: 700;
      cursor: default;
    }

    .lang-divider {
      color: #ccc;
    }

    /* =====================================================
       IMAGEN DE PORTADA Y CONTENEDOR DINÁMICO
       ===================================================== */

    .banner-container {
      text-align: center;
      margin: 0 auto 10px;
      width: 100%;
      max-width: 800px;
      position: relative;
    }

    .capsules-img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      border: 0;
      outline: none;
    }

    /* Caja de título traducido que aparece solo en Inglés y Francés */
    .translated-title-box {
      display: none;
      background: linear-gradient(135deg, #112952 0%, #17365D 100%);
      color: #ffffff;
      padding: 40px 20px;
      border-radius: 6px;
      margin-bottom: 15px;
      box-shadow: 0 4px 14px rgba(23,54,93,.12);
    }

    .translated-title-box h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .translated-title-box p {
      font-size: 1.2rem;
      color: #dfb76c; /* Color dorado elegante para el subtítulo */
      font-style: italic;
      letter-spacing: 2px;
    }

    /* =====================================================
       TEXTO DE BIENVENIDA — DINÁMICO
       ===================================================== */

    .welcome-text {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      max-width: 760px;
      margin: 0 auto 22px;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 500;
      color: var(--brand-blue);
    }

    .welcome-text p {
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .welcome-text span.highlight {
      color: var(--brand-blue);
    }

    /* Clases de control de visibilidad según idioma activo */
    .lang-content {
      display: none;
    }
    
    .lang-content.visible {
      display: block;
    }

    /* =====================================================
       BOTÓN PRINCIPAL — EXPLORA
       ===================================================== */

    .explore-button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 auto 2px;
    }

    .explore-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 230px;
      padding: 10px 44px;
      background: #ffffff;
      color: var(--accent);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-decoration: none;
      border: 2px solid var(--accent);
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(23,54,93,.08);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease,
        color .25s ease;
    }

    .explore-button:hover {
      background: var(--accent);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(23,54,93,.18);
    }

    .explore-button:active {
      transform: translateY(0);
    }

    /* =====================================================
       TELÉFONO VERTICAL
       ===================================================== */

    @media (max-width: 700px) and (orientation: portrait) {
      .page {
        padding: 10px 24px 40px;
        margin: 0 auto;
        width: 100%;
      }

      .language-bar {
        justify-content: center;
        padding-bottom: 12px;
      }

      .banner-container {
        margin-bottom: 24px;
      }

      .translated-title-box h1 {
        font-size: 1.8rem;
      }

      .welcome-text {
        font-size: 18px;
        line-height: 2.05;
        margin: 0 auto 32px;
        max-width: 240px;
        font-weight: 400;
        color: #111;
      }

      .welcome-text span.highlight {
        color: #111;
      }

      .explore-button-container {
        margin-bottom: 24px;
      }

      .explore-button {
        min-width: 200px;
        padding: 14px 36px;
        font-size: 17px;
      }
    }

    /* =====================================================
       TELÉFONO HORIZONTAL
       ===================================================== */

    @media (max-width: 900px) and (orientation: landscape) {
      .page {
        width: min(900px, calc(100% - 32px));
        padding: 10px 40px 22px;
        margin: 2px auto;
      }

      .banner-container {
        margin-bottom: 10px;
      }

      .welcome-text {
        width: 100%;
        max-width: 760px;
        font-size: 21px;
        line-height: 1.35;
        margin: 0 auto 22px;
        font-weight: 500;
        color: var(--brand-blue);
      }

      .explore-button-container {
        margin-bottom: 2px;
      }

      .explore-button {
        min-width: 230px;
        padding: 10px 44px;
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <main class="page">

    <!-- BARRA DE SELECCIÓN DE IDIOMAS -->
    <div class="language-bar">
      <span class="lang-link active" id="link-es" onclick="changeLanguage('es')">Español</span>
      <span class="lang-divider">|</span>
      <span class="lang-link" id="link-en" onclick="changeLanguage('en')">English</span>
      <span class="lang-divider">|</span>
      <span class="lang-link" id="link-fr" onclick="changeLanguage('fr')">Français</span>
    </div>

    <!-- SECCIÓN DE PORTADA / BANNER -->
    <div class="banner-container">
      <!-- Imagen original para la versión en Español -->
      <img id="banner-es" class="capsules-img" src="Explora/portada.png" alt="La Palabra en Cápsulas — Portada">
      
      <!-- Bloque de texto estilizado que reemplaza al banner en idiomas extranjeros -->
      <div id="banner-translated" class="translated-title-box">
        <h1 id="translated-h1">The Word in Capsules</h1>
        <p id="translated-p">Faith, Power and Life</p>
      </div>
    </div>

    <!-- CONTENEDOR DE TEXTOS DE BIENVENIDA -->
    <div class="welcome-text">
      <!-- CONTENIDO EN ESPAÑOL -->
      <div id="content-es" class="lang-content visible">
        <p>Bienvenido a <span class="highlight">La Palabra en Cápsulas</span></p>
      </div>

      <!-- CONTENIDO EN INGLÉS -->
      <div id="content-en" class="lang-content">
        <p>Welcome to <span class="highlight">The Word in Capsules</span></p>
      </div>

      <!-- CONTENIDO EN FRANCÉS -->
      <div id="content-fr" class="lang-content">
        <p>Bienvenue à <span class="highlight">La Parole en Capsules</span></p>
      </div>
    </div>

    <!-- BOTÓN DE EXPLORACIÓN -->
    <div class="explore-button-container">
      <a href="Explora/index.html" class="explore-button" id="btn-explore">EXPLORA</a>
    </div>

  </main>

  <!-- LÓGICA DE TRADUCCIÓN (JAVASCRIPT) -->
  <script>
    function changeLanguage(lang) {
      // 1. Quitar clase 'active' de todos los botones y agregarla al seleccionado
      document.querySelectorAll('.lang-link').forEach(link => link.classList.remove('active'));
      document.getElementById(`link-${lang}`).classList.add('active');

      // 2. Controlar la visibilidad de los bloques de texto de bienvenida
      document.querySelectorAll('.lang-content').forEach(content => content.classList.remove('visible'));
      document.getElementById(`content-${lang}`).classList.add('visible');

      // 3. Modificar portadas, títulos y botones de acuerdo al idioma
      const bannerEs = document.getElementById('banner-es');
      const bannerTranslated = document.getElementById('banner-translated');
      const transH1 = document.getElementById('translated-h1');
      const transP = document.getElementById('translated-p');
      const btnExplore = document.getElementById('btn-explore');

      if (lang === 'es') {
        bannerEs.style.display = 'block';
        bannerTranslated.style.display = 'none';
        btnExplore.textContent = 'EXPLORA';
      } else if (lang === 'en') {
        bannerEs.style.display = 'none';
bannerTranslated.style.display = 'block';
transH1.textContent = 'The Word in Capsules';
transP.textContent = 'Faith, Power and Life';
btnExplore.textContent = 'EXPLORE';
} else if (lang === 'fr') {
bannerEs.style.display = 'none';
bannerTranslated.style.display = 'block';
transH1.textContent = 'La Parole en Capsules';
transP.textContent = 'Foi, Puissance et Vie';
btnExplore.textContent = 'EXPLORER';
}
}
