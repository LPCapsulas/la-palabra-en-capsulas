<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>
  <style>
    /* Estilos CSS principales para la portada y adaptabilidad móvil */
    :root { --text: #252525; --muted: #666; --accent: #17365D; --brand-blue: #112952; --paper: #fff; --bg: #f2f0ec; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; font-size: 17px; line-height: 1.8; }
    .page { width: min(900px, calc(100% - 32px)); margin: 2px auto; background: var(--paper); padding: 10px 72px 22px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .language-bar { display: flex; justify-content: flex-end; gap: 15px; padding: 8px 0 16px 0; font-size: 14px; border-bottom: 1px solid #f0ede6; margin-bottom: 15px; }
    .lang-link { color: var(--muted); text-decoration: none; font-weight: 500; cursor: pointer; }
    .lang-link.active { color: var(--brand-blue); font-weight: 700; cursor: default; }
    .banner-container { text-align: center; margin: 0 auto 10px; width: 100%; max-width: 800px; }
    .capsules-img { display: block; width: 100%; height: auto; }
    .welcome-text { text-align: center; max-width: 760px; margin: 0 auto 22px; font-size: 22px; font-weight: 500; color: var(--brand-blue); }
    .welcome-mobile, .welcome-landscape, .welcome-mobile-narrow { display: none; }
    .explore-button-container { display: flex; justify-content: center; width: 100%; margin: 0 auto 2px; }
    .explore-button { display: inline-flex; padding: 10px 44px; background: #fff; color: var(--accent); font-size: 19px; font-weight: 700; letter-spacing: 2.5px; text-decoration: none; border: 2px solid var(--accent); border-radius: 6px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="language-bar">
      <span class="lang-link active" id="link-es" onclick="traducirSitio('es')">Español</span> |
      <span class="lang-link" id="link-en" onclick="traducirSitio('en')">English</span> |
      <span class="lang-link" id="link-fr" onclick="traducirSitio('fr')">Français</span>
    </div>
    <div class="banner-container">
      <img class="capsules-img" src="Explora/portada.png" alt="La Palabra en Cápsulas — Portada">
    </div>
    <div class="welcome-text">
      <p class="welcome-pc" id="text-pc">Bienvenido a este espacio...</p>
      <p class="welcome-mobile" id="text-mobile">Bienvenido a este espacio...</p>
      <p class="welcome-landscape" id="text-landscape">Bienvenido a este espacio...</p>
      <p class="welcome-mobile-narrow" id="text-narrow">Bienvenido a este espacio...</p>
    </div>
    <div class="explore-button-container">
      <a class="explore-button" id="explore-btn-text" href="Explora/menu.html"><span>EXPLORA</span></a>
    </div>
  </main>
  <script type="text/javascript">
    const bibliotecaTextos = {
      es: { pc: 'Bienvenido a este espacio...', btn: '<span>EXPLORA</span>' },
      en: { pc: 'Welcome to this space...', btn: '<span>EXPLORE</span>' },
      fr: { pc: 'Bienvenue dans cet espace...', btn: '<span>EXPLORER</span>' }
    };
    function traducirSitio(idioma) {
      document.getElementById('text-pc').innerHTML = bibliotecaTextos[idioma].pc;
      document.getElementById('explore-btn-text').innerHTML = bibliotecaTextos[idioma].btn;
      document.documentElement.lang = idioma;
      document.querySelectorAll('.lang-link').forEach(l => l.classList.remove('active'));
      document.getElementById(`link-${idioma}`).classList.add('active');
    }
  </script>
</body>
</html>
