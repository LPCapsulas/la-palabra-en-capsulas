<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>

  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      --brand-blue: #112952;
      --paper: #fff;
      --bg: #f2f0ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 17px;
      line-height: 1.8;
      zoom: 100%;
    }

    .page {
      width: min(900px, calc(100% - 32px));
      margin: 2px auto;
      background: var(--paper);
      padding: 10px 72px 22px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
    }

    /* SELECTOR DE LOS CUATRO IDIOMAS */
    .language-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 0 14px;
      margin-bottom: 15px;
      border-bottom: 1px solid #f0ede6;
      font-size: 13px;
      line-height: 1.5;
      position: relative;
      z-index: 10;
    }

    .lang-link {
      color: var(--muted);
      background: none;
      border: 0;
      padding: 4px 0;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: color .2s ease;
    }

    .lang-link:hover,
    .lang-link:focus-visible {
      color: var(--accent);
      text-decoration: underline;
    }

    .lang-link.active {
      color: var(--brand-blue);
      font-weight: 700;
    }

    .lang-divider {
      color: #ccc;
      user-select: none;
    }

    /* IMÁGENES DE PORTADA */
    .banner-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 10px;
      text-align: center;
    }

    .capsules-img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    /* BIENVENIDA */
    .welcome-text {
      max-width: 760px;
      margin: 0 auto 22px;
      color: var(--brand-blue);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
    }

    .welcome-text p {
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .lang-content {
      display: none;
    }

    .lang-content.visible {
      display: block;
    }

    /* BOTÓN EXPLORA */
    .explore-button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 auto 2px;
    }

    .explore-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 230px;
      padding: 10px 30px;
      background: #fff;
      color: var(--accent);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 4px;
      box-shadow: 0 3px 10px rgba(23, 54, 93, .07);
      transition: transform .2s ease, box-shadow .2s ease,
                  background .2s ease, color .2s ease;
    }

    .explore-button:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(23, 54, 93, .16);
    }

    .explore-button:active {
      transform: translateY(0);
    }

    /* COMPUTADORA */
    @media (min-width: 901px) {
      .page {
        padding-top: 2px;
      }

      .language-bar {
        padding-bottom: 8px;
        margin-bottom: 8px;
      }

      .banner-container {
        margin-bottom: 4px;
      }

      .welcome-text {
        margin-bottom: 14px;
      }
    }

    /* TELÉFONO VERTICAL */
    @media (max-width: 700px) and (orientation: portrait) {
      .page {
        width: 100%;
        margin: 0 auto;
        padding: 10px 24px 30px;
      }

      .language-bar {
        justify-content: flex-end;
        padding-bottom: 12px;
        margin-bottom: 12px;
        gap: 7px;
      }

      .banner-container {
        margin-bottom: 10px;
      }

      .welcome-text {
        max-width: 290px;
        margin: 0 auto 22px;
        font-size: 15px;
        line-height: 1.4;
      }

      .welcome-text p {
        text-align: center;
      }

      .explore-button-container {
        margin-bottom: 4px;
      }

      .explore-button {
        min-width: 180px;
        padding: 10px 25px;
        font-size: 14px;
      }
    }

    /* TELÉFONO HORIZONTAL */
    @media (max-width: 900px) and (orientation: landscape) {
      .page {
        width: min(900px, calc(100% - 32px));
        padding: 10px 40px 22px;
        margin: 2px auto;
      }

      .banner-container {
        margin-bottom: 10px;
      }

      .welcome-text {
        max-width: 760px;
        margin: 0 auto 22px;
        font-size: 16px;
        line-height: 1.4;
      }

      .explore-button {
        min-width: 200px;
        padding: 10px 30px;
        font-size: 15px;
      }
    }
  </style>
</head>
