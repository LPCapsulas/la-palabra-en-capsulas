<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F4EC">
<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --azul: #17365D;
  --azul-boton: #0F4C81;
  --fondo: #F8F4EC;
  --dorado: #B99A59;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--fondo);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--fondo);
  color: var(--azul);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.page {
  width: 100%;
  max-width: 1100px;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  padding: 10px 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.language-bar {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 12px;
  padding: 5px 0 12px;
  font-size: 14px;
  flex-shrink: 0;
}

.lang-link {
  border: 0;
  padding: 4px 2px;
  background: transparent;
  color: var(--azul);
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  transition: color .2s ease;
}

.lang-link:hover {
  color: var(--dorado);
  text-decoration: underline;
}

.lang-link.active {
  font-weight: 700;
  color: var(--azul);
  text-decoration: underline;
  text-decoration-color: var(--dorado);
  text-underline-offset: 4px;
}

.lang-divider {
  color: rgba(23,54,93,.35);
  user-select: none;
}

.separator {
  width: 100%;
  max-width: 850px;
  height: 1px;
  flex-shrink: 0;
  background: var(--dorado);
  margin: 0 auto 12px;
}

/* CONTENEDOR PRINCIPAL DE LA PORTADA */
.cover-area {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* IMAGEN DE PORTADA */
.cover-image {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  max-height: 52vh;
  max-height: 52svh;
  object-fit: contain;
  object-position: center;
  margin: 0 auto;
  flex-shrink: 1;
}

/* TEXTO DE BIENVENIDA */
.welcome {
  width: 100%;
  max-width: 820px;
  margin: 14px auto 16px;
  padding: 0 10px;
  color: var(--azul);
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(18px, 2vw, 22px);
  line-height: 1.45;
  flex-shrink: 0;
}

.welcome-title {
  display: block;
  margin: 0 auto 18px;
  font-size: 1.12em;
  font-weight: 700;
  opacity: 0;
  transform: translateY(22px);
  animation: cascade-in .65s ease forwards;
}

.welcome-line {
  display: block;
  opacity: 0;
  transform: translateY(22px);
  animation: cascade-in .65s ease forwards;
}

@keyframes cascade-in {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* BOTÓN EXPLORA */
.explore-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 180px;
  min-height: 46px;
  margin: auto auto 8px;
  padding: 10px 30px;
  border: 1px solid var(--azul-boton);
  border-radius: 7px;
  background: var(--azul-boton);
  color: #fff;
  text-decoration: none;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  box-shadow: 0 3px 8px rgba(23,54,93,.15);
  transition: background .2s ease, transform .2s ease;
  flex-shrink: 0;
}

.explore-button:hover,
.explore-button:focus-visible {
  background: var(--azul);
  transform: translateY(-1px);
}

.explore-button:focus-visible,
.lang-link:focus-visible {
  outline: 2px solid var(--dorado);
  outline-offset: 4px;
}

html[dir="rtl"] .welcome {
  direction: rtl;
}

/* =========================================
   PC Y PANTALLAS GRANDES
   ========================================= */
@media (min-width: 761px) {
  .page {
    padding: 5px 20px 8px;
  }

  .language-bar {
    padding: 2px 0 6px;
    gap: 4px 12px;
  }

  .separator {
    margin-bottom: 6px;
  }

  .cover-area {
    flex: 1;
  }

  .cover-image {
    width: 100%;
    max-width: 760px;
    max-height: 43vh;
    max-height: 43svh;
  }

  .welcome {
    max-width: 760px;
    margin: 8px auto 12px;
    padding: 0 8px;
    font-size: clamp(18px, 1.65vw, 22px);
    line-height: 1.35;
  }

  .welcome-title {
    margin-bottom: 10px;
  }

  .explore-button {
    margin-top: auto;
    margin-bottom: 4px;
    min-height: 44px;
    padding: 9px 28px;
    font-size: 17px;
  }
}

/* MONITORES DE POCA ALTURA */
@media (min-width: 761px) and (max-height: 800px) {
  .page {
    padding-top: 3px;
    padding-bottom: 4px;
  }

  .language-bar {
    padding-top: 1px;
    padding-bottom: 4px;
  }

  .separator {
    margin-bottom: 4px;
  }

  .cover-image {
    max-width: 700px;
    max-height: 37vh;
    max-height: 37svh;
  }

  .welcome {
    margin-top: 5px;
    margin-bottom: 8px;
    font-size: 17px;
    line-height: 1.3;
  }

  .welcome-title {
    margin-bottom: 6px;
  }

  .explore-button {
    margin-top: auto;
    min-height: 42px;
    padding: 8px 26px;
  }
}

/* =========================================
   CELULAR
   El botón queda debajo del texto.
   La página puede desplazarse si hace falta.
   ========================================= */
@media (max-width: 760px) {
  .page {
    min-height: 100vh;
    min-height: 100svh;
    padding: 5px 0 12px;
  }

  .language-bar {
    gap: 4px 8px;
    padding: 5px 8px 9px;
    font-size: 13px;
  }

  .separator {
    width: calc(100% - 24px);
    margin-bottom: 7px;
  }

  .cover-area {
    flex: 1;
    min-height: 0;
  }

  .cover-image {
    width: 100%;
    max-width: 650px;
    max-height: 40svh;
  }

  .welcome {
    margin: 12px auto 14px;
    padding: 0 15px;
    font-size: 17px;
    line-height: 1.45;
  }

  .welcome-title {
    margin-bottom: 16px;
  }

  .explore-button {
    margin: 8px auto 4px;
    min-width: 165px;
    min-height: 45px;
    padding: 9px 26px;
    font-size: 17px;
  }
}

/* CELULARES CON POCA ALTURA */
@media (max-height: 700px) and (max-width: 760px) {
  .cover-image {
    max-height: 32svh;
  }

  .welcome {
    margin-top: 7px;
    margin-bottom: 9px;
    line-height: 1.35;
  }

  .welcome-title {
    margin-bottom: 10px;
  }

  .explore-button {
    margin-top: 6px;
  }
}

/* ACCESIBILIDAD: REDUCIR ANIMACIONES */
@media (prefers-reduced-motion: reduce) {
  .welcome-title,
  .welcome-line {
    opacity: 1;
    transform: none;
    animation: none;
  }

  * {
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="page">

  <nav class="language-bar" aria-label="Seleccionar idioma">
    <button type="button" class="lang-link active" id="link-es" onclick="changeLanguage('es')" aria-pressed="true">Español</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-en" onclick="changeLanguage('en')" aria-pressed="false">English</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-zh" onclick="changeLanguage('zh')" aria-pressed="false">中文</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-fr" onclick="changeLanguage('fr')" aria-pressed="false">Français</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-it" onclick="changeLanguage('it')" aria-pressed="false">Italiano</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-pt" onclick="changeLanguage('pt')" aria-pressed="false">Português</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-he" onclick="changeLanguage('he')" aria-pressed="false">עברית</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-ar" onclick="changeLanguage('ar')" aria-pressed="false">العربية</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-hi" onclick="changeLanguage('hi')" aria-pressed="false">हिन्दी</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-ru" onclick="changeLanguage('ru')" aria-pressed="false">Русский</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-de" onclick="changeLanguage('de')" aria-pressed="false">Deutsch</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-ja" onclick="changeLanguage('ja')" aria-pressed="false">日本語</button>
  </nav>

  <div class="separator" aria-hidden="true"></div>

  <section class="cover-area">
    <img
      id="coverImage"
      class="cover-image"
      src="/Explora/portada.png"
      alt="La Palabra en Cápsulas: Fe, Poder y Vida"
      fetchpriority="high">

    <div id="welcomeText" class="welcome" aria-live="polite">
      <span class="welcome-title">Bienvenido a este espacio</span>
      <span class="welcome-line">Un lugar dedicado a compartir ideas prácticas,</span>
      <span class="welcome-line">profundas y accesibles</span>
      <span class="welcome-line">para un caminar</span>
      <span class="welcome-line">seguro con</span>
      <span class="welcome-line">Dios.</span>
    </div>

    <a
      id="exploreButton"
      class="explore-button"
      href="/Explora/menu.html?lang=es">Explora</a>
  </section>

</main>

<script>
(function () {
  "use strict";

  const spanishImage = "/Explora/portada.png";

  const translations = {
    es: {
      lang:"es", dir:"ltr", image:spanishImage,
      title:"La Palabra en Cápsulas — Portada Oficial",
      heading:"Bienvenido a este espacio",
      welcome:[
        "Un lugar dedicado a compartir ideas prácticas,",
        "profundas y accesibles",
        "para un caminar",
        "seguro con",
        "Dios."
      ],
      button:"Explora",
      menu:"/Explora/menu.html?lang=es"
    },

    en: {
      lang:"en", dir:"ltr", image:"/Explora/portada-en.png",
      title:"The Word in Capsules — Official Home",
      heading:"Welcome to this space",
      welcome:[
        "A place dedicated to sharing practical,",
        "meaningful, and accessible ideas",
        "for a confident walk",
        "with",
        "God."
      ],
      button:"Explore",
      menu:"/Explora/menu.html?lang=en"
    },

    zh: {
      lang:"zh-CN", dir:"ltr", image:"/Explora/portada-zh.png",
      title:"胶囊中的话语 — 官方主页",
      heading:"欢迎来到这个空间",
      welcome:[
        "这里致力于分享实用、深刻",
        "且通俗易懂的理念，",
        "帮助您坚定地",
        "与上帝",
        "同行。"
      ],
      button:"开始探索",
      menu:"/Explora/menu.html?lang=zh"
    },

    fr: {
      lang:"fr", dir:"ltr", image:"/Explora/portada-fr.png",
      title:"La Parole en Capsules — Page d’accueil officielle",
      heading:"Bienvenue dans cet espace",
      welcome:[
        "Un lieu consacré au partage d’idées pratiques,",
        "profondes et accessibles,",
        "pour avancer avec assurance",
        "avec",
        "Dieu."
      ],
      button:"Explorer",
      menu:"/Explora/menu.html?lang=fr"
    },

    it: {
      lang:"it", dir:"ltr", image:spanishImage,
      title:"La Parola in Capsule — Pagina ufficiale",
      heading:"Benvenuto in questo spazio",
      welcome:[
        "Un luogo dedicato alla condivisione di idee pratiche,",
        "profonde e accessibili,",
        "per camminare con sicurezza",
        "con",
        "Dio."
      ],
      button:"Esplora",
      menu:"/Explora/menu.html?lang=it"
    },

    pt: {
      lang:"pt", dir:"ltr", image:spanishImage,
      title:"A Palavra em Cápsulas — Página oficial",
      heading:"Bem-vindo a este espaço",
      welcome:[
        "Um lugar dedicado a compartilhar ideias práticas,",
        "profundas e acessíveis,",
        "para caminhar com segurança",
        "com",
        "Deus."
      ],
      button:"Explorar",
      menu:"/Explora/menu.html?lang=pt"
    },

    he: {
      lang:"he", dir:"rtl", image:spanishImage,
      title:"דף הבית הרשמי — דברי אלוהים בכמוסות",
      heading:"ברוכים הבאים למרחב הזה",
      welcome:[
        "מקום המוקדש לשיתוף רעיונות מעשיים,",
        "עמוקים ונגישים,",
        "כדי לצעוד בביטחון",
        "עם",
        "אלוהים."
      ],
      button:"גלו",
      menu:"/Explora/menu.html?lang=he"
    },

    ar: {
      lang:"ar", dir:"rtl", image:spanishImage,
      title:"كلمة الله في كبسولات — الصفحة الرئيسية الرسمية",
      heading:"أهلًا بكم في هذا المكان",
      welcome:[
        "مساحة مخصصة لمشاركة أفكار عملية،",
        "عميقة وسهلة الفهم،",
        "للسير بثقة",
        "مع",
        "الله."
      ],
      button:"استكشف",
      menu:"/Explora/menu.html?lang=ar"
    },

    hi: {
      lang:"hi", dir:"ltr", image:spanishImage,
      title:"La Palabra en Cápsulas — आधिकारिक मुखपृष्ठ",
      heading:"इस विशेष स्थान में आपका स्वागत है",
      welcome:[
        "व्यावहारिक, गहन और आसानी से समझ आने वाले विचारों को साझा करने का स्थान,",
        "ताकि आप विश्वास के साथ",
        "परमेश्वर के",
        "साथ",
        "चल सकें।"
      ],
      button:"खोजें",
      menu:"/Explora/menu.html?lang=hi"
    },

    ru: {
      lang:"ru", dir:"ltr", image:spanishImage,
      title:"La Palabra en Cápsulas — Официальная главная страница",
      heading:"Добро пожаловать в это пространство",
      welcome:[
        "Место, где делятся практичными,",
        "глубокими и доступными идеями,",
        "помогающими уверенно идти",
        "с",
        "Богом."
      ],
      button:"Исследовать",
      menu:"/Explora/menu.html?lang=ru"
    },

    de: {
      lang:"de", dir:"ltr", image:spanishImage,
      title:"La Palabra en Cápsulas — Offizielle Startseite",
      heading:"Willkommen an diesem Ort",
      welcome:[
        "Ein Ort, an dem praktische,",
        "tiefgründige und verständliche Ideen geteilt werden,",
        "damit Sie sicher",
        "mit",
        "Gott gehen können."
      ],
      button:"Entdecken",
      menu:"/Explora/menu.html?lang=de"
    },

    ja: {
      lang:"ja", dir:"ltr", image:spanishImage,
      title:"La Palabra en Cápsulas — 公式ホームページ",
      heading:"この特別な場所へようこそ",
      welcome:[
        "実践的で深く、分かりやすい考えを分かち合う場所です。",
        "神と共に",
        "確かな歩みを",
        "進めて",
        "いきましょう。"
      ],
      button:"探検する",
      menu:"/Explora/menu.html?lang=ja"
    }
  };

  const image = document.getElementById("coverImage");
  const welcome = document.getElementById("welcomeText");
  const explore = document.getElementById("exploreButton");
  const languageButtons = document.querySelectorAll(".lang-link");

  function renderWelcome(data) {
    welcome.replaceChildren();

    const heading = document.createElement("span");
    heading.className = "welcome-title";
    heading.textContent = data.heading;
    heading.style.animationDelay = "0.12s";
    welcome.appendChild(heading);

    data.welcome.forEach(function (line, index) {
      const span = document.createElement("span");
      span.className = "welcome-line";
      span.textContent = line;
      span.style.animationDelay = (0.55 + index * 0.24) + "s";
      welcome.appendChild(span);
    });
  }

  function changeLanguage(lang) {
    if (!translations[lang]) lang = "es";

    const data = translations[lang];

    document.documentElement.lang = data.lang;
    document.documentElement.dir = data.dir;
    document.title = data.title;

    image.onerror = function () {
      image.onerror = null;

      if (image.getAttribute("src") !== spanishImage) {
        image.src = spanishImage;
      }
    };

    image.src = data.image;

    renderWelcome(data);

    explore.textContent = data.button;
    explore.href = data.menu;

    languageButtons.forEach(function (button) {
      const selected = button.id === "link-" + lang;

      button.classList.toggle("active", selected);
      button.setAttribute("aria-pressed", String(selected));
    });

    try {
      localStorage.setItem("lpc-language", lang);
      localStorage.setItem("user_language", lang);
    } catch (error) {}
  }

  window.changeLanguage = changeLanguage;

  const urlParams = new URLSearchParams(window.location.search);
  const requestedLanguage = urlParams.get("lang");
  let initialLanguage = "es";

  try {
    initialLanguage = requestedLanguage ||
      localStorage.getItem("lpc-language") ||
      localStorage.getItem("user_language") ||
      "es";
  } catch (error) {
    initialLanguage = requestedLanguage || "es";
  }

  changeLanguage(initialLanguage);
})();
</script>
</body>
</html>
