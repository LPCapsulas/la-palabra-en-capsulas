<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F4EC">
<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --azul: #17365D;
  --azul-boton: #0F4C81;
  --fondo: #F8F4EC;
  --dorado: #B99A59;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--fondo);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--fondo);
  color: var(--azul);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.page {
  width: 100%;
  max-width: 1100px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 10px 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.language-bar {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 19px;
  padding: 5px 0 12px;
}

.language-button {
  border: 0;
  padding: 4px 2px;
  background: transparent;
  color: var(--azul);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

.language-button:hover,
.language-button:focus-visible {
  color: var(--dorado);
  text-decoration: underline;
}

.language-button.active {
  font-weight: 700;
  text-decoration: underline;
  text-decoration-color: var(--dorado);
  text-underline-offset: 4px;
}

.separator {
  width: 100%;
  max-width: 850px;
  height: 1px;
  flex-shrink: 0;
  background: var(--dorado);
  margin: 0 auto 12px;
}

.cover-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.cover-image {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  max-height: calc(100vh - 190px);
  object-fit: contain;
  object-position: center;
  margin: 0 auto;
}

.welcome {
  width: 100%;
  max-width: 820px;
  margin: 14px auto 16px;
  padding: 0 10px;
  color: var(--azul);
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(17px, 2vw, 22px);
  line-height: 1.55;
}

.welcome-line {
  display: block;
  opacity: 0;
  transform: translateY(9px);
  animation: cascade-in 0.65s ease forwards;
}

.welcome-line:nth-child(1) {
  animation-delay: 0.12s;
}

.welcome-line:nth-child(2) {
  animation-delay: 0.4s;
}

.welcome-line:nth-child(3) {
  animation-delay: 0.68s;
}

@keyframes cascade-in {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.explore-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 180px;
  min-height: 46px;
  margin: 0 auto 5px;
  padding: 10px 30px;
  border: 1px solid var(--azul-boton);
  border-radius: 7px;
  background: var(--azul-boton);
  color: #fff;
  text-decoration: none;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  box-shadow: 0 3px 8px rgba(23, 54, 93, 0.15);
  transition: background 0.2s ease, transform 0.2s ease;
}

.explore-button:hover,
.explore-button:focus-visible {
  background: var(--azul);
  transform: translateY(-1px);
}

html[dir="rtl"] .welcome {
  direction: rtl;
}

@media (min-width: 761px) {
  .cover-image {
    max-width: 900px;
  }

  .welcome {
    margin-top: 10px;
    margin-bottom: 12px;
  }
}

@media (max-width: 760px) {
  .page {
    min-height: 100svh;
    padding: 5px 0 10px;
  }

  .language-bar {
    gap: 4px 13px;
    padding: 5px 8px 9px;
  }

  .language-button {
    font-size: 13px;
    padding: 4px 1px;
  }

  .separator {
    width: calc(100% - 24px);
    margin-bottom: 7px;
  }

  .cover-image {
    width: 100%;
    max-width: 100%;
    max-height: 48svh;
    height: auto;
    object-fit: contain;
    object-position: center;
  }

  .welcome {
    margin: 8px auto 10px;
    padding: 0 15px;
    font-size: 16px;
    line-height: 1.42;
  }

  .explore-button {
    min-width: 165px;
    min-height: 43px;
    padding: 9px 26px;
    font-size: 16px;
  }
}

@media (max-width: 380px) {
  .language-bar {
    column-gap: 10px;
    row-gap: 3px;
  }

  .language-button {
    font-size: 12px;
  }

  .cover-image {
    max-height: 44svh;
  }

  .welcome {
    margin-top: 6px;
    margin-bottom: 7px;
    padding: 0 12px;
    font-size: 15px;
    line-height: 1.35;
  }

  .explore-button {
    min-height: 41px;
  }
}

@media (max-height: 700px) and (max-width: 760px) {
  .cover-image {
    max-height: 39svh;
  }

  .welcome {
    margin-top: 5px;
    margin-bottom: 6px;
    font-size: 14px;
    line-height: 1.3;
  }

  .explore-button {
    min-height: 38px;
    padding-top: 7px;
    padding-bottom: 7px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .welcome-line {
    opacity: 1;
    transform: none;
    animation: none;
  }

  * {
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="page">

  <nav class="language-bar" aria-label="Seleccionar idioma">
    <button class="language-button active" type="button" data-lang="es" aria-pressed="true">Español</button>
    <button class="language-button" type="button" data-lang="en" aria-pressed="false">English</button>
    <button class="language-button" type="button" data-lang="zh" aria-pressed="false">中文</button>
    <button class="language-button" type="button" data-lang="fr" aria-pressed="false">Français</button>
    <button class="language-button" type="button" data-lang="it" aria-pressed="false">Italiano</button>
    <button class="language-button" type="button" data-lang="pt" aria-pressed="false">Português</button>
    <button class="language-button" type="button" data-lang="he" aria-pressed="false">עברית</button>
    <button class="language-button" type="button" data-lang="ar" aria-pressed="false">العربية</button>
    <button class="language-button" type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
    <button class="language-button" type="button" data-lang="ru" aria-pressed="false">Русский</button>
    <button class="language-button" type="button" data-lang="de" aria-pressed="false">Deutsch</button>
    <button class="language-button" type="button" data-lang="ja" aria-pressed="false">日本語</button>
  </nav>

  <div class="separator" aria-hidden="true"></div>

  <section class="cover-area">
    <img
      id="coverImage"
      class="cover-image"
      src="/Explora/portada.jpg"
      alt="La Palabra en Cápsulas: Fe, Poder y Vida"
      fetchpriority="high"
    >

    <div id="welcomeText" class="welcome" aria-live="polite">
      <span class="welcome-line">¡Bienvenido a La Palabra en Cápsulas!</span>
      <span class="welcome-line">Un espacio para fortalecer tu fe y crecer en conocimiento.</span>
      <span class="welcome-line">Mira, crece y comparte.</span>
    </div>

    <a id="exploreButton" class="explore-button" href="/Explora/menu.html?lang=es">
      Explora
    </a>
  </section>

</main>

<script>
(function () {
  "use strict";

  const spanishImage = "/Explora/portada.jpg";

  const translations = {
    es: {
      lang: "es",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Portada Oficial",
      welcome: [
        "¡Bienvenido a La Palabra en Cápsulas!",
        "Un espacio para fortalecer tu fe y crecer en conocimiento.",
        "Mira, crece y comparte."
      ],
      button: "Explora",
      menu: "/Explora/menu.html?lang=es"
    },
    en: {
      lang: "en",
      dir: "ltr",
      image: "/Explora/portada-en.png",
      title: "The Word in Capsules — Official Home",
      welcome: [
        "Welcome to The Word in Capsules!",
        "A place to strengthen your faith and grow in knowledge.",
        "Look, Grow and Share."
      ],
      button: "Explore",
      menu: "/Explora/menu.html?lang=en"
    },
    fr: {
      lang: "fr",
      dir: "ltr",
      image: "/Explora/portada-fr.png",
      title: "La Parole en Capsules — Page d’accueil officielle",
      welcome: [
        "Bienvenue sur La Parole en Capsules !",
        "Un espace pour fortifier votre foi et approfondir vos connaissances.",
        "Découvre, grandis et partage."
      ],
      button: "Explorer",
      menu: "/Explora/menu.html?lang=fr"
    },
    zh: {
      lang: "zh-CN",
      dir: "ltr",
      image: "/Explora/portada-zh.png",
      title: "胶囊中的话语 — 官方主页",
      welcome: [
        "欢迎来到《胶囊中的话语》！",
        "在这里坚定信仰，增长知识。",
        "阅读、成长、分享。"
      ],
      button: "开始探索",
      menu: "/Explora/menu.html?lang=zh"
    },
    it: {
      lang: "it",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Pagina ufficiale",
      welcome: [
        "Benvenuto a La Palabra en Cápsulas!",
        "Uno spazio per rafforzare la fede e crescere nella conoscenza.",
        "Guarda, cresci e condividi."
      ],
      button: "Esplora",
      menu: "/Explora/menu.html?lang=it"
    },
    pt: {
      lang: "pt",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Página oficial",
      welcome: [
        "Bem-vindo a La Palabra en Cápsulas!",
        "Um espaço para fortalecer a fé e crescer em conhecimento.",
        "Veja, cresça e compartilhe."
      ],
      button: "Explorar",
      menu: "/Explora/menu.html?lang=pt"
    },
    he: {
      lang: "he",
      dir: "rtl",
      image: spanishImage,
      title: "La Palabra en Cápsulas — דף הבית הרשמי",
      welcome: [
        "ברוכים הבאים ל־La Palabra en Cápsulas!",
        "מקום לחיזוק האמונה ולהעמקת הידע.",
        "התבוננו, צמחו ושתפו."
      ],
      button: "גלו",
      menu: "/Explora/menu.html?lang=he"
    },
    ar: {
      lang: "ar",
      dir: "rtl",
      image: spanishImage,
      title: "La Palabra en Cápsulas — الصفحة الرئيسية الرسمية",
      welcome: [
        "مرحبًا بكم في La Palabra en Cápsulas!",
        "مساحة لتعزيز الإيمان والنمو في المعرفة.",
        "اكتشف، انمُ وشارك."
      ],
      button: "استكشف",
      menu: "/Explora/menu.html?lang=ar"
    },
    hi: {
      lang: "hi",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — आधिकारिक मुखपृष्ठ",
      welcome: [
        "La Palabra en Cápsulas में आपका स्वागत है!",
        "आस्था को मज़बूत करने और ज्ञान में बढ़ने का एक स्थान।",
        "देखें, बढ़ें और साझा करें।"
      ],
      button: "खोजें",
      menu: "/Explora/menu.html?lang=hi"
    },
    ru: {
      lang: "ru",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Официальная главная страница",
      welcome: [
        "Добро пожаловать на La Palabra en Cápsulas!",
        "Место, где можно укрепить веру и расширить знания.",
        "Смотри, расти и делись."
      ],
      button: "Исследовать",
      menu: "/Explora/menu.html?lang=ru"
    },
    de: {
      lang: "de",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Offizielle Startseite",
      welcome: [
        "Willkommen bei La Palabra en Cápsulas!",
        "Ein Ort, um den Glauben zu stärken und Wissen zu erweitern.",
        "Entdecken, wachsen und teilen."
      ],
      button: "Entdecken",
      menu: "/Explora/menu.html?lang=de"
    },
    ja: {
      lang: "ja",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — 公式ホームページ",
      welcome: [
        "La Palabra en Cápsulasへようこそ！",
        "信仰を強め、知識を深めるための場所です。",
        "見て、成長し、分かち合いましょう。"
      ],
      button: "探検する",
      menu: "/Explora/menu.html?lang=ja"
    }
  };

  const image = document.getElementById("coverImage");
  const welcome = document.getElementById("welcomeText");
  const explore = document.getElementById("exploreButton");
  const languageButtons = document.querySelectorAll(".language-button");

  function getInitialLanguage() {
    const params = new URLSearchParams(window.location.search);
    const requested = params.get("lang");

    if (requested && translations[requested]) {
      return requested;
    }

    try {
      const saved =
        localStorage.getItem("lpc-language") ||
        localStorage.getItem("user_language");

      if (saved && translations[saved]) {
        return saved;
      }
    } catch (error) {}

    return "es";
  }

  function renderWelcome(lines) {
    welcome.replaceChildren();

    lines.forEach(function (line, index) {
      const span = document.createElement("span");
      span.className = "welcome-line";
      span.textContent = line;
      span.style.animationDelay = (0.12 + index * 0.28) + "s";
      welcome.appendChild(span);
    });
  }

  function setLanguage(language) {
    const key = translations[language] ? language : "es";
    const data = translations[key];

    document.documentElement.lang = data.lang;
    document.documentElement.dir = data.dir;
    document.title = data.title;

    image.onerror = function () {
      if (image.getAttribute("src") !== spanishImage) {
        image.onerror = null;
        image.src = spanishImage;
      }
    };

    image.src = data.image;
    renderWelcome(data.welcome);

    explore.textContent = data.button;
    explore.href = data.menu;

    languageButtons.forEach(function (button) {
      const active = button.dataset.lang === key;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
    });

    try {
      localStorage.setItem("lpc-language", key);
      localStorage.setItem("user_language", key);
    } catch (error) {}
  }

  languageButtons.forEach(function (button) {
    button.addEventListener("click", function () {
      setLanguage(button.dataset.lang);
    });
  });

  setLanguage(getInitialLanguage());
})();
</script>
</body>
</html>
