```html
<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Menú Oficial — La Palabra en Cápsulas</title>

  <style>

    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;

      --menu-bg: #0F4C81;

      --menu: #ffffff;
      --menu-hover: #ffffff;

      --paper: #0F4C81;
      --bg: #0F4C81;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.75;

      zoom: 90%;
    }


    /* =====================================================
       PÁGINA PRINCIPAL
       ===================================================== */

    .page {
      width: min(750px, calc(100% - 32px));
      margin: 48px auto;

      background: var(--paper);

      padding: 56px 64px 60px;

      border-radius: 12px;
    }


    /* =====================================================
       ENCABEZADO
       ===================================================== */

    .menu-header {
      text-align: center;
      margin-bottom: 42px;
    }


    .menu-header h1 {
      font-family: 'Cinzel', Georgia, serif;

      font-size: 30px;
      line-height: 1.3;

      letter-spacing: 2px;

      color: #000000;

      font-weight: 600;
    }


    /* =====================================================
       MONOGRAMA LPC
       ===================================================== */

    .lpc-logo {
      width: 64px;
      height: 64px;

      margin: 0 0 22px 0;

      display: flex;
      align-items: center;
      justify-content: flex-start;
    }


    .lpc-logo svg {
      width: 64px;
      height: 64px;

      display: block;
    }


    .lpc-logo text {
      fill: #ffffff;

      font-family: 'Cinzel', Georgia, serif;

      font-weight: 600;
    }


    /* =====================================================
       MENÚ VERTICAL
       ===================================================== */

    .menu-list-container {

      width: fit-content;

      min-width: 270px;

      margin: 0 auto 44px;

      border-right: 1px solid rgba(255,255,255,.65);

      padding: 2px 42px 4px 0;
    }


    .menu-button {

      display: block;

      color: var(--menu);

      font-family: 'Playfair Display',
                   Georgia,
                   "Times New Roman",
                   serif;

      font-size: 24px;

      line-height: 1.25;

      font-weight: 500;

      text-align: right;

      text-decoration: none;

      padding: 7px 0;

      transition:
        color .2s ease,
        transform .2s ease,
        text-shadow .2s ease;
    }


    /* =====================================================
       EFECTO AL PASAR EL MOUSE
       ===================================================== */

    .menu-button:hover {

      color: #ffffff;

      transform: translateX(-5px);

      text-shadow:
        0 0 8px rgba(255,255,255,.55);
    }


    .menu-button:focus-visible {

      color: #ffffff;

      outline: none;

      text-decoration: underline;

      text-underline-offset: 5px;
    }


    .menu-button:active {

      transform: translateX(-2px);
    }


    /* =====================================================
       VOLVER A INICIO
       ===================================================== */

    .back-home {

      text-align: center;

      border-top:
        1px solid rgba(255,255,255,.30);

      padding-top: 28px;
    }


    .back-home a {

      color: #000000;

      font-family: 'Cinzel', Georgia, serif;

      font-size: 15px;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-decoration: none;

      transition: color .2s ease;
    }


    .back-home a:hover {

      color: #ffffff;
    }


    .back-home a:active {

      color: #ffffff;
    }


    /* =====================================================
       PC
       
       TODO EL BLOQUE SUBE DOS ESCALAS.
       No se mueve solamente el logo.
       ===================================================== */

    @media(min-width:701px) {

      .page {
        transform: translateY(-20px);
      }

    }


    /* =====================================================
       ADAPTACIÓN PARA MÓVILES
       ===================================================== */

    @media(max-width:700px) {

      body {
        zoom: 100%;
      }


      .page {

        padding: 42px 24px 48px;

        margin: 16px auto;

        width: calc(100% - 24px);

        /* Posición normal en móvil vertical */
        transform: none;
      }


      /* -----------------------------------------------------
         LPC EN MÓVIL
         ----------------------------------------------------- */

      .lpc-logo {

        width: 54px;
        height: 54px;

        margin-bottom: 24px;
      }


      .lpc-logo svg {

        width: 54px;
        height: 54px;
      }


      /* -----------------------------------------------------
         ENCABEZADO
         ----------------------------------------------------- */

      .menu-header {

        text-align: center;

        margin-bottom: 34px;
      }


      .menu-header h1 {

        font-size: 26px;

        letter-spacing: 1.5px;
      }


      /* -----------------------------------------------------
         MENÚ EN MÓVIL
         ----------------------------------------------------- */

      .menu-list-container {

        min-width: 0;

        width: 100%;

        margin: 0 0 38px 0;

        padding: 2px 0 4px 0;

        border-right: none;
      }


      .menu-button {

        font-size: 22px;

        padding: 6px 0;

        text-align: left;
      }


      .menu-button:hover {

        transform: translateX(5px);
      }


      .menu-button:active {

        transform: translateX(2px);
      }


      /* -----------------------------------------------------
         VOLVER A INICIO
         ----------------------------------------------------- */

      .back-home {

        padding-top: 24px;
      }


      .back-home a {

        font-size: 14px;

        font-weight: 700;
      }


      .back-home a:active {

        color: #ffffff;
      }

    }


    /* =====================================================
       CELULAR HORIZONTAL
       
       También sube TODO el bloque dos escalas.
       El celular vertical NO se modifica.
       ===================================================== */

    @media(max-width:700px) and (orientation:landscape) {

      .page {
        transform: translateY(-20px);
      }

    }

  </style>


  <link rel="preconnect"
        href="https://fonts.googleapis.com">

        href="https://fonts.gstatic.com"
        crossorigin>

</head>

</html>
