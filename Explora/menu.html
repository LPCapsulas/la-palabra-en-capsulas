<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú Oficial — La Palabra en Cápsulas</title>
  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      /* Tono azul claro moderno para el fondo de los botones */
      --light-blue: #4A82B8; 
      --light-blue-hover: #356799;
      --paper: #fff;
      --bg: #f2f0ec;
      --quote: #f7f4ef;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.75;
      zoom: 90%;
    }
    
    .page {
      width: min(750px, calc(100% - 32px)); /* Ancho controlado ideal para paneles tipo lista */
      margin: 48px auto;
      background: var(--paper);
      padding: 56px 64px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      border-radius: 12px;
    }
    
    /* ===================================================== ENCABEZADO ELEGANTE ===================================================== */
    .menu-header {
      text-align: center;
      margin-bottom: 44px;
    }
    
    .menu-header h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 30px;
      line-height: 1.3;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 600;
    }
    
    /* ===================================================== CONTENEDOR TIPO GITHUB SETTINGS ===================================================== */
    .menu-list-container {
      display: flex;
      flex-direction: column;
      gap: 16px; /* Separación vertical constante entre bloques */
      max-width: 550px;
      margin: 0 auto 40px;
    }
    
    /* ===================================================== DISEÑO DE BOTONES (AZUL CLARO / TEXTO BLANCO) ===================================================== */
    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px 24px;
      background-color: var(--light-blue);
      color: #ffffff;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      text-decoration: none;
      border: 1px solid rgba(23, 54, 93, 0.15);
      border-radius: 8px; /* Bordes sutilmente redondeados */
      box-shadow: 0 2px 8px rgba(74, 130, 184, 0.15);
      transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    
    .menu-button:hover {
      background-color: var(--light-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(23, 54, 93, 0.25);
    }
    
    .menu-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 4px rgba(23, 54, 93, 0.15);
    }
    
    /* ===================================================== VOLVER A INICIO ===================================================== */
    .back-home {
      text-align: center;
      border-top: 1px solid #eaeaea;
      padding-top: 28px;
    }
    
    .back-home a {
      color: var(--muted);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-decoration: none;
      transition: color .2s ease;
    }
    
    .back-home a:hover {
      color: var(--accent);
      text-decoration: none;
    }
    
    /* ===================================================== ADAPTACIÓN PARA MÓVILES ===================================================== */
    @media(max-width:700px) {
      body {
        zoom: 100%;
      }
      .page {
        padding: 40px 20px;
        margin: 16px auto;
        width: calc(100% - 24px);
      }
      .menu-header {
        margin-bottom: 32px;
      }
      .menu-header h1 {
        font-size: 26px;
        letter-spacing: 1.5px;
      }
      .menu-list-container {
        gap: 12px;
      }
      .menu-button {
        padding: 16px 20px;
        font-size: 15px;
        letter-spacing: 1.5px;
      }
    }
  </style>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="page">
    
    <!-- ===================================================== ENCABEZADO ELEGANTE ===================================================== -->
    <header class="menu-header">
      <h1>Mira, Crece y Comparte</h1>
    </header>

    <!-- ===================================================== LISTA DE SECCIONES (RUTAS VERIFICADAS) ===================================================== -->
    <div class="menu-list-container">
      
      <!-- 1. Testimonios -->
      <a class="menu-button" href="testimonios/index.html">
        Testimonios
      </a>
      
      <!-- 2. Enseñanzas -->
      <a class="menu-button" href="ensenanzas/index.html">
        Enseñanzas
      </a>
      
      <!-- 3. Oración -->
      <a class="menu-button" href="oracion/index.html">
        Oración
      </a>
      
      <!-- 4. Guías (Conserva tu ruta exacta) -->
      <a class="menu-button" href="guias/gnc/index.html">
        Guías
      </a>
      
      <!-- 5. Proyectos -->
      <a class="menu-button" href="proyectos/index.html">
        Proyectos
      </a>
      
      <!-- 6. Donar -->
      <a class="menu-button" href="donar/index.html">
        Donar
      </a>
      
    </div>

    <!-- ===================================================== VOLVER A LA PORTADA PRINCIPAL ===================================================== -->
    <div class="back-home">
      <a href="../index.html">← Volver a Inicio</a>
    </div>

  </main>

</body>
</html>
