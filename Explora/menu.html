<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explora — La Palabra en Cápsulas</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0F4C81;
        color: #ffffff;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 30px;
    }

    .content {
        width: 100%;
        max-width: 760px;
        text-align: center;
        border-right: 1px solid rgba(255,255,255,0.55);
        padding-right: 70px;
    }

    .logo {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-weight: 700;
        font-style: italic;
        letter-spacing: 1px;
        margin-bottom: 35px;
        opacity: 0.95;
    }

    h1 {
        margin: 0 0 42px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 38px;
        font-weight: 700;
        color: #d9b45b;
        letter-spacing: 0.5px;
    }

    .menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
    }

    .menu a {
        color: #ffffff;
        text-decoration: none;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .menu a:hover {
        color: #d9b45b;
    }

    .back {
        margin-top: 50px;
    }

    .back a {
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
    }

    .back a:hover {
        color: #d9b45b;
    }

    @media (max-width: 700px) {

        .page {
            justify-content: flex-start;
            align-items: flex-start;
            padding: 45px 28px;
        }

        .content {
            text-align: left;
            border-right: none;
            padding-right: 0;
            max-width: 100%;
        }

        .logo {
            font-size: 18px;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 36px;
        }

        .menu {
            align-items: flex-start;
            gap: 20px;
        }

        .menu a {
            font-size: 22px;
        }

        .back {
            margin-top: 42px;
        }
    }
</style>

</head>

<body>

<div class="page">
