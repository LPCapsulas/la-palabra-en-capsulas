<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explora — La Palabra en Cápsulas</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background: #0F4C81;
        color: #ffffff;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    header {
        padding: 28px 40px 10px;
        position: relative;
    }

    .logo {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        font-weight: bold;
        font-style: italic;
        color: #ffffff;
        letter-spacing: 1px;
    }

    .intro {
        text-align: center;
        margin-top: 45px;
        margin-bottom: 35px;
    }

    .intro h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 34px;
        letter-spacing: 2px;
        color: #e7c96f;
    }

    .intro p {
        margin: 12px 0 0;
        font-size: 20px;
        color: #D6D2C4;
    }

    .menu {
        width: 760px;
        max-width: 90%;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 70px;
        row-gap: 0;
    }

    .menu > div:first-child {
        grid-column: 1;
    }

    .menu > div.right {
        grid-column: 2;
        border-left: 1px solid rgba(255,255,255,0.45);
        padding-left: 55px;
    }

    .menu a {
        display: block;
        color: #ffffff;
        text-decoration: none;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        padding: 15px 20px;
        transition: color 0.2s ease;
    }

    .menu a:hover {
        color: #e7c96f;
    }

    .back {
        text-align: center;
        margin-top: 45px;
        padding-bottom: 30px;
    }

    .back a {
        color: #e7c96f;
        text-decoration: none;
        font-size: 18px;
        border-bottom: 1px solid rgba(231,201,111,0.7);
        padding-bottom: 3px;
    }

    .back a:hover {
        color: #ffffff;
        border-color: #ffffff;
    }

    @media (max-width: 700px) {

        header {
            padding: 22px 24px 5px;
        }

        .logo {
            font-size: 19px;
        }

        .intro {
            text-align: left;
            margin: 35px 24px 28px;
        }

        .intro h1 {
            font-size: 29px;
            letter-spacing: 1px;
        }

        .intro p {
            font-size: 16px;
            line-height: 1.5;
        }

        .menu {
            width: auto;
            max-width: none;
            margin: 0 24px;
            display: block;
        }

        .menu > div:first-child,
        .menu > div.right {
            grid-column: auto;
        }

        .menu a {
            font-size: 20px;
            padding: 13px 0;
        }

        .menu .right {
            border-left: none;
            padding-left: 0;
        }

        .back {
            margin-top: 35px;
            padding-bottom: 25px;
        }
    }
</style>

</head>

<body>

<div class="page">

<header>
    <div class="logo">LPC</div>
</header>

<section class="intro">
    <h1>MIRA, CRECE Y COMPARTE</h1>
    <p>Explora el contenido de La Palabra en Cápsulas</p>
</section>

    <a href="https://lpcapsulas.github.io/la-palabra-en-capsulas/Explora/oracion/index.html">

</div>

<div class="right">

    <a href="https://lpcapsulas.github.io/la-palabra-en-capsulas/Explora/guias/gnc/index.html">

    <a href="https://lpcapsulas.github.io/la-palabra-en-capsulas/Explora/testimonios/index.html">

    </a>
</div>

</div>

</body>
</html>
