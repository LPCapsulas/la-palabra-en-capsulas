:root {
  --blue: #0F4C81;

}

html, body {

  padding: 0;

}

body {

  font-size: 17px;
  line-height: 1.8;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 28px 30px;
}

/* SELECTOR DE IDIOMAS */

.language-bar {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
  font-size: 13px;
  line-height: 1.5;
}

.lang-link {
  padding: 0;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.78);
  font: inherit;
  cursor: pointer;
  text-decoration: none;
  transition: color .2s ease;
}

.lang-link:hover,
.lang-link.active {
  color: var(--gold);
}

.lang-link.active {
  font-weight: 700;
}

.lang-divider {
  color: rgba(255,255,255,.45);
  user-select: none;
}

/* ENCABEZADO */

header {
  text-align: center;
  margin-top: 16px;
  margin-bottom: 32px;
}

h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 46px;
  line-height: 1.2;
  font-weight: bold;
  letter-spacing: .5px;
  color: var(--gold);
}

/* MENÚ */

.menu {
  width: min(850px, 100%);
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 72px;
  position: relative;
  margin-top: 4px;
}

.menu::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: rgba(255,255,255,.25);
  transform: translateX(-50%);
}

.column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.item {
  width: 100%;
  text-align: center;
}

.item a {
  display: inline-block;
  color: #fff;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  font-size: 23px;
  line-height: 1.4;
  padding: 5px 10px;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color .2s ease, border-color .2s ease;
}

.item a:hover {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* VOLVER A INICIO */

.back {
  margin-top: 42px;
  text-align: center;
}

.back a {
  color: var(--gold);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  font-size: 18px;
  line-height: 1.5;
  text-decoration: none;
  border-bottom: 1px solid rgba(231,201,111,.7);
  transition: color .2s ease, border-color .2s ease;
}

.back a:hover {
  color: #fff;
  border-color: #fff;
}

/* CELULAR */

@media (max-width: 600px) {
  .page {
    align-items: flex-start;
    padding: 18px 24px 28px;
  }

  .language-bar {
    margin-bottom: 8px;
  }

  header {
    width: 100%;
    margin-top: 16px;
    margin-bottom: 28px;
    text-align: center;
  }

  h1 {
    font-size: 36px;
    line-height: 1.2;
  }

  .menu {
    display: block;
    width: 100%;
    margin-top: 0;
  }

  .menu::after {
    display: none;
  }

  .column {
    align-items: flex-start;
    gap: 9px;
  }

  .column + .column {
    margin-top: 9px;
  }

  .item {
    text-align: left;
  }

  .item a {
    font-size: 21px;
    line-height: 1.5;

  }

  .back {

    text-align: center;
  }

  .back a {
    font-size: 17px;
  }
}
</style>
</head>

<script>
(function () {

  const translations = {
    es: {
      title: 'Mira, Crece y Comparte',
      documentTitle: 'Mira, Crece y Comparte — La Palabra en Cápsulas',
      menuLabel: 'Menú principal'
    },

    en: {
      title: 'Look, Grow and Share',
      documentTitle: 'Look, Grow and Share — The Word in Capsules',
      menuLabel: 'Main menu'
    },

    fr: {
      title: 'Découvre, Grandis et Partage',
      documentTitle: 'Découvre, Grandis et Partage — La Parole en Capsules',
      menuLabel: 'Menu principal'
    },

    zh: {
      title: '认识、成长与分享',
      documentTitle: '认识、成长与分享 — 胶囊中的圣言',
      menuLabel: '主菜单'
    }
  };

  function changeLanguage(lang) {
    if (!translations[lang]) {
      lang = 'es';
    }

    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.title = translations[lang].documentTitle;

    document.getElementById('page-title').textContent =
      translations[lang].title;

    document.getElementById('main-menu').setAttribute(
      'aria-label',
      translations[lang].menuLabel
    );

    document.querySelectorAll('#main-menu a[data-es]').forEach(function (link) {
      link.textContent = link.getAttribute('data-' + lang);
    });

    const backLink = document.getElementById('back-link');
    backLink.textContent = backLink.getAttribute('data-' + lang);

    document.querySelectorAll('.lang-link').forEach(function (button) {
      const selected = button.id === 'link-' + lang;
      button.classList.toggle('active', selected);
      button.setAttribute('aria-pressed', String(selected));
    });

    try {
      localStorage.setItem('lpc-language', lang);
      localStorage.setItem('user_language', lang);
    } catch (error) {
      // El menú sigue funcionando si el almacenamiento está desactivado.
    }
  }

  window.changeLanguage = changeLanguage;

  /* LEE PRIMERO EL IDIOMA ENVIADO POR LA PORTADA */

  const urlParams = new URLSearchParams(window.location.search);
  const requestedLanguage = urlParams.get('lang');

  let initialLanguage = 'es';

  try {
    initialLanguage =
      requestedLanguage ||
      localStorage.getItem('lpc-language') ||
      localStorage.getItem('user_language') ||
      'es';
  } catch (error) {
    initialLanguage = requestedLanguage || 'es';
  }

  changeLanguage(initialLanguage);

})();
</script>
