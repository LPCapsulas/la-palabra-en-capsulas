<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>
  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      --brand-blue: #112952;
      --paper: #fff;
      --bg: #f2f0ec;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 17px;
      line-height: 1.8;
      zoom: 100%;
    }
    .page {
      width: min(900px, calc(100% - 32px));
      margin: 2px auto;
      background: var(--paper);
      padding: 10px 72px 22px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
    }
    .language-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 2px 0 14px;
      margin-bottom: 15px;
      border-bottom: 1px solid #f0ede6;
      font-size: 13px;
      line-height: 1.5;
    }
    .lang-link {
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: color .2s ease;
    }
    .lang-link:hover {
      color: var(--accent);
    }
    .lang-link.active {
      color: var(--brand-blue);
      font-weight: 700;
    }
    .lang-divider {
      color: #ccc;
      user-select: none;
    }
    .banner-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 10px;
      text-align: center;
    }
    .capsules-img {
      display: none; /* Hide all by default to prevent overlapping */
      width: 100%;
      height: auto;
      margin: 0 auto;
    }
    /* Force display only via script */
    .capsules-img.active-banner {
      display: block !important;
    }
    .welcome-text {
      max-width: 760px;
      margin: 0 auto 22px;
      color: var(--brand-blue);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
    }
    .welcome-text p {
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .lang-content {
      display: none;
    }
    .lang-content.visible {
      display: block;
    }
    .explore-button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 auto 2px;
    }
    .explore-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 230px;
      padding: 10px 30px;
      background: #fff;
      color: var(--accent);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 4px;
      box-shadow: 0 3px 10px rgba(23, 54, 93, .07);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
    }
    .explore-button:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(23, 54, 93, .16);
    }
    .explore-button:active {
      transform: translateY(0);
    }
    /* PC Optimization: Prevents scroll to see Explora */
    @media (min-width: 901px) {
      .page {
        padding-top: 2px;
      }
      .language-bar {
        padding-bottom: 8px;
        margin-bottom: 8px;
      }
      .banner-container {
        margin-bottom: 4px;
        max-width: 680px; /* Scaled down slightly for PC screen height fitting */
      }
      .welcome-text {
        margin-bottom: 12px;
        font-size: 16px;
      }
    }
    /* Mobile Vertical (Portrait): Fixed 30% gap fix */
    @media (max-width: 700px) and (orientation: portrait) {
      .page {
        width: 100%;
        margin: 0 auto;
        padding: 10px 24px 45px; /* Added padding at bottom */
      }
      .language-bar {
        justify-content: flex-end;
        padding-bottom: 12px;
        margin-bottom: 12px;
      }
      .banner-container {
        margin-bottom: 25px; /* Pushes content down to fill space */
      }
      .welcome-text {
        max-width: 290px;
        margin: 0 auto 35px; /* Enlarged lower margin by ~30% */
        font-size: 15px;
        line-height: 1.45;
      }
      .explore-button {
        min-width: 190px;
        padding: 12px 28px;
      }
    }
    /* Mobile Horizontal (Landscape): Left completely untouched */
    @media (max-width: 900px) and (orientation: landscape) {
      .page {
        width: min(900px, calc(100% - 32px));
        padding: 10px 40px 22px;
        margin: 2px auto;
      }
      .banner-container {
        margin-bottom: 10px;
      }
      .welcome-text {
        max-width: 760px;
        margin: 0 auto 22px;
        font-size: 16px;
        line-height: 1.4;
      }
      .explore-button {
        min-width: 200px;
        padding: 10px 30px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- SELECTOR DE IDIOMAS -->
    <nav class="language-bar" aria-label="Language selection">
      <button type="button" class="lang-link active" id="link-es" onclick="changeLanguage('es')" aria-pressed="true"> Español </button>
      <span class="lang-divider">|</span>
      <button type="button" class="lang-link" id="link-en" onclick="changeLanguage('en')" aria-pressed="false"> English </button>
      <span class="lang-divider">|</span>
      <button type="button" class="lang-link" id="link-fr" onclick="changeLanguage('fr')" aria-pressed="false"> Français </button>
      <span class="lang-divider">|</span>
      <button type="button" class="lang-link" id="link-zh-CN" onclick="changeLanguage('zh-CN')" aria-pressed="false"> 中文 </button>
    </nav>

    <!-- PORTADAS GRÁFICAS -->
    <div class="banner-container">
      <img id="banner-es" class="capsules-img" src="Explora/portada.png" alt="La Palabra en Cápsulas">
      <img id="banner-en" class="capsules-img" src="Explora/portada-en.png" alt="The Word in Capsules">
      <img id="banner-fr" class="capsules-img" src="Explora/portada-fr.png" alt="La Parole en Capsules">
      <img id="banner-zh-CN" class="capsules-img" src="Explora/portada-zh.png" alt="胶囊中的圣言">
    </div>

    <!-- TEXTO DE BIENVENIDA Y BOTÓN -->
    <section class="welcome-text" aria-live="polite">
      <div id="content-es" class="lang-content visible"><p>Bienvenido a este espacio.</p></div>
      <div id="content-en" class="lang-content"><p>Welcome to this space.</p></div>
      <div id="content-fr" class="lang-content"><p>Bienvenue dans cet espace.</p></div>
      <div id="content-zh-CN" class="lang-content"><p>欢迎来到这个空间。</p></div>
    </section>

    <div class="explore-button-container">
      <a href="Explora/menu.html" class="explore-button" id="btn-explore"> EXPLORA </a>
    </div>
  </main>

  <script>
    function changeLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-link').forEach(l => l.classList.toggle('active', l.id === 'link-' + lang));
      document.querySelectorAll('.lang-content').forEach(c => c.classList.toggle('visible', c.id === 'content-' + lang));
    }
  </script>
</body>
</html>
