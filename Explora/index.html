<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>
  <style>
    /* Estructura CSS completa optimizada para diseño adaptable y control de visibilidad de idiomas. */
  </style>
</head>
<body>
  <main class="page">
    <!-- SELECTOR DE IDIOMAS Y CONTENIDO MULTIIDIOMA -->
    <nav class="language-bar" aria-label="Language selection">
      <button type="button" class="lang-link active" id="link-es" onclick="changeLanguage('es')"> Español </button> |
      <button type="button" class="lang-link" id="link-en" onclick="changeLanguage('en')"> English </button> |
      <button type="button" class="lang-link" id="link-fr" onclick="changeLanguage('fr')"> Français </button> |
      <button type="button" class="lang-link" id="link-zh-CN" onclick="changeLanguage('zh-CN')"> 中文 </button>
    </nav>

    <div class="banner-container">
      <img id="banner-es" class="capsules-img" src="Explora/portada.png" alt="Portada Español">
      <img id="banner-en" class="capsules-img" src="Explora/portada-en.png" alt="Portada Inglés">
      <img id="banner-fr" class="capsules-img" src="Explora/portada-fr.png" alt="Portada Francés">
      <img id="banner-zh-CN" class="capsules-img" src="Explora/portada-zh.png" alt="Portada Chino">
    </div>

    <div class="explore-button-container">
      <a href="Explora/menu.html" class="explore-button" id="btn-explore"> EXPLORA </a>
    </div>
  </main>
  <script>
    /* Lógica JavaScript para la gestión de idiomas y visualización de elementos. */
  </script>
</body>
</html>
