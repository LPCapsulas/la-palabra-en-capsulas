<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F4EC">
<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --azul: #17365D;
  --azul-boton: #0F4C81;
  --fondo: #F8F4EC;
  --dorado: #B99A59;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--fondo);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--fondo);
  color: var(--azul);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.page {
  width: 100%;
  max-width: 1100px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 10px 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* SELECTOR DE IDIOMAS */
.language-bar {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 12px;
  padding: 5px 0 12px;
  font-size: 14px;
}

.lang-link {
  border: 0;
  padding: 4px 2px;
  background: transparent;
  color: var(--azul);
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  transition: color 0.2s ease;
}

.lang-link:hover {
  color: var(--dorado);
  text-decoration: underline;
}

.lang-link.active {
  font-weight: 700;
  color: var(--azul);
  text-decoration: underline;
  text-decoration-color: var(--dorado);
  text-underline-offset: 4px;
}

.lang-divider {
  color: rgba(23, 54, 93, 0.35);
  user-select: none;
}

.separator {
  width: 100%;
  max-width: 850px;
  height: 1px;
  flex-shrink: 0;
  background: var(--dorado);
  margin: 0 auto 12px;
}

.cover-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.cover-image {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  max-height: calc(100vh - 190px);
  object-fit: contain;
  object-position: center;
  margin: 0 auto;
}

.welcome {
  width: 100%;
  max-width: 820px;
  margin: 18px auto 18px;
  padding: 0 10px;
  color: var(--azul);
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(17px, 2vw, 22px);
  line-height: 1.5;
}

.welcome-line {
  display: block;
  opacity: 0;
  transform: translateY(12px);
  animation: cascade-in 0.65s ease forwards;
  margin-bottom: 5px;
}

@keyframes cascade-in {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.explore-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 180px;
  min-height: 46px;
  margin: 10px auto 15px;
  padding: 10px 30px;
  border: 1px solid var(--azul-boton);
  border-radius: 7px;
  background: var(--azul-boton);
  color: #fff;
  text-decoration: none;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  box-shadow: 0 3px 8px rgba(23, 54, 93, 0.15);
  transition: background 0.2s ease, transform 0.2s ease;
}

.explore-button:hover,
.explore-button:focus-visible {
  background: var(--azul);
  transform: translateY(-1px);
}

html[dir="rtl"] .welcome {
  direction: rtl;
}

/* AJUSTES ESPECÍFICOS PARA CELULAR VERTICAL */
@media (max-width: 600px) {
  .page {
    min-height: 100svh;
    padding: 10px 12px 20px;
  }

  .language-bar {
    gap: 4px 8px;
    padding: 5px 0 10px;
    font-size: 13px;
  }

  .separator {
    width: 100%;
    margin-bottom: 10px;
  }

  .cover-image {
    max-height: 40svh;
  }

  .welcome
