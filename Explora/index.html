<!doctype html>
<html lang="es">

<meta charset="utf-8">

<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --text: #252525;
  --muted: #666;
  --accent: #17365D;
  --brand-blue: #112952;
  --paper: #fff;
  --bg: #f2f0ec;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", sans-serif;
  font-size: 17px;
  line-height: 1.8;
  overflow: hidden;
}

.page {
  width: min(900px, calc(100% - 32px));
  height: calc(100vh - 4px);
  margin: 2px auto;
  padding: 16px 56px 24px;
  background: var(--paper);
  box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
  display: flex;
  flex-direction: column;
}

.language-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 2px 0 8px;
  margin-bottom: 10px;
  border-bottom: 1px solid #f0ede6;
  font-size: 13px;
  flex-shrink: 0;
}

.lang-link {
  color: var(--muted);
  background: none;
  border: 0;
  font: inherit;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}

.lang-link:hover {
  color: var(--accent);
}

.lang-link.active {
  color: var(--accent);
  font-weight: bold;
}

.content-wrapper {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.image-container {
  text-align: center;
  margin-bottom: 10px;
  min-height: 0;
}

.cover-image {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  height: auto;
  max-height: 48vh;
  object-fit: contain;
}

.text-container {
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}

.text-container h1 {
  font-size: clamp(23px, 4vw, 34px);
  line-height: 1.3;
}

.text-container p {
  line-height: 1.6;
}

.action-container {
  text-align: center;
  padding-bottom: 15px;
  margin-top: auto;
  min-height: 55px;
}

.btn-explore {
  display: inline-block;
  background-color: var(--brand-blue);
  color: white;
  padding: 14px 40px;
  text-decoration: none;
  border-radius: 4px;
  font-weight: bold;
  transition: background 0.3s;
}

.btn-explore:hover {
  background-color: var(--accent);
}

@media (max-width: 600px) {
  html, body {
    overflow: hidden;
    font-size: 22px;
    line-height: 1.5;
  }

  .page {
    width: calc(100% - 16px);
    padding: 12px 16px 18px;
    height: calc(100vh - 4px);
  }

  .language-bar {
    justify-content: center;
    column-gap: 7px;
    row-gap: 4px;
    font-size: 12px;
    padding-bottom: 8px;
    margin-bottom: 8px;
  }

  .cover-image {
    max-height: 54vh;
    width: 100%;
  }

  .text-container {
    gap: 12px;
  }

  .text-container h1 {
    font-size: 25px;
  }

  .text-container p {
    font-size: 18px;
  }

  .btn-explore {
    padding: 12px 28px;
  }
}

@media (max-height: 650px) {
  .cover-image {
    max-height: 42vh;
  }

  .text-container {
    gap: 6px;
    margin-bottom: 8px;
  }

  .action-container {
    padding-bottom: 6px;
  }
}
</style>
</head>

  </div>
</div>
