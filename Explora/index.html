<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>
  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      --brand-blue: #112952;
      --paper: #fff;
      --bg: #f2f0ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.8;
      overflow: hidden; /* Evita scrolls innecesarios en PC al 100% */
    }

    .page {
      width: min(900px, calc(100% - 32px));
      height: calc(100vh - 4px); /* Forzado a ocupar exactamente el alto de pantalla */
      margin: 2px auto;
      padding: 16px 56px 24px;
      background: var(--paper);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
    }

    /* Selector de idiomas */
    .language-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 0 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid #f0ede6;
      font-size: 13px;
      flex-shrink: 0;
    }

    .lang-link {
      color: var(--muted);
      background: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .lang-link.active {
      color: var(--accent);
      font-weight: bold;
    }

    /* Contenedor de contenido */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Distribuye el espacio eficientemente */
    }

    /* Sección de imagen */
    .image-container {
      text-align: center;
      margin-bottom: 10px;
    }

    .cover-image {
      max-width: 100%;
      height: auto;
      max-height: 45vh; /* Ajuste óptimo para PC */
      object-fit: contain;
    }

    /* Contenedor de texto */
    .text-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    /* Botón de acción principal abajo */
    .action-container {
      text-align: center;
      padding-bottom: 15px;
      margin-top: auto;
    }

    .btn-explore {
      display: inline-block;
      background-color: var(--brand-blue);
      color: white;
      padding: 12px 32px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-explore:hover {
      background-color: var(--accent);
    }

    /* RESPONSIVO: Celular vertical sin espacios muertos */
    @media (max-width: 600px) {
      html, body {
        overflow: hidden; /* Mantiene la app fija en una sola pantalla de celular */
      }
      
      .page {
        padding: 16px 20px 20px;
        height: calc(100vh - 4px);
      }

      .cover-image {
        max-height: 52vh; /* Imagen mucho más alta para empujar el contenido hacia abajo */
        width: 100%;
      }

      html, body {
        font-size: 19px; /* Texto más grande para ocupar espacio */
        line-height: 1.6;
      }
      
      .text-container {
        gap: 16px; /* Más espacio entre título y subtítulo en móviles */
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <header class="language-bar">
      <a href="?lang=es" class="lang-link" data-lang="es">Español</a> | 
      <a href="?lang=zh" class="lang-link" data-lang="zh">中文</a>
    </header>

    <div class="content-wrapper">
      <div class="image-container">
        <img src="portada.jpg" alt="Portada" class="cover-image">
      </div>

      <div class="text-container">
        <h1 id="title">La Palabra en Cápsulas</h1>
        <p id="subtitle">Tu dosis diaria de inspiración y conocimiento.</p>
      </div>

      <div class="action-container">
        <!-- Eliminado el href fijo para evitar que cargue español por defecto -->
        <a id="explore-btn" class="btn-explore">Explora</a>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      es: {
        title: "La Palabra en Cápsulas",
        subtitle: "Tu dosis diaria de inspiración y conocimiento.",
        btnText: "Explora",
        btnUrl: "index_es.html"
      },
      zh: {
        title: "胶囊话语",
        subtitle: "您每日的灵感与知识。",
        btnText: "探索",
        btnUrl: "index_zh.html"
      }
    };

    function setLanguage(lang) {
      if (!translations[lang]) lang = 'es';

      document.documentElement.lang = lang;
      document.getElementById('title').textContent = translations[lang].title;
      document.getElementById('subtitle').textContent = translations[lang].subtitle;
      
      // SOLUCIÓN TOTAL CHINO: Reescribe el href de cero en tiempo real con javascript puro
      const mainBtn = document.getElementById('explore-btn');
      mainBtn.textContent = translations[lang].btnText;
      mainBtn.href = translations[lang].btnUrl;

      // Actualizar los estados activos de las pestañas superiores limpiamente
      document.querySelectorAll('.lang-link').forEach(link => {
        if (link.getAttribute('data-lang') === lang) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    // Comprobar la URL primero
    const urlParams = new URLSearchParams(window.location.search);
    const currentLang = urlParams.get('lang') || 'es';
    setLanguage(currentLang);

    // Interceptar clics de la barra superior y cambiar el estado sin romper el botón inferior
    document.querySelectorAll('.lang-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const lang = link.getAttribute('data-lang');
        history.pushState(null, '', `?lang=${lang}`);
        setLanguage(lang);
      });
    });
  </script>
</body>
</html>
