<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --text: #252525;
  --muted: #666;
  --accent: #17365D;
  --brand-blue: #112952;
  --paper: #fff;
  --bg: #f2f0ec;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", sans-serif;
  font-size: 17px;
  line-height: 1.8;
  overflow: hidden;
}

.page {
  width: min(900px, calc(100% - 32px));
  height: calc(100vh - 4px);
  margin: 2px auto;
  padding: 16px 56px 24px;
  background: var(--paper);
  box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
  display: flex;
  flex-direction: column;
}

.language-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 2px 0 8px;
  margin-bottom: 10px;
  border-bottom: 1px solid #f0ede6;
  font-size: 13px;
  flex-shrink: 0;
}

.lang-link {
  color: var(--muted);
  background: none;
  border: 0;
  font: inherit;
  cursor: pointer;
  text-decoration: none;
}

.lang-link.active {
  color: var(--accent);
  font-weight: bold;
}

.content-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.image-container {
  text-align: center;
  margin-bottom: 10px;
}

.cover-image {
  max-width: 100%;
  height: auto;
  max-height: 48vh;
  object-fit: contain;
}

.text-container {
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}

.action-container {
  text-align: center;
  padding-bottom: 15px;
  margin-top: auto;
  min-height: 55px;
}

.btn-explore {
  display: inline-block;
  background-color: var(--brand-blue);
  color: white;
  padding: 14px 40px;
  text-decoration: none;
  border-radius: 4px;
  font-weight: bold;
  transition: background 0.3s;
}

.btn-explore:hover {
  background-color: var(--accent);
}

@media (max-width: 600px) {
  html, body {
    overflow: hidden;
    font-size: 22px;
    line-height: 1.5;
  }

  .page {
    padding: 20px 24px 24px;
    height: calc(100vh - 4px);
  }

  .cover-image {
    max-height: 62vh;
    width: 100%;
  }

  .text-container {
    gap: 20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="language-bar" aria-label="Seleccionar idioma">
    <a href="?lang=es" class="lang-link" data-lang="es">Español</a>
    |
    <a href="?lang=en" class="lang-link" data-lang="en">English</a>
    |
    <a href="?lang=zh" class="lang-link" data-lang="zh">中文</a>
    |
    <a href="?lang=fr" class="lang-link" data-lang="fr">Français</a>
  </header>

  <div class="content-wrapper">

    <div class="image-container">
      <img src="portada.jpg" alt="Portada" class="cover-image">
    </div>

    <div class="text-container">
      <h1 id="title">La Palabra en Cápsulas</h1>
      <p id="subtitle">Tu dosis diaria de inspiración y conocimiento.</p>
    </div>

    <div class="action-container" id="button-box"></div>

  </div>
</div>
