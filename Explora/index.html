<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>
  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      --brand-blue: #112952;
      --paper: #fff;
      --bg: #f2f0ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.8;
      overflow: hidden; /* Mantiene la interfaz fija en PC al 100% de pantalla sin scrollbars */
    }

    .page {
      width: min(900px, calc(100% - 32px));
      height: calc(100vh - 4px); /* Forzado a ocupar exactamente el alto visible del dispositivo */
      margin: 2px auto;
      padding: 16px 56px 24px;
      background: var(--paper);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
    }

    /* Selector de idiomas superior */
    .language-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 0 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid #f0ede6;
      font-size: 13px;
      flex-shrink: 0;
    }

    .lang-link {
      color: var(--muted);
      background: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .lang-link.active {
      color: var(--accent);
      font-weight: bold;
    }

    /* Contenedor principal elástico */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Sección de la imagen */
    .image-container {
      text-align: center;
      margin-bottom: 10px;
    }

    .cover-image {
      max-width: 100%;
      height: auto;
      max-height: 48vh; /* Proporción ideal para monitores de PC */
      object-fit: contain;
    }

    /* Bloque central de textos en cascada */
    .text-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    /* Contenedor inferior del botón dinámico */
    .action-container {
      text-align: center;
      padding-bottom: 15px;
      margin-top: auto;
      min-height: 55px; /* Evita parpadeos o saltos visuales al inyectar el botón */
    }

    /* Estilos globales aplicados al botón inyectado en tiempo real */
    .btn-explore {
      display: inline-block;
      background-color: var(--brand-blue);
      color: white;
      padding: 14px 40px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-explore:hover {
      background-color: var(--accent);
    }

    /* AJUSTES RESPONSIVOS: Celular vertical optimizado al extremo */
    @media (max-width: 600px) {
      html, body {
        overflow: hidden; /* Congela la pantalla en móviles para prevenir desbordamientos */
      }

      .page {
        padding: 20px 24px 24px;
        height: calc(100vh - 4px);
      }

      .cover-image {
        max-height: 62vh; /* Imagen estirada agresivamente para empujar todo hacia abajo */
        width: 100%;
      }

      html, body {
        font-size: 22px; /* Letras robustas que ocupan y rellenan los huecos vacíos inferiores */
        line-height: 1.5;
      }

      .text-container {
        gap: 20px; /* Mayor separación interna para estirar la cascada en móvil vertical */
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <header class="language-bar">
      <!-- Los atributos data-lang enlazan de forma estricta e inequívoca con el script de abajo -->
      <a href="?lang=es" class="lang-link" data-lang="es">Español</a> | 
      <a href="?lang=en" class="lang-link" data-lang="en">English</a> | 
      <a href="?lang=fr" class="lang-link" data-lang="fr">Français</a> | 
      <a href="?lang=zh" class="lang-link" data-lang="zh">中文</a>
    </header>

    <div class="content-wrapper">
      <div class="image-container">
        <img src="portada.jpg" alt="Portada" class="cover-image">
      </div>

      <div class="text-container">
        <h1 id="title">La Palabra en Cápsulas</h1>
        <p id="subtitle">Tu dosis diaria de inspiración y conocimiento.</p>
      </div>

      <!-- EL HTML NACE LIMPIO. El botón no existe aquí para anular problemas de caché de rutas antiguas -->
      <div class="action-container" id="button-box"></div>
    </div>
  </div>

  <script>
    // Base de datos de traducciones y enrutamientos físicos exactos
    const translations = {
      es: {
        title: "La Palabra en Cápsulas",
        subtitle: "Tu dosis diaria de inspiración y conocimiento.",
        btnText: "Explora",
        btnUrl: "index_es.html"
      },
      en: {
        title: "The Word in Capsules",
        subtitle: "Your daily dose of inspiration and knowledge.",
        btnText: "Explore",
        btnUrl: "index_en.html"
      },
      fr: {
        title: "La Parole en Capsules",
        subtitle: "Votre dose quotidienne d'inspiration et de connaissances.",
        btnText: "Explorer",
        btnUrl: "index_fr.html"
      },
      zh: {
        title: "胶囊话语",
        subtitle: "您每日的灵感与知识。",
        btnText: "探索",
        btnUrl: "index_zh.html"
      }
    };

    // Función unificada que borra, reescribe e instala la interfaz correspondiente
    function setLanguage(lang) {
      if (!translations[lang]) lang = 'es';

      // Almacenamos permanentemente la opción del usuario en el navegador local
      localStorage.setItem('user_language', lang);
      document.documentElement.lang = lang;
      
      // Actualizamos los bloques de texto estáticos
      document.getElementById('title').textContent = translations[lang].title;
      document.getElementById('subtitle').textContent = translations[lang].subtitle;
      
      // DESINSTALACIÓN Y MONTAJE DESDE CERO DEL BOTÓN DE ACCIÓN
      const buttonBox = document.getElementById('button-box');
      buttonBox.innerHTML = ''; // Destruye cualquier botón residual que esté flotando en la memoria

      // Fabricamos el elemento web nativo <a>
      const newBtn = document.createElement('a');
      newBtn.className = 'btn-explore';
      newBtn.textContent = translations[lang].btnText;
      
      // Forzamos directamente por código su dirección URL correspondiente
      newBtn.setAttribute('href', translations[lang].btnUrl);
      
      // Adjuntamos la estructura recién construida al diseño visual
      buttonBox.appendChild(newBtn);

      // Reajustamos dinámicamente el estilo ".active" en la barra de idiomas superior
      document.querySelectorAll('.lang-link').forEach(link => {
        if (link.getAttribute('data-lang') === lang) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    // Algoritmo de detección jerárquica instantánea (URL -> Memoria interna del dispositivo -> Español por defecto)
    const urlParams = new URLSearchParams(window.location.search);
    const savedLang = localStorage.getItem('user_language');
    const currentLang = urlParams.get('lang') || savedLang || 'es';
    
    // Ejecución inicial reactiva al cargar el archivo en el servidor
    setLanguage(currentLang);

    // CONTROLADOR DE INTERCEPCIÓN DE CLICS: Detiene recargas sucias que causen saltos de idioma involuntarios
    document.querySelectorAll('.lang-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault(); // Apaga la recarga por defecto del navegador web
        
        const selectedLang = this.getAttribute('data-lang');
        
        // Empuja silenciosamente el parámetro correspondiente (?lang=xx) en la URL visible
        history.pushState(null, '', `?lang=${selectedLang}`);
        
        // Ejecuta la reescritura total e inmediata del idioma seleccionado
        setLanguage(selectedLang);
      });
    });
  </script>
</body>
</html>
