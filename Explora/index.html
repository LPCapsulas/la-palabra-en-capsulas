<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Palabra en Cápsulas — Portada Oficial</title>
  <style>
    :root {
      --text: #252525;
      --muted: #666;
      --accent: #17365D;
      --brand-blue: #112952;
      --paper: #fff;
      --bg: #f2f0ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.8;
      overflow-x: hidden;
    }

    .page {
      width: min(900px, calc(100% - 32px));
      min-height: calc(100vh - 4px);
      margin: 2px auto;
      padding: 16px 56px 24px;
      background: var(--paper);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
    }

    /* Selector de idiomas fijo arriba */
    .language-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 0 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid #f0ede6;
      font-size: 13px;
      flex-shrink: 0;
    }

    .lang-link {
      color: var(--muted);
      background: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .lang-link.active {
      color: var(--accent);
      font-weight: bold;
    }

    /* Contenedor principal de contenido */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Empuja el botón hacia abajo de forma controlada */
    }

    /* Sección de imagen */
    .image-container {
      text-align: center;
      margin-bottom: 15px; /* Reducido para subir los botones */
    }

    .cover-image {
      max-width: 100%;
      height: auto;
      max-height: 40vh; /* Controla el alto de la imagen en pantallas grandes */
      object-fit: contain;
    }

    /* Textos con efecto cascada */
    .text-container {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Botón de acción principal */
    .action-container {
      text-align: center;
      margin-top: auto; /* Se asegura de estar abajo pero visible */
      padding-bottom: 10px;
    }

    .btn-explore {
      display: inline-block;
      background-color: var(--brand-blue);
      color: white;
      padding: 12px 32px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-explore:hover {
      background-color: var(--accent);
    }

    /* RESPONSIVO: Ajustes optimizados para celular vertical */
    @media (max-width: 600px) {
      .page {
        padding: 16px 20px 20px; /* Reducimos márgenes laterales para ganar espacio */
      }

      .cover-image {
        max-height: 45vh; /* Aumentamos ligeramente el tamaño de la imagen en móvil */
        width: 100%;
      }

      html, body {
        font-size: 18px; /* Aumentamos ligeramente el tamaño del texto */
        line-height: 1.6; /* Ajustamos interlineado para rellenar mejor */
      }

      .text-container p {
        margin-bottom: 12px; /* Distribuye el texto uniformemente hacia abajo sin romper la cascada */
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <header class="language-bar">
      <a href="?lang=es" class="lang-link active" data-lang="es">Español</a> | 
      <a href="?lang=zh" class="lang-link" data-lang="zh">中文</a>
    </header>

    <div class="content-wrapper">
      <div class="image-container">
        <!-- Reemplaza con la ruta real de tu imagen -->
        <img src="portada.jpg" alt="Portada" class="cover-image">
      </div>

      <div class="text-container">
        <h1 id="title">La Palabra en Cápsulas</h1>
        <p id="subtitle">Tu dosis diaria de inspiración y conocimiento.</p>
      </div>

      <div class="action-container">
        <!-- El id dinámico se maneja con JavaScript para cambiar su enlace según el idioma -->
        <a href="index_es.html" id="explore-btn" class="btn-explore">Explora</a>
      </div>
    </div>
  </div>

  <script>
    // Diccionario de textos y ENLACES por idioma
    const translations = {
      es: {
        title: "La Palabra en Cápsulas",
        subtitle: "Tu dosis diaria de inspiración y conocimiento.",
        btnText: "Explora",
        btnUrl: "index_es.html" // Enlace para Español
      },
      zh: {
        title: "胶囊话语",
        subtitle: "您每日 center 的灵感与知识。",
        btnText: "探索",
        btnUrl: "index_zh.html" // Enlace correcto para Chino
      }
    };

    // Función para cambiar de idioma
    function setLanguage(lang) {
      if (!translations[lang]) lang = 'es';

      // Actualizar textos e interfaz
      document.documentElement.lang = lang;
      document.getElementById('title').textContent = translations[lang].title;
      document.getElementById('subtitle').textContent = translations[lang].subtitle;
      
      // SOLUCIÓN PUNTO 3: Cambia el texto Y la URL del botón dinámicamente
      const mainBtn = document.getElementById('explore-btn');
      mainBtn.textContent = translations[lang].btnText;
      mainBtn.href = translations[lang].btnUrl;

      // Actualizar estado activo en la barra superior
      document.querySelectorAll('.lang-link').forEach(link => {
        if (link.getAttribute('data-lang') === lang) {
          制造.classList.add('active');
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    // Detectar idioma desde la URL (?lang=zh o ?lang=es)
    const urlParams = new URLSearchParams(window.location.search);
    const currentLang = urlParams.get('lang') || 'es';
    setLanguage(currentLang);

    // Eventos para cambiar de idioma sin recargar por completo (opcional, mejora la experiencia)
    document.querySelectorAll('.lang-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const lang = link.getAttribute('data-lang');
        // Actualiza la URL visible en el navegador sin recargar de golpe
        history.pushState(null, '', `?lang=${lang}`);
        setLanguage(lang);
      });
    });
  </script>
</body>
</html>
