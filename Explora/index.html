<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F4EC">
<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --azul: #17365D;
  --azul-boton: #0F4C81;
  --fondo: #F8F4EC;
  --dorado: #B99A59;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--fondo);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--fondo);
  color: var(--azul);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

.page {
  width: 100%;
  max-width: 1100px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 10px 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* SELECTOR DE IDIOMAS ADAPTADO DE MENU.HTML */
.language-bar {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 12px;
  padding: 5px 0 12px;
  font-size: 14px;
}

.lang-link {
  border: 0;
  padding: 4px 2px;
  background: transparent;
  color: var(--azul);
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  transition: color 0.2s ease;
}

.lang-link:hover {
  color: var(--dorado);
  text-decoration: underline;
}

.lang-link.active {
  font-weight: 700;
  color: var(--azul);
  text-decoration: underline;
  text-decoration-color: var(--dorado);
  text-underline-offset: 4px;
}

.lang-divider {
  color: rgba(23, 54, 93, 0.35);
  user-select: none;
}

.separator {
  width: 100%;
  max-width: 850px;
  height: 1px;
  flex-shrink: 0;
  background: var(--dorado);
  margin: 0 auto 12px;
}

.cover-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.cover-image {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  max-height: calc(100vh - 190px);
  object-fit: contain;
  object-position: center;
  margin: 0 auto;
}

.welcome {
  width: 100%;
  max-width: 820px;
  margin: 18px auto 18px;
  padding: 0 10px;
  color: var(--azul);
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(17px, 2vw, 22px);
  line-height: 1.5;
}

.welcome-line {
  display: block;
  opacity: 0;
  transform: translateY(12px);
  animation: cascade-in 0.65s ease forwards;
  margin-bottom: 5px;
}

@keyframes cascade-in {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.explore-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 180px;
  min-height: 46px;
  margin: 10px auto 15px;
  padding: 10px 30px;
  border: 1px solid var(--azul-boton);
  border-radius: 7px;
  background: var(--azul-boton);
  color: #fff;
  text-decoration: none;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  box-shadow: 0 3px 8px rgba(23, 54, 93, 0.15);
  transition: background 0.2s ease, transform 0.2s ease;
}

.explore-button:hover,
.explore-button:focus-visible {
  background: var(--azul);
  transform: translateY(-1px);
}

html[dir="rtl"] .welcome {
  direction: rtl;
}

/* AJUSTES ESPECÍFICOS PARA CELULAR VERTICAL */
@media (max-width: 600px) {
  .page {
    min-height: 100svh;
    padding: 10px 12px 20px;
  }

  .language-bar {
    gap: 4px 8px;
    padding: 5px 0 10px;
    font-size: 13px;
  }

  .separator {
    width: 100%;
    margin-bottom: 10px;
  }

  .cover-image {
    max-height: 40svh;
  }

  .welcome {
    margin-top: 24px;
    margin-bottom: 24px;
    padding: 0 10px;
    font-size: 17px;
    line-height: 1.5;
  }

  .welcome-line {
    margin-bottom: 8px;
  }

  .explore-button {
    min-width: 170px;
    min-height: 45px;
    padding: 10px 28px;
    font-size: 16px;
    margin-top: 10px;
    margin-bottom: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .welcome-line {
    opacity: 1;
    transform: none;
    animation: none;
  }
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="page">

  <nav class="language-bar" aria-label="Language selection">
    <button type="button" class="lang-link active" id="link-es" onclick="changeLanguage('es')" aria-pressed="true">Español</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-en" onclick="changeLanguage('en')" aria-pressed="false">English</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-zh" onclick="changeLanguage('zh')" aria-pressed="false">中文</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-fr" onclick="changeLanguage('fr')" aria-pressed="false">Français</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-it" onclick="changeLanguage('it')" aria-pressed="false">Italiano</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-pt" onclick="changeLanguage('pt')" aria-pressed="false">Português</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-he" onclick="changeLanguage('he')" aria-pressed="false">עברית</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-ar" onclick="changeLanguage('ar')" aria-pressed="false">العربية</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-hi" onclick="changeLanguage('hi')" aria-pressed="false">हिन्दी</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-ru" onclick="changeLanguage('ru')" aria-pressed="false">Русский</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-de" onclick="changeLanguage('de')" aria-pressed="false">Deutsch</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-link" id="link-ja" onclick="changeLanguage('ja')" aria-pressed="false">日本語</button>
  </nav>

  <div class="separator" aria-hidden="true"></div>

  <section class="cover-area">
    <img
      id="coverImage"
      class="cover-image"
      src="/Explora/portada.png"
      alt="La Palabra en Cápsulas: Fe, Poder y Vida"
      fetchpriority="high"
    >

    <div id="welcomeText" class="welcome" aria-live="polite">
      <span class="welcome-line">Bienvenido a este espacio.</span>
      <span class="welcome-line">Un lugar dedicado a</span>
      <span class="welcome-line">compartir ideas prácticas,</span>
      <span class="welcome-line">profundas y accesibles</span>
      <span class="welcome-line">para un caminar</span>
      <span class="welcome-line">seguro con Dios</span>
    </div>

    <a id="exploreButton" class="explore-button" href="/Explora/menu.html?lang=es">
      Explora
    </a>
  </section>

</main>

<script>
(function () {
  "use strict";

  const spanishImage = "/Explora/portada.png";

  const translations = {
    es: {
      lang: "es",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Portada Oficial",
      welcome: [
        "Bienvenido a este espacio.",
        "Un lugar dedicado a",
        "compartir ideas prácticas,",
        "profundas y accesibles",
        "para un caminar",
        "seguro con Dios"
      ],
      button: "Explora",
      menu: "/Explora/menu.html?lang=es"
    },
    en: {
      lang: "en",
      dir: "ltr",
      image: "/Explora/portada-en.png",
      title: "The Word in Capsules — Official Home",
      welcome: [
        "Welcome to this space.",
        "A place dedicated to",
        "sharing practical, profound,",
        "and accessible ideas",
        "for a confident walk",
        "with God"
      ],
      button: "Explore",
      menu: "/Explora/menu.html?lang=en"
    },
    fr: {
      lang: "fr",
      dir: "ltr",
      image: "/Explora/portada-fr.png",
      title: "La Parole en Capsules — Page d’accueil officielle",
      welcome: [
        "Bienvenue dans cet espace.",
        "Un lieu dédié au",
        "partage d'idées pratiques,",
        "profondes et accessibles",
        "pour une marche sereine",
        "avec Dieu"
      ],
      button: "Explorer",
      menu: "/Explora/menu.html?lang=fr"
    },
    zh: {
      lang: "zh-CN",
      dir: "ltr",
      image: "/Explora/portada-zh.png",
      title: "胶囊中的话语 — 官方主页",
      welcome: [
        "欢迎来到这个空间。",
        "致力于分享",
        "实用、深刻且通俗易懂的想法，",
        "陪伴您",
        "与神同行"
      ],
      button: "开始探索",
      menu: "/Explora/menu.html?lang=zh"
    },
    it: {
      lang: "it",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Pagina ufficiale",
      welcome: [
        "Benvenuto in questo spazio.",
        "Un luogo dedicato a",
        "condividere idee pratiche,",
        "profonde e accessibili",
        "per un cammino sicuro",
        "con Dio"
      ],
      button: "Esplora",
      menu: "/Explora/menu.html?lang=it"
    },
    pt: {
      lang: "pt",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Página oficial",
      welcome: [
        "Bem-vindo a este espaço.",
        "Um lugar dedicado a",
        "compartilhar ideias práticas,",
        "profundas e acessíveis",
        "para uma caminhada segura",
        "com Deus"
      ],
      button: "Explorar",
      menu: "/Explora/menu.html?lang=pt"
    },
    he: {
      lang: "he",
      dir: "rtl",
      image: spanishImage,
      title: "La Palabra en Cápsulas — דף הבית הרשמי",
      welcome: [
        "ברוכים הבאים למרחב זה.",
        "מקום המוקדש לשתף",
        "רעיונות מעשיים, עמוקים ונגישים",
        "להליכה בטוחה",
        "עם אלוהים"
      ],
      button: "גלו",
      menu: "/Explora/menu.html?lang=he"
    },
    ar: {
      lang: "ar",
      dir: "rtl",
      image: spanishImage,
      title: "La Palabra en Cápsulas — الصفحة الرئيسية الرسمية",
      welcome: [
        "مرحبًا بكم في هذا المساحة.",
        "مكان مخصص لمشاركة",
        "أفكار عملية وعميقة ومتاحة",
        "لمسيرة آمنة",
        "مع الله"
      ],
      button: "استكشف",
      menu: "/Explora/menu.html?lang=ar"
    },
    hi: {
      lang: "hi",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — आधिकारिक मुखपृष्ठ",
      welcome: [
        "इस स्थान में आपका स्वागत है।",
        "व्यावहारिक, व्यावहारिक,",
        "गहरे और सुलभ विचारों को साझा करने dedicated",
        "ईश्वर के साथ एक सुरक्षित",
        "चाल के लिए"
      ],
      button: "खोजें",
      menu: "/Explora/menu.html?lang=hi"
    },
    ru: {
      lang: "ru",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Официальная главная страница",
      welcome: [
        "Добро пожаловать в это пространство.",
        "Место, посвященное",
        "обмену практичными, глубокими",
        "и доступными идеями",
        "для уверенной ходьбы",
        "с Богом"
      ],
      button: "Исследовать",
      menu: "/Explora/menu.html?lang=ru"
    },
    de: {
      lang: "de",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — Offizielle Startseite",
      welcome: [
        "Willkommen in diesem Raum.",
        "Ein Ort, der gewidmet ist,",
        "praktische, tiefe und zugängliche Ideas zu teilen,",
        "für einen sicheren Weg",
        "mit Gott"
      ],
      button: "Entdecken",
      menu: "/Explora/menu.html?lang=de"
    },
    ja: {
      lang: "ja",
      dir: "ltr",
      image: spanishImage,
      title: "La Palabra en Cápsulas — 公式ホームページ",
      welcome: [
        "ようこそこの場所へ。",
        "実践的で深遠で、",
        "分かりやすい考えを共有し、",
        "神と共に歩む確かな歩みのために",
        "捧げられた場所です"
      ],
      button: "探検する",
      menu: "/Explora/menu.html?lang=ja"
    }
  };

  const image = document.getElementById("coverImage");
  const welcome = document.getElementById("welcomeText");
  const explore = document.getElementById("exploreButton");

  function renderWelcome(lines) {
    welcome.innerHTML = "";
    lines.forEach(function (line, index) {
      const span = document.createElement("span");
      span.className = "welcome-line";
      span.textContent = line;
      span.style.animationDelay = (0.12 + index * 0.25) + "s";
      welcome.appendChild(span);
    });
  }

  function changeLanguage(lang) {
    if (!translations[lang]) lang = "es";
    const data = translations[lang];

    document.documentElement.lang = data.lang;
    document.documentElement.dir = data.dir;
    document.title = data.title;

    image.onerror = function () {
      if (image.getAttribute("src") !== spanishImage) {
        image.onerror = null;
        image.src = spanishImage;
      }
    };

    image.src = data.image;
    renderWelcome(data.welcome);

    explore.textContent = data.button;
    explore.href = data.menu;

    document.querySelectorAll(".lang-link").forEach(function (button) {
      const selected = button.id === "link-" + lang;
      button.classList.toggle("active", selected);
      button.setAttribute("aria-pressed", String(selected));
    });

    try {
      localStorage.setItem("lpc-language", lang);
      localStorage.setItem("user_language", lang);
    } catch (error) {}
  }

  window.changeLanguage = changeLanguage;

  const urlParams = new URLSearchParams(window.location.search);
  const requestedLanguage = urlParams.get("lang");
  let initialLanguage = "es";

  try {
    initialLanguage = requestedLanguage || localStorage.getItem("lpc-language") ||
      localStorage.getItem("user_language") || "es";
  } catch (error) {
    initialLanguage = requestedLanguage || "es";
  }

  changeLanguage(initialLanguage);
})();
</script>
</body>
</html>
