
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Palabra en Cápsulas — Portada Oficial</title>

<style>
:root {
  --text: #252525;
  --muted: #666;
  --accent: #17365D;
  --brand-blue: #112952;
  --paper: #fff;
  --bg: #f2f0ec;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  font-size: 17px;
  line-height: 1.8;
  overflow: hidden;
}

.page {
  width: min(900px, calc(100% - 32px));
  height: calc(100vh - 4px);
  margin: 2px auto;
  padding: 16px 56px 24px;
  background: var(--paper);
  box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
  display: flex;
  flex-direction: column;
}

.language-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 2px 0 8px;
  margin-bottom: 10px;
  border-bottom: 1px solid #f0ede6;
  font-size: 13px;
  flex-shrink: 0;
}

.lang-link {
  color: var(--muted);
  background: none;
  border: 0;
  font: inherit;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}

.lang-link:hover {
  color: var(--accent);
}

.lang-link.active {
  color: var(--accent);
  font-weight: bold;
}

.content-wrapper {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.image-container {
  text-align: center;
  margin-bottom: 10px;
  min-height: 0;
}

.cover-image {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  height: auto;
  max-height: 48vh;
  object-fit: contain;
}

.text-container {
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}

.text-container h1 {
  font-size: clamp(23px, 4vw, 34px);
  line-height: 1.3;
}

.text-container p {
  line-height: 1.6;
}

.action-container {
  text-align: center;
  padding-bottom: 15px;
  margin-top: auto;
  min-height: 55px;
}

.btn-explore {
  display: inline-block;
  background-color: var(--brand-blue);
  color: white;
  padding: 14px 40px;
  text-decoration: none;
  border-radius: 4px;
  font-weight: bold;
  transition: background .3s;
}

.btn-explore:hover {
  background-color: var(--accent);
}

@media (max-width: 600px) {
  html, body {
    overflow: hidden;
    font-size: 22px;
    line-height: 1.5;
  }

  .page {
    width: calc(100% - 16px);
    padding: 12px 16px 18px;
    height: calc(100vh - 4px);
  }

  .language-bar {
    justify-content: center;
    column-gap: 7px;
    row-gap: 4px;
    font-size: 12px;
    padding-bottom: 8px;
    margin-bottom: 8px;
  }

  .cover-image {
    max-height: 54vh;
    width: 100%;
  }

  .text-container {
    gap: 12px;
  }

  .text-container h1 {
    font-size: 25px;
  }

  .text-container p {
    font-size: 18px;
  }

  .btn-explore {
    padding: 12px 28px;
  }
}

@media (max-height: 650px) {
  .cover-image {
    max-height: 42vh;
  }

  .text-container {
    gap: 6px;
    margin-bottom: 8px;
  }

  .action-container {
    padding-bottom: 6px;
  }
}
</style>
</head>

<body>
<div class="page">

  <header class="language-bar" aria-label="Seleccionar idioma">
    <a href="?lang=es" class="lang-link" data-lang="es">Español</a>
    <span aria-hidden="true">|</span>
    <a href="?lang=en" class="lang-link" data-lang="en">English</a>
    <span aria-hidden="true">|</span>
    <a href="?lang=fr" class="lang-link" data-lang="fr">Français</a>
    <span aria-hidden="true">|</span>
    <a href="?lang=zh" class="lang-link" data-lang="zh">中文</a>
    <span aria-hidden="true">|</span>
    <a href="?lang=it" class="lang-link" data-lang="it">Italiano</a>
    <span aria-hidden="true">|</span>
    <a href="?lang=pt" class="lang-link" data-lang="pt">Português</a>
    <span aria-hidden="true">|</span>
    <a href="?lang=he" class="lang-link" data-lang="he">עברית</a>
    <span aria-hidden="true">|</span>
    <a href="?lang=ar" class="lang-link" data-lang="ar">العربية</a>
  </header>

  <div class="content-wrapper">

    <div class="image-container">
      <img
        id="cover-image"
        class="cover-image"
        src="/Explora/portada.jpg"
        alt="Portada de La Palabra en Cápsulas"
      >
    </div>

    <div class="text-container">
      <h1 id="title">La Palabra en Cápsulas</h1>
      <p id="subtitle">Fe, Poder y Vida</p>
    </div>

    <div class="action-container" id="button-box"></div>

  </div>
</div>

<script>
(function () {
  "use strict";

  const SPANISH_IMAGE = "/Explora/portada.jpg";

  const translations = {
    es: {
      title: "La Palabra en Cápsulas",
      subtitle: "Fe, Poder y Vida",
      btnText: "Explora",
      btnUrl: "/Explora/menu.html?lang=es",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },

    en: {
      title: "The Word in Capsules",
      subtitle: "Faith, Power and Life",
      btnText: "Explore",
      btnUrl: "/Explora/menu.html?lang=en",
      image: "/Explora/portada-en.png",
      direction: "ltr"
    },

    fr: {
      title: "La Parole en Capsules",
      subtitle: "Foi, Puissance et Vie",
      btnText: "Explorer",
      btnUrl: "/Explora/menu.html?lang=fr",
      image: "/Explora/portada-fr.png",
      direction: "ltr"
    },

    zh: {
      title: "胶囊话语",
      subtitle: "信心、能力与生命",
      btnText: "探索",
      btnUrl: "/Explora/menu.html?lang=zh",
      image: "/Explora/portada-zh.png",
      direction: "ltr"
    },

    it: {
      title: "La Parola in Capsule",
      subtitle: "Fede, Potenza e Vita",
      btnText: "Esplora",
      btnUrl: "/Explora/menu.html?lang=it",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },

    pt: {
      title: "A Palavra em Cápsulas",
      subtitle: "Fé, Poder e Vida",
      btnText: "Explore",
      btnUrl: "/Explora/menu.html?lang=pt",
      image: SPANISH_IMAGE,
      direction: "ltr"
    },

    he: {
      title: "המילה בכמוסות",
      subtitle: "אמונה, כוח וחיים",
      btnText: "גלה",
      btnUrl: "/Explora/menu.html?lang=he",
      image: SPANISH_IMAGE,
      direction: "rtl"
    },

    ar: {
      title: "الكلمة في كبسولات",
      subtitle: "الإيمان والقوة والحياة",
      btnText: "استكشف",
      btnUrl: "/Explora/menu.html?lang=ar",
      image: SPANISH_IMAGE,
      direction: "rtl"
    }
  };

  function saveLanguage(lang) {
    try {
      localStorage.setItem("lpc-language", lang);
      localStorage.setItem("user_language", lang);
    } catch (error) {
      // La página sigue funcionando si el navegador bloquea el almacenamiento.
    }
  }

  function getInitialLanguage() {
    const params = new URLSearchParams(window.location.search);
    const requestedLanguage = params.get("lang");

    if (requestedLanguage && translations[requestedLanguage]) {
      return requestedLanguage;
    }

    try {
      const savedLanguage =
        localStorage.getItem("lpc-language") ||
        localStorage.getItem("user_language");

      if (savedLanguage && translations[savedLanguage]) {
        return savedLanguage;
      }
    } catch (error) {
      // Se usará español como opción predeterminada.
    }

    return "es";
  }

  function setLanguage(lang) {
    if (!translations[lang]) {
      lang = "es";
    }

    const content = translations[lang];

    document.documentElement.lang = lang;
    document.documentElement.dir = content.direction;

    document.getElementById("title").textContent = content.title;
    document.getElementById("subtitle").textContent = content.subtitle;

    const image = document.getElementById("cover-image");

    image.onerror = function () {
      image.onerror = null;
      image.src = SPANISH_IMAGE;
      image.alt = "Portada de La Palabra en Cápsulas";
    };

    image.src = content.image || SPANISH_IMAGE;
    image.alt = content.title;

    document.querySelectorAll(".lang-link").forEach(function (link) {
      const active = link.dataset.lang === lang;
      link.classList.toggle("active", active);

      if (active) {
        link.setAttribute("aria-current", "true");
      } else {
        link.removeAttribute("aria-current");
      }
    });

    const buttonBox = document.getElementById("button-box");
    buttonBox.replaceChildren();

    const button = document.createElement("a");
    button.className = "btn-explore";
    button.href = content.btnUrl;
    button.textContent = content.btnText;
    buttonBox.appendChild(button);

    saveLanguage(lang);
  }

  document.querySelectorAll(".lang-link").forEach(function (link) {
    link.addEventListener("click", function (event) {
      event.preventDefault();
      setLanguage(link.dataset.lang);
    });
  });

  setLanguage(getInitialLanguage());
})();
</script>
</body>
</html>
