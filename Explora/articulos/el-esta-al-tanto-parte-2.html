:root{--text:#252525;--muted:#666;--accent:#17365D;--paper:#F8F4EC;--bg:#f2f0ec;--line:#d9d9d9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif}.page{width:900px;max-width:calc(100% - 40px);margin:45px auto;padding:55px 65px 45px;background:var(--paper);border-radius:5px;box-shadow:0 4px 18px rgba(0,0,0,.07)}header{text-align:center;margin-bottom:30px}.site-name{margin-bottom:8px;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:1.8px}.author{margin:0 0 12px;color:var(--muted);font-size:17px;font-style:italic}h1{margin:0 0 8px;color:var(--accent);font-family:Georgia,"Times New Roman",serif;font-size:36px;line-height:1.2;font-weight:700}.part-label{margin-top:5px;color:var(--muted);font-size:16px;font-style:italic}.article p{margin:0 0 22px;font-size:17px;line-height:1.8;text-align:justify}.cascade{margin:22px 0 25px;padding:4px 0 4px 20px;border-left:3px solid var(--accent);font-size:17px;line-height:1.7}.cascade div{margin-bottom:5px}.cascade div:last-child{margin-bottom:0}.scripture{margin:23px 0;padding:12px 20px;border-left:3px solid var(--accent);font-size:17px;line-height:1.7;text-align:justify}.scripture cite{display:block;margin-top:8px;color:var(--muted);font-size:14px;font-style:italic}.footnote-ref{display:inline-block;position:relative;font-size:19px!important;vertical-align:super;line-height:1;color:var(--accent);font-weight:400!important;cursor:pointer;text-decoration:none;padding:0 2px;-webkit-tap-highlight-color:transparent}.footnote-ref:hover{text-decoration:underline}.footnote-popup{display:none;position:absolute;left:50%;bottom:135%;transform:translateX(-50%);z-index:1000;width:max-content;max-width:min(260px,80vw);padding:9px 12px;border-radius:6px;background:#17365D;color:#fff;font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;font-size:15px;font-weight:400;line-height:1.4;text-align:center;white-space:normal;box-shadow:0 3px 12px rgba(0,0,0,.2);pointer-events:none}.footnote-ref.show-note .footnote-popup{display:block}.language-selector{display:flex;justify-content:center;gap:8px;margin:0 auto 28px;flex-wrap:wrap}.language-selector button{border:1px solid var(--accent);border-radius:4px;padding:7px 13px;background:transparent;color:var(--accent);font:600 14px "Segoe UI",Tahoma,sans-serif;cursor:pointer}.language-selector button[aria-pressed="true"],.language-selector button:hover{background:var(--accent);color:#fff}.footer-nav{margin-top:35px;padding-top:22px;border-top:1px solid var(--line);text-align:center}.footer-nav a{display:inline-block;margin:0 10px;color:var(--accent);text-decoration:none;font-size:16px;font-weight:700}.footer-nav a:hover{text-decoration:underline}@media(max-width:700px){.page{width:auto;max-width:none;margin:0;padding:35px 22px;border-radius:0;box-shadow:none}header{margin-bottom:25px}.site-name{font-size:12px;letter-spacing:1.5px}h1{font-size:30px;line-height:1.25}.author{font-size:16px}.part-label{font-size:15px}.article p{font-size:17px;line-height:1.75}.cascade{margin:18px 0 22px;padding-left:16px;font-size:17px;line-height:1.6}.scripture{margin:22px 0;padding:12px 16px;font-size:17px;line-height:1.65}.footnote-ref{font-size:20px!important}.footnote-popup{font-size:15px;max-width:75vw}.footer-nav a{display:block;margin:12px 0}}

<header><div class="site-name">LA PALABRA EN CÁPSULAS</div><div class="author">Por J.V.</div><h1>Él está al tanto</h1><div class="part-label">Parte 2</div></header>
<nav class="language-selector" aria-label="Language selector"><button type="button" data-lang="es" aria-pressed="true">Español</button><button type="button" data-lang="en" aria-pressed="false">English</button><button type="button" data-lang="fr" aria-pressed="false">Français</button></nav>

<nav class="footer-nav"><a href="el-esta-al-tanto-parte-1.html"></a><a href="index.html"></a></nav>
</main>
<script>window.translations = {'es': {'title': 'Él está al tanto — Parte 2 — La Palabra en Cápsulas', 'author': 'Por J.V.', 'heading': 'Él está al tanto', 'part': 'Parte 2', 'article': '<p>Primero Venezuela y luego Colombia fueron sacudidos con sendos terremotos y sabemos que habrá otros países que pasarán por eventos similares, como ha pasado igualmente en Asia y recientemente en la Florida.</p>\n<p>Todos estos eventos tienen la permisibilidad de Dios, y pareciera que la tierra se subleva y quisiera decir algo. El finado evangelista inglés Charles Spurgeon, en sus sermones, decía que “los desastres o aun los aparentes desórdenes naturales están controlados por la mano divina”. Aun el caos hace parte del orden.</p>\n<p>Así como las plagas, guerras y rumores de guerras, los terremotos son señal profética,<sup><span class="footnote-ref" title="Mateo 24:4-8">¹⁰</span></sup> básicamente sobre dos puntos:</p>\n<ul class="topic-list prophetic"><li>la venida del Señor y</li><li>el fin de los tiempos.</li></ul>\n<p>Los volcanes se pueden predecir con exactitud; sin embargo, hasta la fecha no hay aún dispositivo alguno que prediga cuándo se viene un terremoto o una réplica. Quizás algún día. Google solo lo detecta cuando ya ha iniciado.</p>\n<p>Y, por supuesto, debe ser el Señor nuestro punto de referencia. Estas señales son más que un llamado de atención.</p>\n<div class="verse-image"><img src="salmo-91.png" alt="Mil caerán a tu lado y diez mil a tu diestra; mas a ti no llegará. Salmo 91:7"></div>\n<p>Dios es un Dios de orden, de equilibrio, de balance. Y eso es lo que Él quiere que nosotros busquemos. Él dice:</p>\n<blockquote class="scripture">“Más buscad primeramente el reino de Dios y su justicia —su equilibrio, su forma de ser y hacer justicia—, y todas estas cosas os serán añadidas”.<sup><span class="footnote-ref" title="Mateo 6:33">¹¹</span></sup></blockquote>\n<p>Cuando no hay búsqueda de su rostro,<sup><span class="footnote-ref" title="Salmos 27:8">¹²</span></sup> pasamos por situaciones incómodas.</p>\n<p>Es bueno que entendamos y aceptemos que las cosas ocurren con la venia divina, pero Él no se deleita en el infortunio del hombre, sino en su paz.<sup><span class="footnote-ref" title="Salmos 35:27-28">¹³</span></sup></p>\n<p>Por todo lo anterior, debemos guardar una actitud de respeto y temor reverente<sup><span class="footnote-ref" title="Hebreos 12:28">¹⁴</span></sup> hacia el Señor.</p>\n<p>El patriarca Job tuvo una vida de muchas dificultades e infortunios. Perdió a su familia y riquezas al ser víctima de ladrones y asaltantes, fuego y un gran viento. Además, fue atacado por Satanás con enfermedades.</p>\n<p>Y, a pesar de que buscó con ahínco explicaciones ante Dios por todo aquel descomunal ataque del maligno, jamás culpó al Señor por sus males.</p>\n<blockquote class="scripture">«En todo esto no pecó Job, ni atribuyó a Dios despropósito alguno».<sup><span class="footnote-ref" title="Job 1:22">¹⁵</span></sup></blockquote>\n<p>Cuando sucede algo desagradable y aun terrible, no culpes a Dios. Él solo se deleita en tu paz.</p>\n<p>Sí, es cierto que Él se burla de sus enemigos,<sup><span class="footnote-ref" title="Salmos 2:4">¹⁶</span></sup> pero tú no lo eres. Si lo recibiste, eres su hijo.<sup><span class="footnote-ref" title="1 Juan 3:2; Romanos 8:16">¹⁷</span></sup></p>\n<p>Y si no lo has hecho, aquí está la oportunidad.</p>\n<p>Allí no terminó la historia de Job. Después que él hubo orado por sus amigos que erróneamente lo culpaban de su infortunio, Dios le dio una gran bendición al patriarca: el doble de lo que antes había tenido, múltiples bendiciones, más hijos, viviendo 140 años más, muriendo viejo y lleno de días.</p>\n<p>Los que quedaron vivos por la calamidad deben orar y auxiliar a los sobrevivientes y a quienes hoy día están dolidos, pues perdieron a sus seres queridos y posesiones.</p>\n<p>Después de la tempestad viene la calma y hay que reconstruir.</p>\n<blockquote class="scripture">“No preguntes qué puede hacer tu país por ti; pregunta qué puedes hacer tú por tu país”.<sup><span class="footnote-ref" title="Frase célebre de John F. Kennedy">¹⁸</span></sup><cite>Frase célebre de John F. Kennedy</cite></blockquote>\n<p>Es tiempo de actuar. Es tiempo de buscar al Señor, para que venga y nos enseñe justicia.<sup><span class="footnote-ref" title="Oseas 10:12">¹⁹</span></sup></p>\n<p>Hay personas que Dios se lleva por misericordia, y hay personas que Dios deja vivas, también por misericordia.</p>', 'nav': ['← Volver a Parte 1', 'Volver a Artículos']}, 'en': {'title': 'He Is Aware — Part 2 — La Palabra en Cápsulas', 'author': 'By J.V.', 'heading': 'He Is Aware', 'part': 'Part 2', 'article': '<p>First Venezuela, and then Colombia, were shaken by major earthquakes. We know that other countries will experience similar events, as has also happened in Asia and recently in Florida.</p>\n<p>All these events are permitted by God, and it seems as though the earth is rebelling and wants to say something. The late English evangelist Charles Spurgeon said in his sermons that “disasters, or even apparent natural disorder, are controlled by the divine hand.” Even chaos is part of order.</p>\n<p>Like plagues, wars, and rumors of wars, earthquakes are prophetic signs,<sup><span class="footnote-ref" title="Matthew 24:4-8">¹⁰</span></sup> mainly concerning two things:</p>\n<ul class="topic-list prophetic"><li>the coming of the Lord, and</li><li>the end of the age.</li></ul>\n<p>Volcanoes can be predicted accurately; however, to date there is still no device that can predict when an earthquake or aftershock will occur. Perhaps someday. Google only detects it once it has already begun.</p>\n<p>And, of course, the Lord must be our point of reference. These signs are more than a wake-up call.</p>\n<div class="verse-image"><img src="salmo-91.png" alt="A thousand may fall at your side, ten thousand at your right hand, but it will not come near you. Psalm 91:7"></div>\n<p>God is a God of order, equilibrium, and balance. That is what He wants us to seek. He says:</p>\n<blockquote class="scripture">“But seek first the kingdom of God and His righteousness—His balance, His way of being and doing what is right—and all these things will be added to you.”<sup><span class="footnote-ref" title="Matthew 6:33">¹¹</span></sup></blockquote>\n<p>When we do not seek His face,<sup><span class="footnote-ref" title="Psalm 27:8">¹²</span></sup> we go through uncomfortable situations.</p>\n<p>It is good for us to understand and accept that things happen with divine permission, but He does not delight in human misfortune; He delights in our peace.<sup><span class="footnote-ref" title="Psalm 35:27-28">¹³</span></sup></p>\n<p>For all these reasons, we should maintain an attitude of respect and reverent fear<sup><span class="footnote-ref" title="Hebrews 12:28">¹⁴</span></sup> toward the Lord.</p>\n<p>The patriarch Job lived through many hardships and misfortunes. He lost his family and wealth after becoming a victim of thieves and robbers, fire, and a great wind. He was also afflicted by Satan with illnesses.</p>\n<p>Although he earnestly sought explanations from God for that immense attack of the evil one, he never blamed the Lord for his suffering.</p>\n<blockquote class="scripture">“In all this Job did not sin nor charge God with wrong.”<sup><span class="footnote-ref" title="Job 1:22">¹⁵</span></sup></blockquote>\n<p>When something unpleasant, even terrible, happens, do not blame God. He delights in your peace.</p>\n<p>Yes, it is true that He laughs at His enemies,<sup><span class="footnote-ref" title="Psalm 2:4">¹⁶</span></sup> but you are not His enemy. If you have received Him, you are His child.<sup><span class="footnote-ref" title="1 John 3:2; Romans 8:16">¹⁷</span></sup></p>\n<p>And if you have not done so, here is your opportunity.</p>\n<p>That was not the end of Job’s story. After he prayed for his friends, who had wrongly blamed him for his misfortune, God greatly blessed the patriarch: he received twice what he had before, many blessings, more children, and lived another 140 years, dying old and full of days.</p>\n<p>Those who survived the calamity should pray for and help the survivors and those who are grieving today because they have lost loved ones and possessions.</p>\n<p>After the storm comes calm, and rebuilding must begin.</p>\n<blockquote class="scripture">“Ask not what your country can do for you—ask what you can do for your country.”<sup><span class="footnote-ref" title="Famous quote by John F. Kennedy">¹⁸</span></sup><cite>Famous quote by John F. Kennedy</cite></blockquote>\n<p>It is time to act. It is time to seek the Lord, so that He may come and teach us righteousness.<sup><span class="footnote-ref" title="Hosea 10:12">¹⁹</span></sup></p>\n<p>There are people whom God takes away in mercy, and there are people whom God leaves alive, also in mercy.</p>', 'nav': ['← Back to Part 1', 'Back to Articles']}, 'fr': {'title': 'Il est au courant — Partie 2 — La Palabra en Cápsulas', 'author': 'Par J.V.', 'heading': 'Il est au courant', 'part': 'Partie 2', 'article': '<p>D’abord le Venezuela, puis la Colombie, ont été secoués par de puissants tremblements de terre. Nous savons que d’autres pays connaîtront des événements semblables, comme cela s’est également produit en Asie et récemment en Floride.</p>\n<p>Tous ces événements sont permis par Dieu, et l’on dirait que la terre se révolte et veut dire quelque chose. Le défunt évangéliste anglais Charles Spurgeon disait dans ses sermons que « les catastrophes, ou même les désordres naturels apparents, sont contrôlés par la main divine ». Même le chaos fait partie de l’ordre.</p>\n<p>Comme les fléaux, les guerres et les rumeurs de guerres, les tremblements de terre sont des signes prophétiques,<sup><span class="footnote-ref" title="Matthieu 24:4-8">¹⁰</span></sup> qui concernent essentiellement deux choses :</p>\n<ul class="topic-list prophetic"><li>la venue du Seigneur, et</li><li>la fin des temps.</li></ul>\n<p>Les éruptions volcaniques peuvent être prévues avec précision ; cependant, à ce jour, aucun appareil ne permet encore de prédire quand un tremblement de terre ou une réplique se produira. Peut-être un jour. Google ne le détecte qu’une fois qu’il a commencé.</p>\n<p>Et, bien sûr, le Seigneur doit être notre point de référence. Ces signes sont plus qu’un simple avertissement.</p>\n<div class="verse-image"><img src="salmo-91.png" alt="Mille tomberont à ton côté et dix mille à ta droite, mais tu ne seras pas atteint. Psaume 91:7"></div>\n<p>Dieu est un Dieu d’ordre, d’équilibre et d’harmonie. C’est ce qu’il veut que nous recherchions. Il dit :</p>\n<blockquote class="scripture">« Cherchez premièrement le royaume de Dieu et sa justice — son équilibre, sa manière d’être et d’agir avec justice — et toutes ces choses vous seront données par-dessus. »<sup><span class="footnote-ref" title="Matthieu 6:33">¹¹</span></sup></blockquote>\n<p>Lorsque nous ne cherchons pas sa face,<sup><span class="footnote-ref" title="Psaume 27:8">¹²</span></sup> nous traversons des situations pénibles.</p>\n<p>Il est bon de comprendre et d’accepter que les choses arrivent avec la permission divine, mais Dieu ne se réjouit pas du malheur de l’être humain ; il se réjouit de sa paix.<sup><span class="footnote-ref" title="Psaume 35:27-28">¹³</span></sup></p>\n<p>Pour toutes ces raisons, nous devons garder une attitude de respect et de crainte révérencielle<sup><span class="footnote-ref" title="Hébreux 12:28">¹⁴</span></sup> envers le Seigneur.</p>\n<p>Le patriarche Job a connu de nombreuses difficultés et de nombreux malheurs. Il a perdu sa famille et ses richesses, victime de voleurs et de brigands, du feu et d’un grand vent. Satan l’a également frappé par la maladie.</p>\n<p>Bien qu’il ait cherché avec ardeur auprès de Dieu des explications à cette attaque terrible du mal, il n’a jamais accusé le Seigneur de ses souffrances.</p>\n<blockquote class="scripture">« En tout cela, Job ne pécha point et n’attribua rien d’injuste à Dieu. »<sup><span class="footnote-ref" title="Job 1:22">¹⁵</span></sup></blockquote>\n<p>Lorsqu’un événement désagréable, voire terrible, survient, n’accusez pas Dieu. Il se réjouit de votre paix.</p>\n<p>Oui, il est vrai qu’il se moque de ses ennemis,<sup><span class="footnote-ref" title="Psaume 2:4">¹⁶</span></sup> mais vous n’êtes pas son ennemi. Si vous l’avez reçu, vous êtes son enfant.<sup><span class="footnote-ref" title="1 Jean 3:2 ; Romains 8:16">¹⁷</span></sup></p>\n<p>Et si vous ne l’avez pas encore fait, voici l’occasion.</p>\n<p>L’histoire de Job ne s’est pas terminée là. Après avoir prié pour ses amis qui l’accusaient à tort de son malheur, Dieu bénit abondamment le patriarche : il reçut le double de ce qu’il avait auparavant, de nombreuses bénédictions, d’autres enfants, et vécut encore 140 ans, mourant vieux et rassasié de jours.</p>\n<p>Ceux qui ont survécu à la catastrophe doivent prier pour les survivants et aider ceux qui souffrent aujourd’hui d’avoir perdu des êtres chers et leurs biens.</p>\n<p>Après la tempête vient le calme, et il faut reconstruire.</p>\n<blockquote class="scripture">« Ne demande pas ce que ton pays peut faire pour toi ; demande ce que tu peux faire pour ton pays. »<sup><span class="footnote-ref" title="Citation célèbre de John F. Kennedy">¹⁸</span></sup><cite>Citation célèbre de John F. Kennedy</cite></blockquote>\n<p>Il est temps d’agir. Il est temps de chercher le Seigneur afin qu’il vienne nous enseigner la justice.<sup><span class="footnote-ref" title="Osée 10:12">¹⁹</span></sup></p>\n<p>Il y a des personnes que Dieu reprend dans sa miséricorde, et d’autres qu’il laisse en vie, également par miséricorde.</p>', 'nav': ['← Retour à la partie 1', 'Retour aux articles']}};</script>
<script>
(function(){
 const article=document.querySelector('.article');
 const buttons=document.querySelectorAll('[data-lang]');
 const navLinks=document.querySelectorAll('.footer-nav a');
 const data=window.translations;
 function setLanguage(lang){
  if(!data[lang]) lang='es';
  document.documentElement.lang=lang;
  document.title=data[lang].title;
  document.querySelector('.author').textContent=data[lang].author;
  document.querySelector('h1').textContent=data[lang].heading;
  document.querySelector('.part-label').textContent=data[lang].part;
  article.innerHTML=data[lang].article;
  navLinks.forEach((a,i)=>a.textContent=data[lang].nav[i]);
  buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  try{localStorage.setItem('lpc-language',lang)}catch(e){}
  bindNotes();
 }
 function bindNotes(){
  const notes=document.querySelectorAll('.footnote-ref');
  function close(){notes.forEach(n=>{n.classList.remove('show-note');n.setAttribute('aria-expanded','false')})}
  notes.forEach(n=>{n.setAttribute('aria-expanded','false');n.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const was=n.classList.contains('show-note');close();if(!was){n.classList.add('show-note');n.setAttribute('aria-expanded','true')}});n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click()}if(e.key==='Escape')close()})});
  document.addEventListener('click',close,{once:true});
 }
 buttons.forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
 let initial='es';try{const saved=localStorage.getItem('lpc-language');if(data[saved])initial=saved}catch(e){}
 setLanguage(initial);
})();
</script>
