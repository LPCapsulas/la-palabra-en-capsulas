<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Él está al tanto de la situación — Parte 2 — La Palabra en Cápsulas</title>

<style>
:root{
    --text:#252525;
    --muted:#666;
    --accent:#17365D;
    --paper:#ffffff;
    --bg:#f2f0ec;
    --line:#d9d9d9;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Arial,sans-serif;
    line-height:1.7;
    font-size:17px;
}

.page{
    width:min(900px,92%);
    margin:42px auto;
    background:var(--paper);
    padding:55px 70px 50px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

header{
    text-align:center;
    margin-bottom:42px;
}

.site-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    color:var(--accent);
    letter-spacing:.08em;
    margin-bottom:18px;
}

h1{
    margin:0;
    color:var(--accent);
    font-family:Georgia,"Times New Roman",serif;
    font-size:38px;
    line-height:1.2;
    font-weight:600;
}

/* Identificación de la parte: más discreta que el título */
.part-label{
    font-size:0.62em;
    font-weight:400;
    white-space:nowrap;
}

.author{
    margin-top:16px;
    color:var(--muted);
    font-size:15px;
    font-style:italic;
}

.article p{
    margin:0 0 23px;
    text-align:justify;
}

/* Bloque en cascada */
.cascade{
    margin:18px 0 22px;
    padding-left:24px;
    border-left:3px solid var(--accent);
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:17px;
    line-height:1.45;
}

.cascade div{
    margin:0 0 2px;
}

.cascade div:last-child{
    margin-bottom:0;
}

/* Citas bíblicas */
.scripture{
    margin:23px 0;
    padding:14px 20px;
    border-left:3px solid var(--accent);
    background:#f7f7f5;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px;
    line-height:1.55;
}

.scripture cite{
    display:block;
    margin-top:8px;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:14px;
    color:var(--muted);
    font-style:italic;
}

/* Imagen Salmo 91 */
.verse-image{
    text-align:center;
    margin:18px 0 25px;
}

.verse-image img{
    width:50%;
    height:auto;
    display:inline-block;
}

/* Listas */
.topic-list{
    margin:10px 0 22px;
    padding-left:28px;
}

.topic-list li{
    margin-bottom:6px;
    padding-left:4px;
    text-align:justify;
    line-height:1.48;
}

.topic-list li:last-child{
    margin-bottom:0;
}

.topic-list strong{
    color:var(--accent);
}

/* Lista profética especialmente compacta */
.topic-list.prophetic{
    margin-top:4px;
    margin-bottom:10px;
}

.topic-list.prophetic li{
    margin-bottom:1px;
    line-height:1.4;
}

/* Notas al pasar el mouse */
.footnote-ref{
    font-size:0.90em;
    vertical-align:super;
    line-height:0;
    color:var(--accent);
    font-weight:700;
    cursor:help;
}

.footer-nav{
    margin-top:35px;
    padding-top:22px;
    border-top:1px solid var(--line);
    text-align:center;
}

.footer-nav a{
    color:var(--accent);
    text-decoration:none;
    font-size:14px;
    margin:0 10px;
}

.footer-nav a:hover{
    text-decoration:underline;
}

        font-size:29px;

    }

    .scripture{

        margin:23px 0;
