<header><div class="site-name">LA PALABRA EN CÁPSULAS</div><div class="author">Por J.V.</div><h1>Él está al tanto</h1><div class="part-label">Parte 2</div></header>
<nav class="language-selector" aria-label="Language selector"><button type="button" data-lang="es" aria-pressed="true">Español</button><button type="button" data-lang="en" aria-pressed="false">English</button><button type="button" data-lang="zh" aria-pressed="false">简体中文</button><button type="button" data-lang="fr" aria-pressed="false">Français</button><button type="button" data-lang="it" aria-pressed="false">Italiano</button><button type="button" data-lang="pt" aria-pressed="false">Português</button><button type="button" data-lang="he" aria-pressed="false">עברית</button><button type="button" data-lang="ar" aria-pressed="false">العربية</button></nav>

<!-- Imágenes del versículo: sube estos archivos a la misma carpeta que este HTML: salmo-91.png (español), salmo-91-en.png (inglés), salmo-91-zh.png (chino), salmo-91-fr.png (francés), salmo-91-it.png (italiano), salmo-91-pt.png (portugués), salmo-91-he.png (hebreo) y salmo-91-ar.png (árabe). -->\n<script>window.translations = {"es":{"title":"Él está al tanto — Parte 2 — La Palabra en Cápsulas","author":"Por J.V.","heading":"Él está al tanto","part":"Parte 2","article":"<p>Primero Venezuela y luego Colombia fueron sacudidos con sendos terremotos y sabemos que habrá otros países que pasarán por eventos similares, como ha pasado igualmente en Asia y recientemente en la Florida.</p>\n<p>Todos estos eventos tienen la permisibilidad de Dios, y pareciera que la tierra se subleva y quisiera decir algo. El finado evangelista inglés Charles Spurgeon, en sus sermones, decía que “los desastres o aun los aparentes desórdenes naturales están controlados por la mano divina”. Aun el caos hace parte del orden.</p>\n<p>Así como las plagas, guerras y rumores de guerras, los terremotos son señal profética,<sup><span class=\"footnote-ref\" title=\"Mateo 24:4-8\">¹⁰</span></sup> básicamente sobre dos puntos:</p>\n<ul class=\"topic-list prophetic\"><li>la venida del Señor y</li><li>el fin de los tiempos.</li></ul>\n<p>Los volcanes se pueden predecir con exactitud; sin embargo, hasta la fecha no hay aún dispositivo alguno que prediga cuándo se viene un terremoto o una réplica. Quizás algún día. Google solo lo detecta cuando ya ha iniciado.</p>\n<p>Y, por supuesto, debe ser el Señor nuestro punto de referencia. Estas señales son más que un llamado de atención.</p>\n<div class=\"verse-image\"><img src=\"salmo-91.png\" alt=\"Mil caerán a tu lado y diez mil a tu diestra; mas a ti no llegará. Salmo 91:7\"></div>\n<p>Dios es un Dios de orden, de equilibrio, de balance. Y eso es lo que Él quiere que nosotros busquemos. Él dice:</p>\n<blockquote class=\"scripture\">“Más buscad primeramente el reino de Dios y su justicia —su equilibrio, su forma de ser y hacer justicia—, y todas estas cosas os serán añadidas”.<sup><span class=\"footnote-ref\" title=\"Mateo 6:33\">¹¹</span></sup></blockquote>\n<p>Cuando no hay búsqueda de su rostro,<sup><span class=\"footnote-ref\" title=\"Salmos 27:8\">¹²</span></sup> pasamos por situaciones incómodas.</p>\n<p>Es bueno que entendamos y aceptemos que las cosas ocurren con la venia divina, pero Él no se deleita en el infortunio del hombre, sino en su paz.<sup><span class=\"footnote-ref\" title=\"Salmos 35:27-28\">¹³</span></sup></p>\n<p>Por todo lo anterior, debemos guardar una actitud de respeto y temor reverente<sup><span class=\"footnote-ref\" title=\"Hebreos 12:28\">¹⁴</span></sup> hacia el Señor.</p>\n<p>El patriarca Job tuvo una vida de muchas dificultades e infortunios. Perdió a su familia y riquezas al ser víctima de ladrones y asaltantes, fuego y un gran viento. Además, fue atacado por Satanás con enfermedades.</p>\n<p>Y, a pesar de que buscó con ahínco explicaciones ante Dios por todo aquel descomunal ataque del maligno, jamás culpó al Señor por sus males.</p>\n<blockquote class=\"scripture\">«En todo esto no pecó Job, ni atribuyó a Dios despropósito alguno».<sup><span class=\"footnote-ref\" title=\"Job 1:22\">¹⁵</span></sup></blockquote>\n<p>Cuando sucede algo desagradable y aun terrible, no culpes a Dios. Él solo se deleita en tu paz.</p>\n<p>Sí, es cierto que Él se burla de sus enemigos,<sup><span class=\"footnote-ref\" title=\"Salmos 2:4\">¹⁶</span></sup> pero tú no lo eres. Si lo recibiste, eres su hijo.<sup><span class=\"footnote-ref\" title=\"1 Juan 3:2; Romanos 8:16\">¹⁷</span></sup></p>\n<p>Y si no lo has hecho, aquí está la oportunidad.</p>\n<p>Allí no terminó la historia de Job. Después que él hubo orado por sus amigos que erróneamente lo culpaban de su infortunio, Dios le dio una gran bendición al patriarca: el doble de lo que antes había tenido, múltiples bendiciones, más hijos, viviendo 140 años más, muriendo viejo y lleno de días.</p>\n<p>Los que quedaron vivos por la calamidad deben orar y auxiliar a los sobrevivientes y a quienes hoy día están dolidos, pues perdieron a sus seres queridos y posesiones.</p>\n<p>Después de la tempestad viene la calma y hay que reconstruir.</p>\n<blockquote class=\"scripture\">“No preguntes qué puede hacer tu país por ti; pregunta qué puedes hacer tú por tu país”.<sup><span class=\"footnote-ref\" title=\"Frase célebre de John F. Kennedy\">¹⁸</span></sup><cite>Frase célebre de John F. Kennedy</cite></blockquote>\n<p>Es tiempo de actuar. Es tiempo de buscar al Señor, para que venga y nos enseñe justicia.<sup><span class=\"footnote-ref\" title=\"Oseas 10:12\">¹⁹</span></sup></p>\n<p>Hay personas que Dios se lleva por misericordia, y hay personas que Dios deja vivas, también por misericordia.</p>","nav":["← Volver a Parte 1","Volver a Artículos"]},"en":{"title":"He Is Aware — Part 2 — La Palabra en Cápsulas","author":"By J.V.","heading":"He Is Aware","part":"Part 2","article":"<p>First Venezuela, and then Colombia, were shaken by major earthquakes. We know that other countries will experience similar events, as has also happened in Asia and recently in Florida.</p>\n<p>All these events are permitted by God, and it seems as though the earth is rebelling and wants to say something. The late English evangelist Charles Spurgeon said in his sermons that “disasters, or even apparent natural disorder, are controlled by the divine hand.” Even chaos is part of order.</p>\n<p>Like plagues, wars, and rumors of wars, earthquakes are prophetic signs,<sup><span class=\"footnote-ref\" title=\"Matthew 24:4-8\">¹⁰</span></sup> mainly concerning two things:</p>\n<ul class=\"topic-list prophetic\"><li>the coming of the Lord, and</li><li>the end of the age.</li></ul>\n<p>Volcanoes can be predicted accurately; however, to date there is still no device that can predict when an earthquake or aftershock will occur. Perhaps someday. Google only detects it once it has already begun.</p>\n<p>And, of course, the Lord must be our point of reference. These signs are more than a wake-up call.</p>\n<div class=\"verse-image\"><img src=\"salmo-91-en.png\" alt=\"A thousand may fall at your side, ten thousand at your right hand, but it will not come near you. Psalm 91:7\"></div>\n<p>God is a God of order, equilibrium, and balance. That is what He wants us to seek. He says:</p>\n<blockquote class=\"scripture\">“But seek first the kingdom of God and His righteousness—His balance, His way of being and doing what is right—and all these things will be added to you.”<sup><span class=\"footnote-ref\" title=\"Matthew 6:33\">¹¹</span></sup></blockquote>\n<p>When we do not seek His face,<sup><span class=\"footnote-ref\" title=\"Psalm 27:8\">¹²</span></sup> we go through uncomfortable situations.</p>\n<p>It is good for us to understand and accept that things happen with divine permission, but He does not delight in human misfortune; He delights in our peace.<sup><span class=\"footnote-ref\" title=\"Psalm 35:27-28\">¹³</span></sup></p>\n<p>For all these reasons, we should maintain an attitude of respect and reverent fear<sup><span class=\"footnote-ref\" title=\"Hebrews 12:28\">¹⁴</span></sup> toward the Lord.</p>\n<p>The patriarch Job lived through many hardships and misfortunes. He lost his family and wealth after becoming a victim of thieves and robbers, fire, and a great wind. He was also afflicted by Satan with illnesses.</p>\n<p>Although he earnestly sought explanations from God for that immense attack of the evil one, he never blamed the Lord for his suffering.</p>\n<blockquote class=\"scripture\">“In all this Job did not sin nor charge God with wrong.”<sup><span class=\"footnote-ref\" title=\"Job 1:22\">¹⁵</span></sup></blockquote>\n<p>When something unpleasant, even terrible, happens, do not blame God. He delights in your peace.</p>\n<p>Yes, it is true that He laughs at His enemies,<sup><span class=\"footnote-ref\" title=\"Psalm 2:4\">¹⁶</span></sup> but you are not His enemy. If you have received Him, you are His child.<sup><span class=\"footnote-ref\" title=\"1 John 3:2; Romans 8:16\">¹⁷</span></sup></p>\n<p>And if you have not done so, here is your opportunity.</p>\n<p>That was not the end of Job’s story. After he prayed for his friends, who had wrongly blamed him for his misfortune, God greatly blessed the patriarch: he received twice what he had before, many blessings, more children, and lived another 140 years, dying old and full of days.</p>\n<p>Those who survived the calamity should pray for and help the survivors and those who are grieving today because they have lost loved ones and possessions.</p>\n<p>After the storm comes calm, and rebuilding must begin.</p>\n<blockquote class=\"scripture\">“Ask not what your country can do for you—ask what you can do for your country.”<sup><span class=\"footnote-ref\" title=\"Famous quote by John F. Kennedy\">¹⁸</span></sup><cite>Famous quote by John F. Kennedy</cite></blockquote>\n<p>It is time to act. It is time to seek the Lord, so that He may come and teach us righteousness.<sup><span class=\"footnote-ref\" title=\"Hosea 10:12\">¹⁹</span></sup></p>\n<p>There are people whom God takes away in mercy, and there are people whom God leaves alive, also in mercy.</p>","nav":["← Back to Part 1","Back to Articles"]},"fr":{"title":"Il est au courant — Partie 2 — La Palabra en Cápsulas","author":"Par J.V.","heading":"Il est au courant","part":"Partie 2","article":"<p>D’abord le Venezuela, puis la Colombie, ont été secoués par de puissants tremblements de terre. Nous savons que d’autres pays connaîtront des événements semblables, comme cela s’est également produit en Asie et récemment en Floride.</p>\n<p>Tous ces événements sont permis par Dieu, et l’on dirait que la terre se révolte et veut dire quelque chose. Le défunt évangéliste anglais Charles Spurgeon disait dans ses sermons que « les catastrophes, ou même les désordres naturels apparents, sont contrôlés par la main divine ». Même le chaos fait partie de l’ordre.</p>\n<p>Comme les fléaux, les guerres et les rumeurs de guerres, les tremblements de terre sont des signes prophétiques,<sup><span class=\"footnote-ref\" title=\"Matthieu 24:4-8\">¹⁰</span></sup> qui concernent essentiellement deux choses :</p>\n<ul class=\"topic-list prophetic\"><li>la venue du Seigneur, et</li><li>la fin des temps.</li></ul>\n<p>Les éruptions volcaniques peuvent être prévues avec précision ; cependant, à ce jour, aucun appareil ne permet encore de prédire quand un tremblement de terre ou une réplique se produira. Peut-être un jour. Google ne le détecte qu’une fois qu’il a commencé.</p>\n<p>Et, bien sûr, le Seigneur doit être notre point de référence. Ces signes sont plus qu’un simple avertissement.</p>\n<div class=\"verse-image\"><img src=\"salmo-91-fr.png\" alt=\"Mille tomberont à ton côté et dix mille à ta droite, mais tu ne seras pas atteint. Psaume 91:7\"></div>\n<p>Dieu est un Dieu d’ordre, d’équilibre et d’harmonie. C’est ce qu’il veut que nous recherchions. Il dit :</p>\n<blockquote class=\"scripture\">« Cherchez premièrement le royaume de Dieu et sa justice — son équilibre, sa manière d’être et d’agir avec justice — et toutes ces choses vous seront données par-dessus. »<sup><span class=\"footnote-ref\" title=\"Matthieu 6:33\">¹¹</span></sup></blockquote>\n<p>Lorsque nous ne cherchons pas sa face,<sup><span class=\"footnote-ref\" title=\"Psaume 27:8\">¹²</span></sup> nous traversons des situations pénibles.</p>\n<p>Il est bon de comprendre et d’accepter que les choses arrivent avec la permission divine, mais Dieu ne se réjouit pas du malheur de l’être humain ; il se réjouit de sa paix.<sup><span class=\"footnote-ref\" title=\"Psaume 35:27-28\">¹³</span></sup></p>\n<p>Pour toutes ces raisons, nous devons garder une attitude de respect et de crainte révérencielle<sup><span class=\"footnote-ref\" title=\"Hébreux 12:28\">¹⁴</span></sup> envers le Seigneur.</p>\n<p>Le patriarche Job a connu de nombreuses difficultés et de nombreux malheurs. Il a perdu sa famille et ses richesses, victime de voleurs et de brigands, du feu et d’un grand vent. Satan l’a également frappé par la maladie.</p>\n<p>Bien qu’il ait cherché avec ardeur auprès de Dieu des explications à cette attaque terrible du mal, il n’a jamais accusé le Seigneur de ses souffrances.</p>\n<blockquote class=\"scripture\">« En tout cela, Job ne pécha point et n’attribua rien d’injuste à Dieu. »<sup><span class=\"footnote-ref\" title=\"Job 1:22\">¹⁵</span></sup></blockquote>\n<p>Lorsqu’un événement désagréable, voire terrible, survient, n’accusez pas Dieu. Il se réjouit de votre paix.</p>\n<p>Oui, il est vrai qu’il se moque de ses ennemis,<sup><span class=\"footnote-ref\" title=\"Psaume 2:4\">¹⁶</span></sup> mais vous n’êtes pas son ennemi. Si vous l’avez reçu, vous êtes son enfant.<sup><span class=\"footnote-ref\" title=\"1 Jean 3:2 ; Romains 8:16\">¹⁷</span></sup></p>\n<p>Et si vous ne l’avez pas encore fait, voici l’occasion.</p>\n<p>L’histoire de Job ne s’est pas terminée là. Après avoir prié pour ses amis qui l’accusaient à tort de son malheur, Dieu bénit abondamment le patriarche : il reçut le double de ce qu’il avait auparavant, de nombreuses bénédictions, d’autres enfants, et vécut encore 140 ans, mourant vieux et rassasié de jours.</p>\n<p>Ceux qui ont survécu à la catastrophe doivent prier pour les survivants et aider ceux qui souffrent aujourd’hui d’avoir perdu des êtres chers et leurs biens.</p>\n<p>Après la tempête vient le calme, et il faut reconstruire.</p>\n<blockquote class=\"scripture\">« Ne demande pas ce que ton pays peut faire pour toi ; demande ce que tu peux faire pour ton pays. »<sup><span class=\"footnote-ref\" title=\"Citation célèbre de John F. Kennedy\">¹⁸</span></sup><cite>Citation célèbre de John F. Kennedy</cite></blockquote>\n<p>Il est temps d’agir. Il est temps de chercher le Seigneur afin qu’il vienne nous enseigner la justice.<sup><span class=\"footnote-ref\" title=\"Osée 10:12\">¹⁹</span></sup></p>\n<p>Il y a des personnes que Dieu reprend dans sa miséricorde, et d’autres qu’il laisse en vie, également par miséricorde.</p>","nav":["← Retour à la partie 1","Retour aux articles"]},"it":{"title":"Egli è al corrente — Parte 2 — La Palabra en Cápsulas","author":"Di J.V.","heading":"Egli è al corrente","part":"Parte 2","nav":["← Torna alla Parte 1","Torna agli articoli"],"article":"<p>Prima il Venezuela e poi la Colombia sono stati scossi da forti terremoti. Sappiamo che altri paesi vivranno eventi simili, come è accaduto anche in Asia e, recentemente, in Florida.</p>\n<p>Tutti questi eventi sono permessi da Dio, e sembra che la terra si ribelli e voglia dire qualcosa. Il defunto evangelista inglese Charles Spurgeon affermava nei suoi sermoni che «le catastrofi, e persino gli apparenti disordini naturali, sono controllati dalla mano divina». Anche il caos fa parte dell’ordine.</p>\n<p>Come le piaghe, le guerre e le voci di guerre, i terremoti sono segni profetici,<sup><span class=\"footnote-ref\" title=\"Matteo 24:4-8\">¹⁰</span></sup> che riguardano soprattutto due cose:</p><ul class=\"topic-list prophetic\"><li>la venuta del Signore;</li><li>la fine dei tempi.</li></ul>\n<p>Le eruzioni vulcaniche possono essere previste con precisione; tuttavia, finora non esiste alcun dispositivo capace di prevedere quando si verificherà un terremoto o una scossa di assestamento. Forse un giorno. Google lo rileva soltanto quando è già iniziato.</p>\n<p>E, naturalmente, il Signore deve essere il nostro punto di riferimento. Questi segni sono più di un semplice richiamo all’attenzione.</p><div class=\"verse-image\"><img src=\"salmo-91-it.png\" alt=\"Mille cadranno al tuo fianco e diecimila alla tua destra, ma nulla ti colpirà. Salmo 91:7\"></div>\n<p>Dio è un Dio di ordine, equilibrio e armonia. È questo che vuole che cerchiamo. Egli dice:</p><blockquote class=\"scripture\">«Cercate prima il regno di Dio e la sua giustizia — il suo equilibrio, il suo modo di essere e di agire con giustizia — e tutte queste cose vi saranno date in aggiunta».<sup><span class=\"footnote-ref\" title=\"Matteo 6:33\">¹¹</span></sup></blockquote>\n<p>Quando non cerchiamo il suo volto,<sup><span class=\"footnote-ref\" title=\"Salmi 27:8\">¹²</span></sup> attraversiamo situazioni difficili.</p><p>È bene capire e accettare che le cose accadono con il permesso divino, ma Dio non si compiace della disgrazia dell’uomo: si compiace della sua pace.<sup><span class=\"footnote-ref\" title=\"Salmi 35:27-28\">¹³</span></sup></p>\n<p>Per tutti questi motivi, dobbiamo mantenere verso il Signore un atteggiamento di rispetto e timore reverenziale.<sup><span class=\"footnote-ref\" title=\"Ebrei 12:28\">¹⁴</span></sup></p><p>Il patriarca Giobbe visse molte difficoltà e sventure. Perse la famiglia e le ricchezze a causa di ladri e predoni, del fuoco e di un forte vento. Inoltre, Satana lo colpì con delle malattie.</p><p>Pur cercando con fervore una spiegazione da Dio per quell’attacco devastante del maligno, non incolpò mai il Signore delle sue sofferenze.</p><blockquote class=\"scripture\">«In tutto questo Giobbe non peccò e non attribuì a Dio alcuna colpa».<sup><span class=\"footnote-ref\" title=\"Giobbe 1:22\">¹⁵</span></sup></blockquote><p>Quando accade qualcosa di spiacevole, persino di terribile, non incolpare Dio. Egli si compiace della tua pace.</p><p>È vero che ride dei suoi nemici,<sup><span class=\"footnote-ref\" title=\"Salmi 2:4\">¹⁶</span></sup> ma tu non sei suo nemico. Se lo hai accolto, sei suo figlio.<sup><span class=\"footnote-ref\" title=\"1 Giovanni 3:2; Romani 8:16\">¹⁷</span></sup></p><p>E se non lo hai ancora fatto, questa è la tua occasione.</p><p>La storia di Giobbe non finì lì. Dopo che ebbe pregato per i suoi amici, che lo accusavano ingiustamente della sua disgrazia, Dio benedisse grandemente il patriarca: gli diede il doppio di ciò che aveva prima, molte benedizioni, altri figli e altri 140 anni di vita; morì vecchio e sazio di giorni.</p><p>Chi è sopravvissuto alla calamità deve pregare e aiutare gli altri sopravvissuti e coloro che oggi soffrono per aver perso i propri cari e i propri beni.</p><p>Dopo la tempesta torna la calma, ed è necessario ricostruire.</p><blockquote class=\"scripture\">«Non chiederti che cosa può fare il tuo paese per te; chiediti che cosa puoi fare tu per il tuo paese».<sup><span class=\"footnote-ref\" title=\"Citazione celebre di John F. Kennedy\">¹⁸</span></sup><cite>Citazione celebre di John F. Kennedy</cite></blockquote><p>È tempo di agire. È tempo di cercare il Signore, affinché venga a insegnarci la giustizia.<sup><span class=\"footnote-ref\" title=\"Osea 10:12\">¹⁹</span></sup></p><p>Ci sono persone che Dio richiama a sé per misericordia e persone che lascia in vita, anch’esse per misericordia.</p>"},"pt":{"title":"Ele está ciente — Parte 2 — La Palabra en Cápsulas","author":"Por J.V.","heading":"Ele está ciente","part":"Parte 2","nav":["← Voltar à Parte 1","Voltar aos artigos"],"article":"<p>Primeiro a Venezuela e depois a Colômbia foram abaladas por fortes terremotos. Sabemos que outros países passarão por eventos semelhantes, como também aconteceu na Ásia e, recentemente, na Flórida.</p><p>Todos esses acontecimentos são permitidos por Deus, e parece que a terra se revolta e quer dizer alguma coisa. O falecido evangelista inglês Charles Spurgeon dizia em seus sermões que “as catástrofes, ou até mesmo as aparentes desordens naturais, são controladas pela mão divina”. Até o caos faz parte da ordem.</p><p>Assim como as pragas, as guerras e os rumores de guerras, os terremotos são sinais proféticos,<sup><span class=\"footnote-ref\" title=\"Mateus 24:4-8\">¹⁰</span></sup> principalmente sobre dois pontos:</p><ul class=\"topic-list prophetic\"><li>a vinda do Senhor; e</li><li>o fim dos tempos.</li></ul><p>As erupções vulcânicas podem ser previstas com precisão; entretanto, até hoje não existe aparelho capaz de prever quando ocorrerá um terremoto ou uma réplica. Talvez um dia. O Google só o detecta quando já começou.</p><p>E, naturalmente, o Senhor deve ser nosso ponto de referência. Esses sinais são mais do que um alerta.</p><div class=\"verse-image\"><img src=\"salmo-91-pt.png\" alt=\"Mil cairão ao teu lado e dez mil à tua direita, mas tu não serás atingido. Salmo 91:7\"></div><p>Deus é um Deus de ordem, equilíbrio e harmonia. É isso que Ele quer que busquemos. Ele diz:</p><blockquote class=\"scripture\">“Buscai primeiro o reino de Deus e a sua justiça — seu equilíbrio, sua maneira de ser e de agir com justiça — e todas essas coisas vos serão acrescentadas.”<sup><span class=\"footnote-ref\" title=\"Mateus 6:33\">¹¹</span></sup></blockquote><p>Quando não buscamos a sua face,<sup><span class=\"footnote-ref\" title=\"Salmos 27:8\">¹²</span></sup> passamos por situações difíceis.</p><p>É bom compreender e aceitar que as coisas acontecem com a permissão divina, mas Deus não se alegra com o infortúnio humano; Ele se alegra com a paz.<sup><span class=\"footnote-ref\" title=\"Salmos 35:27-28\">¹³</span></sup></p><p>Por tudo isso, devemos manter uma atitude de respeito e temor reverente<sup><span class=\"footnote-ref\" title=\"Hebreus 12:28\">¹⁴</span></sup> diante do Senhor.</p><p>O patriarca Jó viveu muitas dificuldades e infortúnios. Perdeu a família e as riquezas ao ser vítima de ladrões e assaltantes, do fogo e de um grande vento. Além disso, Satanás o atacou com doenças.</p><p>Embora tenha buscado ardentemente explicações de Deus para aquele enorme ataque do maligno, nunca culpou o Senhor por seus sofrimentos.</p><blockquote class=\"scripture\">“Em tudo isso Jó não pecou, nem atribuiu a Deus falta alguma.”<sup><span class=\"footnote-ref\" title=\"Jó 1:22\">¹⁵</span></sup></blockquote><p>Quando acontecer algo desagradável, até mesmo terrível, não culpe Deus. Ele se alegra com a sua paz.</p><p>Sim, é verdade que Ele zomba de seus inimigos,<sup><span class=\"footnote-ref\" title=\"Salmos 2:4\">¹⁶</span></sup> mas você não é seu inimigo. Se você o recebeu, é filho dele.<sup><span class=\"footnote-ref\" title=\"1 João 3:2; Romanos 8:16\">¹⁷</span></sup></p><p>E, se ainda não o fez, esta é a oportunidade.</p><p>A história de Jó não terminou ali. Depois que orou por seus amigos, que o culpavam injustamente por sua desgraça, Deus abençoou grandemente o patriarca: deu-lhe o dobro do que possuía antes, muitas bênçãos, mais filhos e mais 140 anos de vida; ele morreu idoso e cheio de dias.</p><p>Os que sobreviveram à calamidade devem orar e ajudar os demais sobreviventes e aqueles que hoje sofrem por terem perdido entes queridos e seus bens.</p><p>Depois da tempestade vem a calmaria, e é preciso reconstruir.</p><blockquote class=\"scripture\">“Não pergunte o que seu país pode fazer por você; pergunte o que você pode fazer por seu país.”<sup><span class=\"footnote-ref\" title=\"Frase célebre de John F. Kennedy\">¹⁸</span></sup><cite>Frase célebre de John F. Kennedy</cite></blockquote><p>É tempo de agir. É tempo de buscar o Senhor, para que venha nos ensinar a justiça.<sup><span class=\"footnote-ref\" title=\"Oseias 10:12\">¹⁹</span></sup></p><p>Há pessoas que Deus leva por misericórdia e há pessoas que Ele deixa vivas, também por misericórdia.</p>"},"zh":{"title":"祂知晓一切 — 第二部分 — La Palabra en Cápsulas","author":"作者：J.V.","heading":"祂知晓一切","part":"第二部分","nav":["← 返回第一部分","返回文章目录"],"article":"<p>委内瑞拉先后发生强烈地震，随后哥伦比亚也遭到地震袭击。我们知道，其他国家也可能经历类似事件，亚洲以及最近佛罗里达发生的情况就是例子。</p><p>这些事件都在上帝所容许的范围之内，仿佛大地正在反抗，想要传达某种信息。已故英国福音布道家查尔斯·司布真在讲道中说过：“灾难，甚至表面上的自然失序，也都在神圣之手的掌管之下。”混乱也属于秩序的一部分。</p><p>地震与灾害、战争和战争的传闻一样，都是预言中的征兆，<sup><span class=\"footnote-ref\" title=\"马太福音 24:4-8\">¹⁰</span></sup>主要涉及两件事：</p><ul class=\"topic-list prophetic\"><li>主的降临；</li><li>末后的日子。</li></ul><p>火山活动有时可以准确预测；然而，直到今天，还没有设备能够预知地震或余震何时发生。也许将来会有。谷歌只能在地震已经开始后才检测到它。</p><p>当然，主必须是我们所仰望的对象。这些征兆不仅仅是提醒。</p><div class=\"verse-image\"><img src=\"salmo-91-zh.png\" alt=\"虽有千人仆倒在你旁边，万人仆倒在你右边，这灾却不得临近你。诗篇91:7\"></div><p>上帝是有秩序、平衡与和谐的上帝。这正是祂希望我们寻求的。祂说：</p><blockquote class=\"scripture\">“你们要先求祂的国和祂的义——祂的平衡，以及祂行事为人的公义——这些东西都要加给你们了。”<sup><span class=\"footnote-ref\" title=\"马太福音 6:33\">¹¹</span></sup></blockquote><p>当我们不寻求祂的面，<sup><span class=\"footnote-ref\" title=\"诗篇 27:8\">¹²</span></sup>就会经历令人不安的处境。</p><p>我们应当明白并接受，事情是在上帝的许可下发生的；但祂并不以人的不幸为乐，而是喜悦人得享平安。<sup><span class=\"footnote-ref\" title=\"诗篇 35:27-28\">¹³</span></sup></p><p>因此，我们应当以尊重和敬畏的态度来到主面前。<sup><span class=\"footnote-ref\" title=\"希伯来书 12:28\">¹⁴</span></sup></p><p>族长约伯一生经历了许多艰难和不幸。他因盗贼、强盗、火灾和大风而失去了家人和财产。此外，撒但还用疾病攻击他。</p><p>尽管他迫切地向上帝寻求那场邪恶攻击的解释，他却从未因自己的苦难责怪主。</p><blockquote class=\"scripture\">“在这一切的事上，约伯并不犯罪，也不以上帝为愚妄。”<sup><span class=\"footnote-ref\" title=\"约伯记 1:22\">¹⁵</span></sup></blockquote><p>当令人不快、甚至可怕的事情发生时，不要责怪上帝。祂喜悦你得享平安。</p><p>祂确实会嗤笑祂的仇敌，<sup><span class=\"footnote-ref\" title=\"诗篇 2:4\">¹⁶</span></sup>但你不是祂的仇敌。你若接受了祂，就是祂的儿女。<sup><span class=\"footnote-ref\" title=\"约翰一书 3:2；罗马书 8:16\">¹⁷</span></sup></p><p>如果你还没有接受祂，现在就是机会。</p><p>约伯的故事并未就此结束。他为那些错误地指责他遭遇不幸的朋友祷告之后，上帝大大赐福给他：使他所得的比从前加倍，赐下许多福分和更多儿女，并让他又活了140年，年老且日子满足而终。</p><p>在灾难中幸存的人应当祷告，并帮助其他幸存者，以及今天因失去亲人和财物而悲痛的人。</p><p>风暴过后会归于平静，我们必须重建家园。</p><blockquote class=\"scripture\">“不要问你的国家能为你做什么，而要问你能为国家做什么。”<sup><span class=\"footnote-ref\" title=\"约翰·F·肯尼迪的名言\">¹⁸</span></sup><cite>约翰·F·肯尼迪的名言</cite></blockquote><p>现在是行动的时候。现在是寻求主的时候，求祂来教导我们公义。<sup><span class=\"footnote-ref\" title=\"何西阿书 10:12\">¹⁹</span></sup></p><p>有些人蒙上帝怜悯而被祂接去，也有些人蒙怜悯而被祂留下生命。</p>"},"he":{"title":"הוא מודע — חלק 2 — La Palabra en Cápsulas","author":"מאת J.V.","heading":"הוא מודע","part":"חלק 2","nav":["← חזרה לחלק 1","חזרה למאמרים"],"article":"<p>תחילה ונצואלה ולאחר מכן קולומביה רעדו בעקבות רעידות אדמה חזקות. אנו יודעים שגם מדינות אחרות עלולות לחוות אירועים דומים, כפי שקרה גם באסיה ולאחרונה בפלורידה.</p><p>כל האירועים האלה מתרחשים ברשות אלוהים, ונראה כאילו האדמה מתקוממת ורוצה לומר דבר מה. המטיף האנגלי המנוח צ'ארלס ספרג'ן אמר בדרשותיו ש״אסונות, ואפילו אי־סדרים טבעיים לכאורה, נתונים לשליטה של היד האלוהית״. גם הכאוס הוא חלק מן הסדר.</p><p>כמו המגפות, המלחמות והשמועות על מלחמות, רעידות אדמה הן סימנים נבואיים,<sup><span class=\"footnote-ref\" title=\"מתי 24:4–8\">¹⁰</span></sup> הנוגעים בעיקר לשני דברים:</p><ul class=\"topic-list prophetic\"><li>ביאת האדון;</li><li>אחרית הימים.</li></ul><p>אפשר לחזות התפרצויות געשיות בדיוק; אולם עד היום אין מכשיר שיכול לחזות מתי תתרחש רעידת אדמה או רעידת משנה. אולי בעתיד. גוגל מזהה אותה רק לאחר שכבר החלה.</p><p>וכמובן, האדון חייב להיות נקודת ההתייחסות שלנו. הסימנים האלה הם יותר מאזהרה.</p><div class=\"verse-image\"><img src=\"salmo-91-he.png\" alt=\"ייפול מצדך אלף ורבבה מימינך, אליך לא ייגש. תהילים צ״א:ז׳\"></div><p>אלוהים הוא אל של סדר, איזון והרמוניה. זה מה שהוא רוצה שנבקש. הוא אומר:</p><blockquote class=\"scripture\">״בקשו תחילה את מלכות אלוהים ואת צדקתו — את האיזון שלו ואת דרכו לעשות את הישר — וכל הדברים האלה ייווספו לכם״.<sup><span class=\"footnote-ref\" title=\"מתי 6:33\">¹¹</span></sup></blockquote><p>כאשר איננו מבקשים את פניו,<sup><span class=\"footnote-ref\" title=\"תהילים 27:8\">¹²</span></sup> אנו עוברים מצבים לא נעימים.</p><p>חשוב להבין ולקבל שהדברים מתרחשים ברשות האלוהית, אך אלוהים אינו חפץ באסונו של האדם; הוא חפץ בשלומו.<sup><span class=\"footnote-ref\" title=\"תהילים 35:27–28\">¹³</span></sup></p><p>לכן עלינו לנהוג כלפי האדון בכבוד וביראה עמוקה.<sup><span class=\"footnote-ref\" title=\"עברים 12:28\">¹⁴</span></sup></p><p>איוב, אבי האומה, עבר קשיים ואסונות רבים. הוא איבד את משפחתו ואת רכושו בעקבות גנבים ושודדים, אש ורוח גדולה. נוסף על כך, השטן תקף אותו במחלות.</p><p>אף שחיפש בכל לבו הסבר מאלוהים למתקפה העצומה של הרע, הוא מעולם לא האשים את האדון בסבלו.</p><blockquote class=\"scripture\">״בכל זאת לא חטא איוב ולא הטיח אשמה באלוהים״.<sup><span class=\"footnote-ref\" title=\"איוב 1:22\">¹⁵</span></sup></blockquote><p>כאשר קורה דבר לא נעים, ואפילו נורא, אל תאשים את אלוהים. הוא חפץ בשלומך.</p><p>נכון שהוא לועג לאויביו,<sup><span class=\"footnote-ref\" title=\"תהילים 2:4\">¹⁶</span></sup> אך אתה אינך אויבו. אם קיבלת אותו, אתה ילדו.<sup><span class=\"footnote-ref\" title=\"יוחנן הראשונה 3:2; רומים 8:16\">¹⁷</span></sup></p><p>ואם עדיין לא עשית זאת, זו ההזדמנות שלך.</p><p>סיפורו של איוב לא הסתיים שם. לאחר שהתפלל בעד חבריו, שהאשימו אותו שלא בצדק באסונו, בירך אלוהים את איוב בשפע: הוא קיבל פי שניים ממה שהיה לו קודם, ברכות רבות, ילדים נוספים וחי עוד 140 שנה; הוא מת זקן ושבע ימים.</p><p>מי שנותרו בחיים לאחר האסון צריכים להתפלל ולסייע לניצולים האחרים ולאלה המתאבלים כיום על אובדן יקיריהם ורכושם.</p><p>אחרי הסערה בא השקט, ויש לבנות מחדש.</p><blockquote class=\"scripture\">״אל תשאל מה ארצך יכולה לעשות למענך; שאל מה אתה יכול לעשות למען ארצך״.<sup><span class=\"footnote-ref\" title=\"ציטוט מפורסם של ג׳ון פ׳ קנדי\">¹⁸</span></sup><cite>ציטוט מפורסם של ג׳ון פ׳ קנדי</cite></blockquote><p>הגיע הזמן לפעול. הגיע הזמן לבקש את האדון, כדי שיבוא וילמד אותנו צדק.<sup><span class=\"footnote-ref\" title=\"הושע 10:12\">¹⁹</span></sup></p><p>יש אנשים שאלוהים לוקח אליו ברחמיו, ויש אנשים שהוא משאיר בחיים, גם כן ברחמיו.</p>"},"ar":{"title":"إنه على علم — الجزء الثاني — La Palabra en Cápsulas","author":"بقلم J.V.","heading":"إنه على علم","part":"الجزء الثاني","nav":["← العودة إلى الجزء الأول","العودة إلى المقالات"],"article":"<p>تعرضت فنزويلا أولاً ثم كولومبيا لزلازل قوية. ونعلم أن دولاً أخرى قد تمر بأحداث مماثلة، كما حدث أيضاً في آسيا ومؤخراً في فلوريدا.</p><p>تقع هذه الأحداث جميعها بإذن الله، وكأن الأرض تتمرد وتحاول أن تقول شيئاً. وكان الواعظ الإنجيلي الإنجليزي الراحل تشارلز سبيرجن يقول في عظاته إن «الكوارث، وحتى الاضطرابات الطبيعية الظاهرية، تخضع لسيطرة اليد الإلهية». فحتى الفوضى جزء من النظام.</p><p>ومثل الأوبئة والحروب وأخبار الحروب، تُعد الزلازل علامات نبوية،<sup><span class=\"footnote-ref\" title=\"متى 24:4-8\">¹⁰</span></sup> وتتعلق أساساً بأمرين:</p><ul class=\"topic-list prophetic\"><li>مجيء الرب؛</li><li>نهاية الأزمنة.</li></ul><p>يمكن التنبؤ بالانفجارات البركانية بدقة؛ لكن حتى الآن لا يوجد جهاز يستطيع التنبؤ بموعد وقوع زلزال أو هزة ارتدادية. ربما يحدث ذلك في المستقبل. لا تكتشفه جوجل إلا بعد أن يكون قد بدأ بالفعل.</p><p>وبالطبع، يجب أن يكون الرب مرجعنا الأساسي. فهذه العلامات أكثر من مجرد تنبيه.</p><div class=\"verse-image\"><img src=\"salmo-91-ar.png\" alt=\"يسقط عن جانبك ألف وربوات عن يمينك، أما أنت فلا يقترب إليك. مزمور 91:7\"></div><p>الله إله النظام والتوازن والانسجام، وهذا ما يريدنا أن نسعى إليه. فهو يقول:</p><blockquote class=\"scripture\">«اطلبوا أولاً ملكوت الله وبرّه — توازنه وطريقته في الوجود والعمل بالعدل — وهذه كلها تُزاد لكم».<sup><span class=\"footnote-ref\" title=\"متى 6:33\">¹¹</span></sup></blockquote><p>عندما لا نطلب وجهه،<sup><span class=\"footnote-ref\" title=\"مزمور 27:8\">¹²</span></sup> نمر بظروف غير مريحة.</p><p>من الجيد أن نفهم ونقبل أن الأمور تحدث بإذن الله، لكنه لا يسرّ بمصيبة الإنسان، بل يسرّ بسلامه.<sup><span class=\"footnote-ref\" title=\"مزمور 35:27-28\">¹³</span></sup></p><p>لهذه الأسباب كلها، ينبغي أن نحافظ على موقف من الاحترام والرهبة المقدسة تجاه الرب.<sup><span class=\"footnote-ref\" title=\"عبرانيين 12:28\">¹⁴</span></sup></p><p>عاش أيوب، الأب الجليل، صعوبات ومصائب كثيرة. فقد عائلته وثروته بسبب اللصوص وقطاع الطرق والنار والريح العظيمة. كما أصابه الشيطان بالأمراض.</p><p>ومع أنه طلب بإلحاح من الله تفسيراً لذلك الهجوم الهائل من الشرير، فإنه لم يلم الرب قط على آلامه.</p><blockquote class=\"scripture\">«في كل هذا لم يخطئ أيوب ولم ينسب إلى الله ظلماً».<sup><span class=\"footnote-ref\" title=\"أيوب 1:22\">¹⁵</span></sup></blockquote><p>عندما يحدث أمر مزعج، بل ومروّع، فلا تلُم الله. فهو يسرّ بسلامك.</p><p>صحيح أنه يستهزئ بأعدائه،<sup><span class=\"footnote-ref\" title=\"مزمور 2:4\">¹⁶</span></sup> لكنك لست عدوه. إذا قبلته فأنت ابنه.<sup><span class=\"footnote-ref\" title=\"يوحنا الأولى 3:2؛ رومية 8:16\">¹⁷</span></sup></p><p>وإن لم تفعل ذلك بعد، فهذه فرصتك.</p><p>لم تنتهِ قصة أيوب عند ذلك. فبعد أن صلى من أجل أصدقائه الذين اتهموه ظلماً بالتسبب في مصيبته، بارك الله أيوب بركة عظيمة: أعطاه ضعف ما كان لديه من قبل، وبركات كثيرة وأبناء آخرين، وعاش 140 سنة إضافية، ثم مات شيخاً وشبعان الأيام.</p><p>ينبغي للذين نجوا من الكارثة أن يصلّوا ويساعدوا الناجين الآخرين وكل من يحزن اليوم لفقدان أحبائه وممتلكاته.</p><p>بعد العاصفة يأتي الهدوء، ولا بد من إعادة البناء.</p><blockquote class=\"scripture\">«لا تسأل ماذا يمكن لوطنك أن يفعل من أجلك؛ بل اسأل ماذا يمكنك أن تفعل أنت من أجل وطنك».<sup><span class=\"footnote-ref\" title=\"مقولة شهيرة لجون ف. كينيدي\">¹⁸</span></sup><cite>مقولة شهيرة لجون ف. كينيدي</cite></blockquote><p>حان وقت العمل. وحان وقت طلب الرب لكي يأتي ويعلّمنا البرّ.<sup><span class=\"footnote-ref\" title=\"هوشع 10:12\">¹⁹</span></sup></p><p>هناك أشخاص يأخذهم الله إليه برحمته، وهناك أشخاص يُبقيهم أحياء أيضاً برحمته.</p>"}};</script>
<script>
(function(){
 const article=document.querySelector('.article');
 const buttons=document.querySelectorAll('[data-lang]');
 const navLinks=document.querySelectorAll('.footer-nav a');
 const data=window.translations;
 const siteNames={
  es:'LA PALABRA EN CÁPSULAS',
  en:'THE WORD IN CAPSULES',
  zh:'胶囊中的话语',
  fr:'LA PAROLE EN CAPSULES',
  it:'LA PAROLA IN CAPSULE',
  pt:'A PALAVRA EM CÁPSULAS',
  he:'הַדָּבָר בִּכְמַסּוֹת',
  ar:'الكلمة في كبسولات'
 };
 function setLanguage(lang){
  if(!data[lang]) lang='es';
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='ar'||lang==='he')?'rtl':'ltr';
  document.title=data[lang].title;
  document.querySelector('.site-name').textContent=siteNames[lang]||siteNames.es;
  document.querySelector('.author').textContent=data[lang].author;
  document.querySelector('h1').textContent=data[lang].heading;
  document.querySelector('.part-label').textContent=data[lang].part;
  article.innerHTML=data[lang].article;
  navLinks.forEach((a,i)=>a.textContent=data[lang].nav[i]);
  buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  try{localStorage.setItem('lpc-language',lang)}catch(e){}
  bindNotes();
 }
 function bindNotes(){
  const notes=document.querySelectorAll('.footnote-ref');
  function close(){notes.forEach(n=>{n.classList.remove('show-note');n.setAttribute('aria-expanded','false')})}
  notes.forEach(n=>{n.setAttribute('aria-expanded','false');n.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const was=n.classList.contains('show-note');close();if(!was){n.classList.add('show-note');n.setAttribute('aria-expanded','true')}});n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click()}if(e.key==='Escape')close()})});
  document.addEventListener('click',close,{once:true});
 }
 buttons.forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
 let initial='es';try{const saved=localStorage.getItem('lpc-language');if(data[saved])initial=saved}catch(e){}
 setLanguage(initial);
})();
</script>
</body></html>
