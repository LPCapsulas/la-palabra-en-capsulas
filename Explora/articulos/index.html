        de: {

            title: "Artikel",
            intro: "Zum Nachdenken und Handeln.",
            articleTitle: "Er kennt unsere Lage",
            description: "Gott kennt unsere Umstände, unsere Bedürfnisse und das, womit wir oft still für uns allein kämpfen.",

            articleListLabel: "Artikelliste",

        },

        ja: {
            documentTitle: "記事 — カプセルに込められたみことば",
            title: "記事",
            intro: "考え、行動するために。",
            articleTitle: "神は私たちの状況をご存じです",
            description: "神は私たちの置かれた状況や必要、そして私たちがしばしば人知れず直面していることをご存じです。",
            part1: "第1部を読む →",
            part2: "第2部を読む →",

            articleListLabel: "記事一覧",
            footerLabel: "フッターナビゲーション",
            languageLabel: "言語の選択"
        }
    };

    function changeLanguage(lang) {
        if (!Object.prototype.hasOwnProperty.call(translations, lang)) {
            lang = "es";
        }

        const t = translations[lang];

        document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
        document.documentElement.dir = ["he", "ar"].includes(lang) ? "rtl" : "ltr";
        document.title = t.documentTitle;

        document.getElementById("page-title").textContent = t.title;
        document.getElementById("page-intro").textContent = t.intro;
        document.getElementById("article-title").textContent = t.articleTitle;
        document.getElementById("article-description").textContent = t.description;
        document.getElementById("part-1-link").textContent = t.part1;
        document.getElementById("part-2-link").textContent = t.part2;
        document.getElementById("back-link").textContent = t.back;

        document.getElementById("article-list").setAttribute(
            "aria-label", t.articleListLabel
        );

        document.getElementById("footer-nav").setAttribute(
            "aria-label", t.footerLabel
        );

        document.getElementById("language-bar").setAttribute(
            "aria-label", t.languageLabel
        );

        document.querySelectorAll(".lang-link").forEach(function (button) {
            const selected = button.id === "link-" + lang;
            button.classList.toggle("active", selected);
            button.setAttribute("aria-pressed", String(selected));
        });

        try {
            localStorage.setItem("lpc-language", lang);
            localStorage.setItem("user_language", lang);
        } catch (error) {
            /* La página sigue funcionando si el almacenamiento está desactivado. */
        }
    }

    window.changeLanguage = changeLanguage;

    const params = new URLSearchParams(window.location.search);
    const requestedLanguage = params.get("lang");

    let initialLanguage = "es";

    try {
        const savedLanguage =
            localStorage.getItem("lpc-language") ||
            localStorage.getItem("user_language");

        if (requestedLanguage && Object.prototype.hasOwnProperty.call(translations, requestedLanguage)) {
            initialLanguage = requestedLanguage;
        } else if (savedLanguage && Object.prototype.hasOwnProperty.call(translations, savedLanguage)) {
            initialLanguage = savedLanguage;
        }
    } catch (error) {
        if (requestedLanguage && Object.prototype.hasOwnProperty.call(translations, requestedLanguage)) {
            initialLanguage = requestedLanguage;
        }
    }

    changeLanguage(initialLanguage);
})();
