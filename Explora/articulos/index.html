<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artículos — La Palabra en Cápsulas</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: #f2f0ec; color: #252525; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; font-size: 17px; line-height: 1.8; }
.page { width: 92%; max-width: 900px; margin: 45px auto; background: #F8F4EC; padding: 55px 65px 45px; box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08); border-radius: 4px; transition: background 0.2s ease; }
.page:hover { background: #f1f2f2; }
.language-bar { width: 100%; display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 9px; margin-bottom: 18px; font-size: 13px; line-height: 1.5; }
.lang-link { padding: 0; border: 0; background: transparent; color: #666; font: inherit; cursor: pointer; text-decoration: none; transition: color 0.2s ease; }
.lang-link:hover, .lang-link.active { color: #17365D; }
.lang-link.active { font-weight: 700; }
.lang-divider { color: #aaa; user-select: none; }
h1 { margin: 0 0 12px; text-align: center; color: #17365D; font-family: Georgia, "Times New Roman", serif; font-size: 36px; line-height: 1.2; font-weight: 700; }
.intro { text-align: center; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; font-size: 17px; line-height: 1.6; margin: 0 auto 38px; max-width: 700px; color: #555; }
.article-list { margin-top: 20px; }
.article-card { border-left: 5px solid #17365D; background: #f8f8f6; padding: 24px 28px; margin-bottom: 24px; transition: background 0.2s ease, transform 0.2s ease; }
.article-card:hover { background: #f1f2f2; transform: translateX(3px); }
.article-card h2 { margin: 0 0 10px; font-family: Georgia, "Times New Roman", serif; font-size: 27px; line-height: 1.3; color: #17365D; }
.article-card p { margin: 0 0 20px; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; font-size: 17px; line-height: 1.8; color: #252525; text-align: justify; }
.read-link { display: inline-block; color: #17365D; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; font-weight: 700; text-decoration: none; font-size: 17px; line-height: 1.8; margin-bottom: 14px; }
.read-link:hover { text-decoration: underline; }
.footer-nav { text-align: center; margin-top: 45px; padding-top: 25px; border-top: 1px solid #ddd; }
.footer-nav a { color: #17365D; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; font-weight: 700; text-decoration: none; font-size: 17px; }
.footer-nav a:hover { text-decoration: underline; }
@media (max-width: 700px) {
 .page { width: 94%; margin: 25px auto; padding: 25px 24px 32px; }
 .language-bar { margin-bottom: 22px; gap: 6px; }
 h1 { font-size: 31px; line-height: 1.25; }
 .intro { font-size: 17px; line-height: 1.6; margin-bottom: 30px; }
 .article-card { padding: 21px 20px; }
 .article-card h2 { font-size: 25px; line-height: 1.3; }
 .article-card p { font-size: 17px; line-height: 1.8; }
 .read-link { font-size: 17px; line-height: 1.8; margin-bottom: 14px; }
 .footer-nav a { font-size: 17px; }
}
@media (hover: none) { .page, .article-card { transition: none; } .article-card:hover { transform: none; } }
/* Soporte de escritura de derecha a izquierda para hebreo y árabe */
html[dir="rtl"] body { direction: rtl; }
html[dir="rtl"] .language-bar { justify-content: flex-start; }
html[dir="rtl"] .article-card { border-left: 0; border-right: 5px solid #17365D; }
html[dir="rtl"] .article-card p { text-align: right; }
</style>
</head>
<body>
<main class="page">
 <nav class="language-bar" aria-label="Language selection">
  <button type="button" class="lang-link active" id="link-es" onclick="changeLanguage('es')" aria-pressed="true">Español</button><span class="lang-divider">|</span>
  <button type="button" class="lang-link" id="link-en" onclick="changeLanguage('en')" aria-pressed="false">English</button><span class="lang-divider">|</span>
  <button type="button" class="lang-link" id="link-zh" onclick="changeLanguage('zh')" aria-pressed="false">简体中文</button><span class="lang-divider">|</span>
  <button type="button" class="lang-link" id="link-fr" onclick="changeLanguage('fr')" aria-pressed="false">Français</button><span class="lang-divider">|</span>
  <button type="button" class="lang-link" id="link-it" onclick="changeLanguage('it')" aria-pressed="false">Italiano</button><span class="lang-divider">|</span>
  <button type="button" class="lang-link" id="link-pt" onclick="changeLanguage('pt')" aria-pressed="false">Português</button><span class="lang-divider">|</span>
  <button type="button" class="lang-link" id="link-he" onclick="changeLanguage('he')" aria-pressed="false">עברית</button><span class="lang-divider">|</span>
  <button type="button" class="lang-link" id="link-ar" onclick="changeLanguage('ar')" aria-pressed="false">العربية</button>
 </nav>
 <h1 id="page-title">Artículos</h1>
 <p class="intro" id="page-intro">Para reflexionar, y tomar acción.</p>
 <section class="article-list" id="article-list" aria-label="Lista de artículos">
  <article class="article-card">
   <h2 id="article-title">Él sabe nuestra condición</h2>
   <p id="article-description">Dios conoce nuestras circunstancias, necesidades y aquello que muchas veces enfrentamos en silencio.</p>
   <a class="read-link" id="part-1-link" href="el-esta-al-tanto-parte-1.html">Leer Parte 1 →</a><br>
   <a class="read-link" id="part-2-link" href="el-esta-al-tanto-parte-2.html">Leer Parte 2 →</a>
  </article>
 </section>
 <nav class="footer-nav" aria-label="Navegación inferior"><a href="../menu.html" id="back-link">← Volver al Menú</a></nav>
</main>
<script>
(function () {
 const translations = {
  es: {documentTitle:"Artículos — La Palabra en Cápsulas", title:"Artículos", intro:"Para reflexionar, y tomar acción.", articleTitle:"Él sabe nuestra condición", description:"Dios conoce nuestras circunstancias, necesidades y aquello que muchas veces enfrentamos en silencio.", part1:"Leer Parte 1 →", part2:"Leer Parte 2 →", back:"← Volver al Menú", articleListLabel:"Lista de artículos", footerLabel:"Navegación inferior", languageLabel:"Selección de idioma"},
  en: {documentTitle:"Articles — The Word in Capsules", title:"Articles", intro:"For reflection and action.", articleTitle:"He Knows Our Condition", description:"God knows our circumstances, our needs, and the things we often face in silence.", part1:"Read Part 1 →", part2:"Read Part 2 →", back:"← Back to Menu", articleListLabel:"List of articles", footerLabel:"Footer navigation", languageLabel:"Language selection"},
  fr: {documentTitle:"Articles — La Parole en Capsules", title:"Articles", intro:"Pour réfléchir et passer à l’action.", articleTitle:"Il connaît notre condition", description:"Dieu connaît nos circonstances, nos besoins et les épreuves que nous traversons souvent en silence.", part1:"Lire la partie 1 →", part2:"Lire la partie 2 →", back:"← Retour au menu", articleListLabel:"Liste des articles", footerLabel:"Navigation de bas de page", languageLabel:"Sélection de la langue"},
  zh: {documentTitle:"文章 — 胶囊中的话语", title:"文章", intro:"引发思考，并付诸行动。", articleTitle:"祂知道我们的处境", description:"上帝知道我们的处境和需要，也知道那些我们常常默默承受的事情。", part1:"阅读第一部分 →", part2:"阅读第二部分 →", back:"← 返回菜单", articleListLabel:"文章列表", footerLabel:"页脚导航", languageLabel:"语言选择"},
  it: {documentTitle:"Articoli — La Parola in Capsule", title:"Articoli", intro:"Per riflettere e passare all’azione.", articleTitle:"Egli conosce la nostra condizione", description:"Dio conosce le nostre circostanze, i nostri bisogni e ciò che spesso affrontiamo in silenzio.", part1:"Leggi la Parte 1 →", part2:"Leggi la Parte 2 →", back:"← Torna al menu", articleListLabel:"Elenco degli articoli", footerLabel:"Navigazione a piè di pagina", languageLabel:"Selezione della lingua"},
  pt: {documentTitle:"Artigos — A Palavra em Cápsulas", title:"Artigos", intro:"Para refletir e agir.", articleTitle:"Ele conhece a nossa condição", description:"Deus conhece as nossas circunstâncias, as nossas necessidades e aquilo que muitas vezes enfrentamos em silêncio.", part1:"Ler a Parte 1 →", part2:"Ler a Parte 2 →", back:"← Voltar ao menu", articleListLabel:"Lista de artigos", footerLabel:"Navegação do rodapé", languageLabel:"Seleção de idioma"},
  he: {documentTitle:"מאמרים — דבר אלוהים בקפסולות", title:"מאמרים", intro:"להרהר ולפעול.", articleTitle:"הוא יודע מה מצבנו", description:"אלוהים מכיר את נסיבות חיינו ואת צורכינו, ויודע מה אנו נאלצים לעיתים קרובות להתמודד איתו בשקט.", part1:"לקריאת חלק 1 ←", part2:"לקריאת חלק 2 ←", back:"חזרה לתפריט ←", articleListLabel:"רשימת מאמרים", footerLabel:"ניווט תחתון", languageLabel:"בחירת שפה"},
  ar: {documentTitle:"مقالات — كلمة الله في كبسولات", title:"مقالات", intro:"للتأمل واتخاذ الخطوات العملية.", articleTitle:"إنه يعرف حالنا", description:"يعرف الله ظروفنا واحتياجاتنا وما نواجهه كثيرًا في صمت.", part1:"اقرأ الجزء الأول ←", part2:"اقرأ الجزء الثاني ←", back:"العودة إلى القائمة ←", articleListLabel:"قائمة المقالات", footerLabel:"التنقل السفلي", languageLabel:"اختيار اللغة"}
 };
 function changeLanguage(lang) {
  if (!translations[lang]) lang = "es";
  const t = translations[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.documentElement.dir = ["he", "ar"].includes(lang) ? "rtl" : "ltr";
  document.title = t.documentTitle;
  document.getElementById("page-title").textContent = t.title;
  document.getElementById("page-intro").textContent = t.intro;
  document.getElementById("article-title").textContent = t.articleTitle;
  document.getElementById("article-description").textContent = t.description;
  document.getElementById("part-1-link").textContent = t.part1;
  document.getElementById("part-2-link").textContent = t.part2;
  document.getElementById("back-link").textContent = t.back;
  document.getElementById("article-list").setAttribute("aria-label", t.articleListLabel);
  document.querySelector(".footer-nav").setAttribute("aria-label", t.footerLabel);
  document.querySelector(".language-bar").setAttribute("aria-label", t.languageLabel);
  document.querySelectorAll(".lang-link").forEach(function (button) {
   const selected = button.id === "link-" + lang;
   button.classList.toggle("active", selected);
   button.setAttribute("aria-pressed", String(selected));
  });
  try { localStorage.setItem("lpc-language", lang); localStorage.setItem("user_language", lang); } catch (error) { /* La página sigue funcionando si el almacenamiento está desactivado. */ }
 }
 window.changeLanguage = changeLanguage;
 const params = new URLSearchParams(window.location.search);
 const requestedLanguage = params.get("lang");
 let initialLanguage = "es";
 try { initialLanguage = requestedLanguage || localStorage.getItem("lpc-language") || localStorage.getItem("user_language") || "es"; }
 catch (error) { initialLanguage = requestedLanguage || "es"; }
 changeLanguage(initialLanguage);
})();
</script>
</body>
</html>
