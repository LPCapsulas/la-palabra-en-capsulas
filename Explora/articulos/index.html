<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Artículos — La Palabra en Cápsulas</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f2f0ec;
    color:#252525;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    font-size:17px;
    line-height:1.8;
}

.page{
    width:92%;
    max-width:900px;
    margin:45px auto;
    background:#F8F4EC;
    padding:55px 65px 45px;
    box-shadow:0 3px 14px rgba(0,0,0,0.08);
    border-radius:4px;
    transition:background 0.2s ease;
}

.page:hover{
    background:#f1f2f2;
}

h1{
    margin:0 0 12px;
    text-align:center;
    color:#17365D;
    font-family:Georgia,"Times New Roman",serif;
    font-size:36px;
    line-height:1.2;
    font-weight:700;
}

.intro{
    text-align:center;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    font-size:17px;
    line-height:1.6;
    margin:0 auto 38px;
    max-width:700px;
    color:#555;
}

.article-list{
    margin-top:20px;
}

.article-card{
    border-left:5px solid #17365D;
    background:#f8f8f6;
    padding:24px 28px;
    margin-bottom:24px;
    transition:background 0.2s ease,transform 0.2s ease;
}

.article-card:hover{
    background:#f1f2f2;
    transform:translateX(3px);
}

.article-card h2{
    margin:0 0 10px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:27px;
    line-height:1.3;
    color:#17365D;
}

.article-card p{
    margin:0 0 20px;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    font-size:17px;
    line-height:1.8;
    color:#252525;
    text-align:justify;
}

.read-link{
    display:inline-block;
    color:#17365D;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    font-weight:700;
    text-decoration:none;
    font-size:17px;
    line-height:1.8;
    margin-bottom:14px;
}

.read-link:hover{
    text-decoration:underline;
}

.footer-nav{
    text-align:center;
    margin-top:45px;
    padding-top:25px;
    border-top:1px solid #ddd;
}

.footer-nav a{
    color:#17365D;
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    font-weight:700;
    text-decoration:none;
    font-size:17px;
}

.footer-nav a:hover{
    text-decoration:underline;
}

/* CELULAR */

@media(max-width:700px){

    .page{
        width:94%;
        margin:25px auto;
        padding:38px 24px 32px;
    }

    h1{
        font-size:31px;
        line-height:1.25;
    }

    .intro{
        font-size:17px;
        line-height:1.6;
        margin-bottom:30px;
    }

    .article-card{
        padding:21px 20px;
    }

    .article-card h2{
        font-size:25px;
        line-height:1.3;
    }

    .article-card p{
        font-size:17px;
        line-height:1.8;
    }

    .read-link{
        font-size:17px;
        line-height:1.8;
        margin-bottom:14px;
    }

    .footer-nav a{
        font-size:17px;
    }
}

/* DISPOSITIVOS SIN MOUSE */

@media(hover:none){
    .page,
    .article-card{
        transition:none;
    }

    .article-card:hover{
        transform:none;
    }
}

</style>
</head>

<body>

<main class="page">

    <h1>Artículos</h1>

    <p class="intro">
        Para reflexionar, y tomar acción.
    </p>

    <section class="article-list">

        <article class="article-card">

            <h2>Él sabe nuestra condición</h2>

            <p>
                Dios conoce nuestras circunstancias, necesidades
                y aquello que muchas veces enfrentamos en silencio.
            </p>

            <a class="read-link"
               href="el-esta-al-tanto-parte-1.html">
                Leer Parte 1 →
            </a>

            <br>

            <a class="read-link"
               href="el-esta-al-tanto-parte-2.html">
                Leer Parte 2 →
            </a>

        </article>

    </section>

    <nav class="footer-nav">

        <a href="../menu.html">
            ← Volver al Menú
        </a>

    </nav>

</main>

</body>
</html>
