<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f2f0ec;
    color:#222;
    font-family:"Segoe UI",Arial,sans-serif;
}

.page{
    width:92%;
    max-width:900px;
    margin:45px auto;
    background:#F8F4EC;
    padding:55px 65px 45px;
    box-shadow:0 3px 14px rgba(0,0,0,0.08);
    border-radius:4px;
}

h1{
    margin:0 0 12px;
    text-align:center;
    color:#17365D;
    font-family:Georgia,"Times New Roman",serif;
    font-size:38px;

}

.intro{

    font-size:18px;
    line-height:1.6;
    margin:0 auto 38px;
    max-width:700px;
    color:#555;
}

.article-list{
    margin-top:20px;
}

.article-card{
    border-left:5px solid #17365D;
    background:#f8f8f6;
    padding:24px 28px;
    margin-bottom:24px;
    transition:background 0.2s ease,transform 0.2s ease;
}

.article-card:hover{
    background:#f1f2f2;
    transform:translateX(3px);
}

.article-card h2{
    margin:0 0 10px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    color:#17365D;
}

.article-card p{
    margin:0 0 18px;
    font-size:17px;
    line-height:1.6;
    color:#333;
}

.read-link{
    display:inline-block;
    color:#17365D;
    font-weight:700;
    text-decoration:none;
    font-size:16px;
    margin-bottom:4px;
}

.read-link:hover{
    text-decoration:underline;
}

.footer-nav{
    text-align:center;
    margin-top:45px;
    padding-top:25px;
    border-top:1px solid #ddd;
}

.footer-nav a{
    color:#17365D;
    font-weight:700;
    text-decoration:none;
    font-size:16px;
}

.footer-nav a:hover{
    text-decoration:underline;
}

@media (max-width:700px){

    .page{
        width:94%;
        margin:25px auto;
        padding:38px 24px 32px;
    }

    h1{
        font-size:31px;
    }

    .intro{
        font-size:17px;
        margin-bottom:30px;
    }

    .article-card{
        padding:21px 20px;
    }

    .article-card h2{
        font-size:23px;
    }

    .article-card p{
        font-size:16px;
    }

    .read-link{
        font-size:16px;
    }
}
</style>
