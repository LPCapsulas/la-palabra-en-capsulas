<script>window.translations = {'es': {'title': 'Él está al tanto — Parte 1 — La Palabra en Cápsulas', 'author': 'Por J.V.', 'heading': 'Él está al tanto', 'part': 'Parte 1', 'article': '<p>Amigos, nadie está exento de sufrir algo tan terrible como un terremoto o de una situación angustiosa. Pero de algo sí estoy seguro: Dios es misericordioso<sup><span class="footnote-ref" title="Efesios 2:4-5" role="button" tabindex="0">¹<span class="footnote-popup">Efesios 2:4-5</span></span></sup>, y por tanto, podemos pedir su protección.<sup><span class="footnote-ref" title="Salmos 18:2" role="button" tabindex="0">²<span class="footnote-popup">Salmos 18:2</span></span></sup> Desde hace un tiempo, además de mis oraciones regulares, he incluido en ellas un <strong>refuerzo</strong>: pedir al Altísimo que nos proteja de toda cosa negativa.</p>\n<div class="cascade"><div>• Calamidad, accidente, secuestro, tsunami, huracán o terremoto.</div><div>• Accidentes, atracos y extorsiones.</div><div>• Enfermedades crueles y dolorosas.</div><div>• Y, como dice la oración modelo, que nos libre de todo mal.</div></div>\n<p>Como escribí arriba, esos elementos los he incluido en mis oraciones. Debemos elevar nuestra petición al único Santo Padre del cielo que hay, en el nombre de Jesús, y agradecer al final, creyendo que Él ya lo ha hecho. Adore al Señor en ese mismo instante con acción de gracias, pues eso es de su agrado.</p>\n<p>La iglesia cristiana en el mundo no encomienda su propio país a ídolos, estatuas o a todo aquello que desagrade a Dios. Quien lo hace es porque no ha nacido de nuevo, y debemos compartirle el consejo de Dios para que pase por su proceso de conversión. Y déjenme decirles: hay personas que se han ido a ídolos por ignorancia, no por convicción, y es por ello que los creyentes debemos evangelizar a los que están en la búsqueda.</p>\n<p>Jeremías 7 y 44 son dos capítulos de la Biblia muy contundentes, donde el Señor advierte sobre los peligros de adorar a la <em>reina del cielo</em>. En la antigüedad, a esa deidad le llamaban Artemis, según la mitología griega; luego Diana en Asia Menor —hoy Turquía—.</p>\n<p>Posteriormente, los papas en Roma, pensando en qué nombre ponerle a una divinidad femenina para asemejarse a las antiguas deidades paganas, escogieron el nombre de alguien que hubiera existido y dijeron: “María”.</p>\n<p>Ella nunca quiso ser venerada. La religión fue la que lo hizo.</p>\n<p>Y aquí quiero ser claro. María, la madre de Jesús, fue una mujer piadosa, pero igual requirió de un Salvador: ¡su propio hijo! Ella dijo:</p>\n<blockquote class="scripture">“Engrandece mi alma al Señor; y mi espíritu se regocija en Dios mi Salvador”.<sup><span class="footnote-ref" title="Lucas 1:46-47" role="button" tabindex="0">³<span class="footnote-popup">Lucas 1:46-47</span></span></sup></blockquote>\n<p>Jesús es el Cristo,<sup><span class="footnote-ref" title="Mateo 16:16" role="button" tabindex="0">⁴<span class="footnote-popup">Mateo 16:16</span></span></sup> y Cristo es Dios sobre todas las cosas.<sup><span class="footnote-ref" title="Romanos 9:5" role="button" tabindex="0">⁵<span class="footnote-popup">Romanos 9:5</span></span></sup></p>\n<p>En las bodas de Caná, María dijo con respecto a su hijo:</p>\n<blockquote class="scripture">“Haced todo lo que él os dijere”.<sup><span class="footnote-ref" title="Juan 2:5" role="button" tabindex="0">⁶<span class="footnote-popup">Juan 2:5</span></span></sup></blockquote>\n<p>Hay millones en el mundo que no conocen esta simple verdad, y hay aún sacerdotes católicos que sirven a un dios muerto, colgado en una cruz.</p>\n<p>En realidad, no desconozco que haya personas en la religión tradicional que intenten ofrecer ayuda a muchos que sufren, pero su doctrina errónea no les deja ver más allá de lo que ven sus ojos y siguen percibiendo a Jesús en una cruz.</p>\n<p>Si usted quiere conocer la verdad, deberá leer la Biblia para conocer más a Jesús, su vida y lo que hizo por nosotros.</p>\n<p>Debemos orar por nuestros gobernantes y anunciarles el evangelio, no solo porque es nuestro deber, sino porque, si no lo hacemos, no tendremos país.</p>\n<p>“El que ignorantemente peca, ignorantemente se condena” es un adagio popular. De nuevo: Si alguien no anda conforme a la Biblia y tiene buenas intenciones de hacer el bien, se le debe hablar con respeto para que corrija su caminar.</p>\n<blockquote class="scripture">La buena noticia es que Jesús no está en un madero, pues después de morir por nuestros pecados, resucitó al tercer día de entre los muertos, ascendió al cielo y está sentado a la diestra del Padre.</blockquote>\n<p>Dios es celoso y no admite ser compartido.<sup><span class="footnote-ref" title="Éxodo 20:5" role="button" tabindex="0">⁷<span class="footnote-popup">Éxodo 20:5</span></span></sup> Si por un lado alguien va a hablar de Jesucristo y por otro va a incensar a María o a espíritus de fallecidos,<sup><span class="footnote-ref" title="Deuteronomio 18:10-12" role="button" tabindex="0">⁸<span class="footnote-popup">Deuteronomio 18:10-12</span></span></sup>, siendo un craso error, la cosa no le va a funcionar.</p>\n<p>Si quiere ir a la fija, considere al Padre, al Hijo y al Espíritu Santo. Todo con la Deidad, sin ella, nada.</p>', 'nav': ['Continuar con Parte 2 →', '← Volver a Artículos']}, 'en': {'title': 'He Is Aware — Part 1 — La Palabra en Cápsulas', 'author': 'By J.V.', 'heading': 'He Is Aware', 'part': 'Part 1', 'article': '<p>Friends, no one is exempt from suffering something as terrible as an earthquake or an anguishing situation. But there is one thing I am sure of: God is merciful<sup><span class="footnote-ref" title="Ephesians 2:4-5" role="button" tabindex="0">¹<span class="footnote-popup">Ephesians 2:4-5</span></span></sup>, and therefore we can ask for His protection.<sup><span class="footnote-ref" title="Psalm 18:2" role="button" tabindex="0">²<span class="footnote-popup">Psalm 18:2</span></span></sup> For some time now, in addition to my regular prayers, I have included an extra <strong>reinforcement</strong>: asking the Most High to protect us from every kind of harm.</p>\n<div class="cascade"><div>• Calamity, accident, kidnapping, tsunami, hurricane, or earthquake.</div><div>• Accidents, robberies, and extortion.</div><div>• Cruel and painful illnesses.</div><div>• And, as the model prayer says, that He deliver us from all evil.</div></div>\n<p>As I wrote above, I have included these things in my prayers. We should lift our request to the one Holy Father in heaven, in the name of Jesus, and give thanks at the end, believing that He has already done it. Worship the Lord at that very moment with thanksgiving, for this pleases Him.</p>\n<p>The Christian church around the world does not entrust its own country to idols, statues, or anything that displeases God. Those who do so have not been born again, and we should share God’s counsel with them so they can go through the process of conversion. Let me tell you: some have turned to idols out of ignorance, not conviction; that is why believers should share the gospel with those who are seeking.</p>\n<p>Jeremiah 7 and 44 are two very forceful chapters of the Bible in which the Lord warns about the dangers of worshiping the <em>queen of heaven</em>. In ancient times, according to Greek mythology, that deity was called Artemis; later, Diana in Asia Minor—today’s Turkey.</p>\n<p>Later, the popes in Rome, thinking of what name to give a female divinity to resemble ancient pagan deities, chose the name of someone who had existed and said: “Mary.”</p>\n<p>She never wanted to be venerated. Religion was the one that did so.</p>\n<p>And here I want to be clear. Mary, the mother of Jesus, was a devout woman, but she too needed a Savior: her own son! She said:</p>\n<blockquote class="scripture">“My soul magnifies the Lord, and my spirit rejoices in God my Savior.”<sup><span class="footnote-ref" title="Luke 1:46-47" role="button" tabindex="0">³<span class="footnote-popup">Luke 1:46-47</span></span></sup></blockquote>\n<p>Jesus is the Christ,<sup><span class="footnote-ref" title="Matthew 16:16" role="button" tabindex="0">⁴<span class="footnote-popup">Matthew 16:16</span></span></sup> and Christ is God over all.<sup><span class="footnote-ref" title="Romans 9:5" role="button" tabindex="0">⁵<span class="footnote-popup">Romans 9:5</span></span></sup></p>\n<p>At the wedding in Cana, Mary said about her son:</p>\n<blockquote class="scripture">“Do whatever he tells you.”<sup><span class="footnote-ref" title="John 2:5" role="button" tabindex="0">⁶<span class="footnote-popup">John 2:5</span></span></sup></blockquote>\n<p>Millions around the world do not know this simple truth, and there are still Catholic priests who serve a dead god hanging on a cross.</p>\n<p>I do recognize that some people in traditional religion try to help many who suffer, but their mistaken doctrine does not let them see beyond what their eyes can see, and they continue to picture Jesus on a cross.</p>\n<p>If you want to know the truth, you must read the Bible to learn more about Jesus, His life, and what He did for us.</p>\n<p>We must pray for our leaders and proclaim the gospel to them, not only because it is our duty, but because if we do not, we will have no country.</p>\n<p>“Those who sin in ignorance are condemned in ignorance” is a popular saying. Again, if someone does not walk according to the Bible but has good intentions and wants to do good, we should speak to that person respectfully so they can correct their path.</p>\n<blockquote class="scripture">The good news is that Jesus is no longer on a wooden cross: after dying for our sins, He rose from the dead on the third day, ascended to heaven, and is seated at the Father’s right hand.</blockquote>\n<p>God is jealous and does not allow Himself to be shared.<sup><span class="footnote-ref" title="Exodus 20:5" role="button" tabindex="0">⁷<span class="footnote-popup">Exodus 20:5</span></span></sup> If someone speaks about Jesus Christ on one hand and burns incense to Mary or to the spirits of the dead on the other,<sup><span class="footnote-ref" title="Deuteronomy 18:10-12" role="button" tabindex="0">⁸<span class="footnote-popup">Deuteronomy 18:10-12</span></span></sup>—a serious error—it will not work.</p>\n<p>If you want to be sure, consider the Father, the Son, and the Holy Spirit. Everything with the Godhead; without it, nothing.</p>', 'nav': ['Continue to Part 2 →', '← Back to Articles']}, 'fr': {'title': 'Il est au courant — Partie 1 — La Palabra en Cápsulas', 'author': 'Par J.V.', 'heading': 'Il est au courant', 'part': 'Partie 1', 'article': '<p>Amis, personne n’est à l’abri d’une épreuve aussi terrible qu’un tremblement de terre ou d’une situation angoissante. Mais je suis sûr d’une chose : Dieu est miséricordieux<sup><span class="footnote-ref" title="Éphésiens 2:4-5" role="button" tabindex="0">¹<span class="footnote-popup">Éphésiens 2:4-5</span></span></sup> et nous pouvons donc demander sa protection.<sup><span class="footnote-ref" title="Psaume 18:2" role="button" tabindex="0">²<span class="footnote-popup">Psaume 18:2</span></span></sup> Depuis quelque temps, en plus de mes prières habituelles, j’y ai ajouté un <strong>renforcement</strong> : demander au Très-Haut de nous protéger de toute chose négative.</p>\n<div class="cascade"><div>• Catastrophe, accident, enlèvement, tsunami, ouragan ou tremblement de terre.</div><div>• Accidents, vols et extorsions.</div><div>• Maladies cruelles et douloureuses.</div><div>• Et, comme le dit la prière modèle, qu’il nous délivre de tout mal.</div></div>\n<p>Comme je l’ai écrit plus haut, j’ai inclus ces éléments dans mes prières. Nous devons adresser notre demande au seul Saint Père qui est au ciel, au nom de Jésus, puis rendre grâce en croyant qu’il l’a déjà exaucée. Adorez le Seigneur à cet instant même avec des actions de grâce, car cela lui plaît.</p>\n<p>L’Église chrétienne dans le monde ne confie pas son propre pays à des idoles, à des statues ou à tout ce qui déplaît à Dieu. Ceux qui le font ne sont pas nés de nouveau ; nous devons leur transmettre le conseil de Dieu afin qu’ils puissent suivre un chemin de conversion. Et laissez-moi vous dire ceci : certaines personnes se sont tournées vers les idoles par ignorance, et non par conviction. C’est pourquoi les croyants doivent annoncer l’Évangile à ceux qui cherchent.</p>\n<p>Jérémie 7 et 44 sont deux chapitres très explicites de la Bible dans lesquels le Seigneur met en garde contre les dangers du culte de la <em>reine du ciel</em>. Dans l’Antiquité, cette divinité était appelée Artémis selon la mythologie grecque, puis Diane en Asie Mineure — l’actuelle Turquie.</p>\n<p>Plus tard, les papes de Rome, cherchant un nom pour une divinité féminine qui rappelle les anciennes divinités païennes, ont choisi le nom d’une personne qui avait réellement existé et ont dit : « Marie ».</p>\n<p>Elle n’a jamais voulu être vénérée. C’est la religion qui l’a fait.</p>\n<p>Et je veux être clair sur ce point. Marie, la mère de Jésus, était une femme pieuse, mais elle avait elle aussi besoin d’un Sauveur : son propre fils ! Elle a dit :</p>\n<blockquote class="scripture">« Mon âme exalte le Seigneur, et mon esprit se réjouit en Dieu, mon Sauveur. »<sup><span class="footnote-ref" title="Luc 1:46-47" role="button" tabindex="0">³<span class="footnote-popup">Luc 1:46-47</span></span></sup></blockquote>\n<p>Jésus est le Christ,<sup><span class="footnote-ref" title="Matthieu 16:16" role="button" tabindex="0">⁴<span class="footnote-popup">Matthieu 16:16</span></span></sup> et le Christ est Dieu au-dessus de toutes choses.<sup><span class="footnote-ref" title="Romains 9:5" role="button" tabindex="0">⁵<span class="footnote-popup">Romains 9:5</span></span></sup></p>\n<p>Lors des noces de Cana, Marie a dit au sujet de son fils :</p>\n<blockquote class="scripture">« Faites tout ce qu’il vous dira. »<sup><span class="footnote-ref" title="Jean 2:5" role="button" tabindex="0">⁶<span class="footnote-popup">Jean 2:5</span></span></sup></blockquote>\n<p>Des millions de personnes dans le monde ne connaissent pas cette vérité simple, et il existe encore des prêtres catholiques qui servent un dieu mort, suspendu à une croix.</p>\n<p>Je ne nie pas que certaines personnes de la religion traditionnelle essaient d’aider ceux qui souffrent, mais leur doctrine erronée les empêche de voir au-delà de ce que leurs yeux perçoivent ; ils continuent à représenter Jésus sur une croix.</p>\n<p>Si vous voulez connaître la vérité, vous devez lire la Bible pour mieux connaître Jésus, sa vie et ce qu’il a fait pour nous.</p>\n<p>Nous devons prier pour nos dirigeants et leur annoncer l’Évangile, non seulement parce que c’est notre devoir, mais aussi parce que, si nous ne le faisons pas, nous n’aurons plus de pays.</p>\n<p>« Celui qui pèche par ignorance est condamné par ignorance » est un dicton populaire. Encore une fois, si quelqu’un ne marche pas selon la Bible mais a de bonnes intentions et veut faire le bien, il faut lui parler avec respect afin qu’il corrige sa conduite.</p>\n<blockquote class="scripture">La bonne nouvelle, c’est que Jésus n’est plus sur un bois : après être mort pour nos péchés, il est ressuscité des morts le troisième jour, il est monté au ciel et siège à la droite du Père.</blockquote>\n<p>Dieu est jaloux et n’accepte pas d’être partagé.<sup><span class="footnote-ref" title="Exode 20:5" role="button" tabindex="0">⁷<span class="footnote-popup">Exode 20:5</span></span></sup> Si quelqu’un parle de Jésus-Christ d’un côté et brûle de l’encens à Marie ou aux esprits des défunts de l’autre,<sup><span class="footnote-ref" title="Deutéronome 18:10-12" role="button" tabindex="0">⁸<span class="footnote-popup">Deutéronome 18:10-12</span></span></sup> — ce qui est une grave erreur — cela ne fonctionnera pas.</p>\n<p>Si vous voulez être sûr de votre choix, considérez le Père, le Fils et le Saint-Esprit. Tout avec la Divinité, sans elle, rien.</p>', 'nav': ['Continuer vers la partie 2 →', '← Retour aux articles']}};</script>
<script>
(function(){
 const article=document.querySelector('.article');
 const buttons=document.querySelectorAll('[data-lang]');
 const navLinks=document.querySelectorAll('.footer-nav a');
 const data=window.translations;
 function setLanguage(lang){
  const supported=['es','en','fr','zh','it','pt','he','ar'];
  if(!supported.includes(lang)) lang='es';
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='he'||lang==='ar')?'rtl':'ltr';
  buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  try{localStorage.setItem('lpc-language',lang)}catch(e){}
  if(data[lang]){
   document.title=data[lang].title;
   document.querySelector('.author').textContent=data[lang].author;
   document.querySelector('h1').textContent=data[lang].heading;
   document.querySelector('.part-label').textContent=data[lang].part;
   article.innerHTML=data[lang].article;
   navLinks.forEach((a,i)=>a.textContent=data[lang].nav[i]);
   bindNotes();
   const combo=document.querySelector('.goog-te-combo');
   if(combo && combo.value){combo.value='';combo.dispatchEvent(new Event('change'));}
  } else {
   // Use Google Translate for additional languages while keeping the original article intact.
   const combo=document.querySelector('.goog-te-combo');
   if(combo){combo.value=lang;combo.dispatchEvent(new Event('change'));}
   else { window.__lpcPendingLanguage=lang; }
  }
 }
 window.googleTranslateElementInit=function(){
  if(window.google && google.translate){
   new google.translate.TranslateElement({pageLanguage:'es',includedLanguages:'es,en,zh-CN,fr,it,pt,he,ar',autoDisplay:false},'google_translate_element');
   const pending=window.__lpcPendingLanguage;
   if(pending){setTimeout(()=>{const combo=document.querySelector('.goog-te-combo');if(combo){combo.value=pending;combo.dispatchEvent(new Event('change'));}},800);}
  }
 };
 function bindNotes(){
  const notes=document.querySelectorAll('.footnote-ref');
  function close(){notes.forEach(n=>{n.classList.remove('show-note');n.setAttribute('aria-expanded','false')})}
  notes.forEach(n=>{n.setAttribute('aria-expanded','false');n.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const was=n.classList.contains('show-note');close();if(!was){n.classList.add('show-note');n.setAttribute('aria-expanded','true')}});n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click()}if(e.key==='Escape')close()})});
  document.addEventListener('click',close,{once:true});
 }
 buttons.forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
 const translateScript=document.createElement('script');translateScript.src='https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';translateScript.async=true;document.head.appendChild(translateScript);
 let initial='es';try{const saved=localStorage.getItem('lpc-language');if(data[saved])initial=saved}catch(e){}
 setLanguage(initial);
})();
</script>
