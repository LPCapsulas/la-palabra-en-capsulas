const translations = {
es: {
title:"Él está al tanto — Parte 1 — La Palabra en Cápsulas",
author:"Por J.V.",
heading:"Él está al tanto",
part:"Parte 1",
nav:["Continuar con Parte 2 →","← Volver a Artículos"],
article:`
<p>Amigos, nadie está exento de sufrir algo tan terrible como un terremoto o de una situación angustiosa. Pero de algo sí estoy seguro: Dios es misericordioso<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 1">¹<span class="footnote-popup">Efesios 2:4-5</span></span></sup>, y por tanto, podemos pedir su protección.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 2">²<span class="footnote-popup">Salmos 18:2</span></span></sup> Desde hace un tiempo, además de mis oraciones regulares, he incluido en ellas un <strong>refuerzo</strong>: pedir al Altísimo que nos proteja de toda cosa negativa.</p>
<div class="cascade"><div>• Calamidad, accidente, secuestro, tsunami, huracán o terremoto.</div><div>• Accidentes, atracos y extorsiones.</div><div>• Enfermedades crueles y dolorosas.</div><div>• Y, como dice la oración modelo, que nos libre de todo mal.</div></div>
<p>Como escribí arriba, esos elementos los he incluido en mis oraciones. Debemos elevar nuestra petición al único Santo Padre del cielo que hay, en el nombre de Jesús, y agradecer al final, creyendo que Él ya lo ha hecho. Adore al Señor en ese mismo instante con acción de gracias, pues eso es de su agrado.</p>
<p>La iglesia cristiana en el mundo no encomienda su propio país a ídolos, estatuas o a todo aquello que desagrade a Dios. Quien lo hace es porque no ha nacido de nuevo, y debemos compartirle el consejo de Dios para que pase por su proceso de conversión. Y déjenme decirles: hay personas que se han ido a ídolos por ignorancia, no por convicción, y es por ello que los creyentes debemos evangelizar a los que están en la búsqueda.</p>
<p>Jeremías 7 y 44 son dos capítulos de la Biblia muy contundentes, donde el Señor advierte sobre los peligros de adorar a la <em>reina del cielo</em>. En la antigüedad, a esa deidad le llamaban Artemis, según la mitología griega; luego Diana en Asia Menor —hoy Turquía—.</p>
<p>Posteriormente, los papas en Roma, pensando en qué nombre ponerle a una divinidad femenina para asemejarse a las antiguas deidades paganas, escogieron el nombre de alguien que hubiera existido y dijeron: “María”.</p>
<p>Ella nunca quiso ser venerada. La religión fue la que lo hizo.</p>
<p>Y aquí quiero ser claro. María, la madre de Jesús, fue una mujer piadosa, pero igual requirió de un Salvador: ¡su propio hijo! Ella dijo:</p>
<blockquote class="scripture">“Engrandece mi alma al Señor; y mi espíritu se regocija en Dios mi Salvador”.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 3">³<span class="footnote-popup">Lucas 1:46-47</span></span></sup></blockquote>
<p>Jesús es el Cristo,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 4">⁴<span class="footnote-popup">Mateo 16:16</span></span></sup> y Cristo es Dios sobre todas las cosas.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 5">⁵<span class="footnote-popup">Romanos 9:5</span></span></sup></p>
<p>En las bodas de Caná, María dijo con respecto a su hijo:</p>
<blockquote class="scripture">“Haced todo lo que él os dijere”.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 6">⁶<span class="footnote-popup">Juan 2:5</span></span></sup></blockquote>
<p>Hay millones en el mundo que no conocen esta simple verdad, y hay aún sacerdotes católicos que sirven a un dios muerto, colgado en una cruz.</p>
<p>En realidad, no desconozco que haya personas en la religión tradicional que intenten ofrecer ayuda a muchos que sufren, pero su doctrina errónea no les deja ver más allá de lo que ven sus ojos y siguen percibiendo a Jesús en una cruz.</p>
<p>Si usted quiere conocer la verdad, deberá leer la Biblia para conocer más a Jesús, su vida y lo que hizo por nosotros.</p>
<p>Debemos orar por nuestros gobernantes y anunciarles el evangelio, no solo porque es nuestro deber, sino porque, si no lo hacemos, no tendremos país.</p>
<p>“El que ignorantemente peca, ignorantemente se condena” es un adagio popular. De nuevo: Si alguien no anda conforme a la Biblia y tiene buenas intenciones de hacer el bien, se le debe hablar con respeto para que corrija su caminar.</p>
<blockquote class="scripture">La buena noticia es que Jesús no está en un madero, pues después de morir por nuestros pecados, resucitó al tercer día de entre los muertos, ascendió al cielo y está sentado a la diestra del Padre.</blockquote>
<p>Dios es celoso y no admite ser compartido.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 7">⁷<span class="footnote-popup">Éxodo 20:5</span></span></sup> Si por un lado alguien va a hablar de Jesucristo y por otro va a incensar a María o a espíritus de fallecidos,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 8">⁸<span class="footnote-popup">Deuteronomio 18:10-12</span></span></sup>, siendo un craso error, la cosa no le va a funcionar.</p>
<p>Si quiere ir a la fija, considere al Padre, al Hijo y al Espíritu Santo. Todo con la Deidad, sin ella, nada.</p>`
},

en: {
title:"He Is Aware — Part 1 — The Word in Capsules",
author:"By J.V.",
heading:"He Is Aware",
part:"Part 1",
nav:["Continue to Part 2 →","← Back to Articles"],
article:`
<p>Friends, no one is exempt from suffering something as terrible as an earthquake or an anguishing situation. But there is one thing I am sure of: God is merciful<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 1">¹<span class="footnote-popup">Ephesians 2:4-5</span></span></sup>, and therefore we can ask for His protection.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 2">²<span class="footnote-popup">Psalm 18:2</span></span></sup> For some time now, in addition to my regular prayers, I have included an extra <strong>reinforcement</strong>: asking the Most High to protect us from every kind of harm.</p>
<div class="cascade"><div>• Calamity, accident, kidnapping, tsunami, hurricane, or earthquake.</div><div>• Accidents, robberies, and extortion.</div><div>• Cruel and painful illnesses.</div><div>• And, as the model prayer says, that He deliver us from all evil.</div></div>
<p>As I wrote above, I have included these things in my prayers. We should lift our request to the one Holy Father in heaven, in the name of Jesus, and give thanks at the end, believing that He has already done it. Worship the Lord at that very moment with thanksgiving, for this pleases Him.</p>
<p>The Christian church around the world does not entrust its own country to idols, statues, or anything that displeases God. Those who do so have not been born again, and we should share God’s counsel with them so they can go through the process of conversion. Some have turned to idols out of ignorance, not conviction; that is why believers should share the gospel with those who are seeking.</p>
<p>Jeremiah 7 and 44 are two forceful chapters in which the Lord warns about the dangers of worshiping the <em>queen of heaven</em>. In ancient times, according to Greek mythology, that deity was called Artemis; later, Diana in Asia Minor—today’s Turkey.</p>
<p>Later, the popes in Rome, seeking a name for a female divinity resembling ancient pagan deities, chose the name of someone who had existed and said: “Mary.”</p>
<p>She never wanted to be venerated. Religion was the one that did so.</p>
<p>Mary, the mother of Jesus, was a devout woman, but she too needed a Savior: her own son! She said:</p>
<blockquote class="scripture">“My soul magnifies the Lord, and my spirit rejoices in God my Savior.”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 3">³<span class="footnote-popup">Luke 1:46-47</span></span></sup></blockquote>
<p>Jesus is the Christ,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 4">⁴<span class="footnote-popup">Matthew 16:16</span></span></sup> and Christ is God over all.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 5">⁵<span class="footnote-popup">Romans 9:5</span></span></sup></p>
<p>At the wedding in Cana, Mary said about her son:</p>
<blockquote class="scripture">“Do whatever he tells you.”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 6">⁶<span class="footnote-popup">John 2:5</span></span></sup></blockquote>
<p>Millions around the world do not know this simple truth, and there are still Catholic priests who serve a dead god hanging on a cross.</p>
<p>Some people in traditional religion try to help those who suffer, but their mistaken doctrine does not let them see beyond what their eyes can see, and they continue to picture Jesus on a cross.</p>
<p>If you want to know the truth, read the Bible to learn more about Jesus, His life, and what He did for us.</p>
<p>We must pray for our leaders and proclaim the gospel to them, not only because it is our duty, but because if we do not, we will have no country.</p>
<p>“Those who sin in ignorance are condemned in ignorance” is a popular saying. If someone does not walk according to the Bible but has good intentions and wants to do good, we should speak respectfully so they can correct their path.</p>
<blockquote class="scripture">The good news is that Jesus is no longer on a wooden cross: after dying for our sins, He rose from the dead on the third day, ascended to heaven, and is seated at the Father’s right hand.</blockquote>
<p>God is jealous and does not allow Himself to be shared.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 7">⁷<span class="footnote-popup">Exodus 20:5</span></span></sup> If someone speaks about Jesus Christ on one hand and burns incense to Mary or to the spirits of the dead on the other,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Footnote 8">⁸<span class="footnote-popup">Deuteronomy 18:10-12</span></span></sup>—a serious error—it will not work.</p>
<p>If you want to be sure, consider the Father, the Son, and the Holy Spirit. Everything with the Godhead; without it, nothing.</p>`
},

zh: {
title:"祂无所不知 — 第一部分 — 胶囊中的话语",
author:"作者：J.V.",
heading:"祂无所不知",
part:"第一部分",
nav:["继续阅读第二部分 →","← 返回文章列表"],
article:`
<p>朋友们，没有人能够完全避免遭遇地震这样的可怕灾难，或经历令人痛苦的处境。但有一件事我深信不疑：上帝满有怜悯<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释1">¹<span class="footnote-popup">以弗所书 2:4-5</span></span></sup>，因此我们可以祈求祂的保护。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释2">²<span class="footnote-popup">诗篇 18:2</span></span></sup> 一段时间以来，除了平常的祷告，我还加入了一项<strong>额外的祈求</strong>：求至高的上帝保护我们，远离一切不好的事。</p>
<div class="cascade"><div>• 灾难、事故、绑架、海啸、飓风或地震。</div><div>• 意外事故、抢劫和敲诈勒索。</div><div>• 残酷而痛苦的疾病。</div><div>• 还有，正如主祷文所说，求祂救我们脱离一切凶恶。</div></div>
<p>正如我前面所写的，我已经把这些事项加入自己的祷告中。我们应当奉耶稣的名，向那位在天上的圣父祈求，并在祷告结束时献上感谢，相信祂已经成就了我们所求的。就在那一刻，以感恩敬拜主，因为这是祂所喜悦的。</p>
<p>世界各地的基督教会不应把自己的国家托付给偶像、雕像，或任何令上帝不喜悦的事物。这样做的人尚未真正重生；我们应当把上帝的教导分享给他们，使他们经历悔改归信。有些人转向偶像是因为无知，而不是出于坚定的信念。因此，信徒应当向那些正在寻求真理的人传扬福音。</p>
<p>《耶利米书》第7章和第44章警告人们敬拜<strong>天后</strong>的危险。根据希腊神话，古代人称这位神祇为阿耳忒弥斯；后来，在小亚细亚，也就是今天的土耳其，人们称她为狄安娜。</p>
<p>后来，罗马的教皇们想为一位女性神祇取一个与古代异教神祇相似的名字，于是选择了一个真实存在过的人的名字，并称她为“玛利亚”。</p>
<p>她从未要求人们敬拜她。是宗教让人这样做的。</p>
<p>耶稣的母亲玛利亚是一位敬虔的妇女，但她同样需要一位救主——她自己的儿子！她曾说：</p>
<blockquote class="scripture">“我心尊主为大；我灵以神我的救主为乐。”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释3">³<span class="footnote-popup">路加福音 1:46-47</span></span></sup></blockquote>
<p>耶稣就是基督，<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释4">⁴<span class="footnote-popup">马太福音 16:16</span></span></sup> 而基督是超乎万有的上帝。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释5">⁵<span class="footnote-popup">罗马书 9:5</span></span></sup></p>
<p>在迦拿的婚宴上，玛利亚谈到她的儿子时说：</p>
<blockquote class="scripture">“他告诉你们什么，你们就做什么。”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释6">⁶<span class="footnote-popup">约翰福音 2:5</span></span></sup></blockquote>
<p>世界上有数以百万计的人不明白这个简单的真理，甚至仍有天主教神父事奉一个被钉在十字架上的死去的神。</p>
<p>传统宗教中有些人试图帮助正在受苦的人。然而，他们错误的教义使他们无法看见眼前所见之外的真相，因此仍然把耶稣看作在十字架上。</p>
<p>如果你想认识真理，就应当阅读圣经，更深入地认识耶稣、祂的一生，以及祂为我们所做的一切。</p>
<p>我们应当为执政者祷告，并向他们宣讲福音。这不仅是我们的责任；如果我们不这样做，我们的国家也将失去应有的根基。</p>
<p>“无知犯罪的人，也因无知而受定罪”是一句民间俗语。如果有人没有按照圣经的教导生活，但怀着善意、真心想行善，我们就应当尊重地与他交谈，帮助他纠正自己的道路。</p>
<blockquote class="scripture">好消息是，耶稣如今不再在木头十字架上。祂为我们的罪死后，第三天从死里复活，升上天，并坐在天父的右边。</blockquote>
<p>上帝是忌邪的，不允许人把祂与其他对象并列敬拜。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释7">⁷<span class="footnote-popup">出埃及记 20:5</span></span></sup> 如果有人一方面谈论耶稣基督，另一方面却向玛利亚或死者的灵焚香，<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="注释8">⁸<span class="footnote-popup">申命记 18:10-12</span></span></sup>，这就是严重的错误，最终不会带来好的结果。</p>
<p>如果你想作出明确的选择，就当仰望圣父、圣子和圣灵。凡事都当归于上帝；离开祂，一切便失去了根基。</p>`
},

fr: {
title:"Il est au courant — Partie 1 — La Parole en Capsules",
author:"Par J.V.",
heading:"Il est au courant",
part:"Partie 1",
nav:["Continuer vers la partie 2 →","← Retour aux articles"],
article:`
<p>Amis, personne n’est à l’abri d’une épreuve aussi terrible qu’un tremblement de terre ou d’une situation angoissante. Mais je suis sûr d’une chose : Dieu est miséricordieux<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 1">¹<span class="footnote-popup">Éphésiens 2:4-5</span></span></sup> et nous pouvons donc demander sa protection.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 2">²<span class="footnote-popup">Psaume 18:2</span></span></sup> Depuis quelque temps, en plus de mes prières habituelles, j’y ai ajouté un <strong>renforcement</strong> : demander au Très-Haut de nous protéger de toute chose négative.</p>
<div class="cascade"><div>• Catastrophe, accident, enlèvement, tsunami, ouragan ou tremblement de terre.</div><div>• Accidents, vols et extorsions.</div><div>• Maladies cruelles et douloureuses.</div><div>• Et, comme le dit la prière modèle, qu’il nous délivre de tout mal.</div></div>
<p>J’ai inclus ces éléments dans mes prières. Nous devons adresser notre demande au seul Saint Père qui est au ciel, au nom de Jésus, puis rendre grâce en croyant qu’il l’a déjà exaucée. Adorez le Seigneur à cet instant avec des actions de grâce, car cela lui plaît.</p>
<p>L’Église chrétienne ne confie pas son pays à des idoles, à des statues ou à ce qui déplaît à Dieu. Ceux qui le font ne sont pas nés de nouveau ; nous devons leur transmettre le conseil de Dieu afin qu’ils suivent un chemin de conversion. Certaines personnes se sont tournées vers les idoles par ignorance, et non par conviction. C’est pourquoi les croyants doivent annoncer l’Évangile à ceux qui cherchent.</p>
<p>Jérémie 7 et 44 mettent en garde contre les dangers du culte de la <em>reine du ciel</em>. Dans l’Antiquité, cette divinité était appelée Artémis selon la mythologie grecque, puis Diane en Asie Mineure — l’actuelle Turquie.</p>
<p>Plus tard, les papes de Rome, cherchant un nom pour une divinité féminine rappelant les anciennes divinités païennes, ont choisi le nom d’une personne qui avait réellement existé : « Marie ».</p>
<p>Elle n’a jamais voulu être vénérée. C’est la religion qui l’a fait.</p>
<p>Marie, la mère de Jésus, était une femme pieuse, mais elle avait elle aussi besoin d’un Sauveur : son propre fils ! Elle a dit :</p>
<blockquote class="scripture">« Mon âme exalte le Seigneur, et mon esprit se réjouit en Dieu, mon Sauveur. »<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 3">³<span class="footnote-popup">Luc 1:46-47</span></span></sup></blockquote>
<p>Jésus est le Christ,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 4">⁴<span class="footnote-popup">Matthieu 16:16</span></span></sup> et le Christ est Dieu au-dessus de toutes choses.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 5">⁵<span class="footnote-popup">Romains 9:5</span></span></sup></p>
<p>Lors des noces de Cana, Marie a dit au sujet de son fils :</p>
<blockquote class="scripture">« Faites tout ce qu’il vous dira. »<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 6">⁶<span class="footnote-popup">Jean 2:5</span></span></sup></blockquote>
<p>Des millions de personnes ne connaissent pas cette vérité simple, et il existe encore des prêtres catholiques qui servent un dieu mort, suspendu à une croix.</p>
<p>Certaines personnes de la religion traditionnelle essaient d’aider ceux qui souffrent, mais leur doctrine erronée les empêche de voir au-delà de ce que leurs yeux perçoivent ; elles continuent à représenter Jésus sur une croix.</p>
<p>Si vous voulez connaître la vérité, lisez la Bible pour mieux connaître Jésus, sa vie et ce qu’il a fait pour nous.</p>
<p>Nous devons prier pour nos dirigeants et leur annoncer l’Évangile, non seulement parce que c’est notre devoir, mais aussi parce que, si nous ne le faisons pas, nous n’aurons plus de pays.</p>
<p>« Celui qui pèche par ignorance est condamné par ignorance » est un dicton populaire. Si quelqu’un ne marche pas selon la Bible mais a de bonnes intentions, il faut lui parler avec respect afin qu’il corrige sa conduite.</p>
<blockquote class="scripture">La bonne nouvelle, c’est que Jésus n’est plus sur un bois : après être mort pour nos péchés, il est ressuscité des morts le troisième jour, il est monté au ciel et siège à la droite du Père.</blockquote>
<p>Dieu est jaloux et n’accepte pas d’être partagé.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 7">⁷<span class="footnote-popup">Exode 20:5</span></span></sup> Si quelqu’un parle de Jésus-Christ et brûle de l’encens à Marie ou aux esprits des défunts,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Note 8">⁸<span class="footnote-popup">Deutéronome 18:10-12</span></span></sup> — ce qui est une grave erreur — cela ne fonctionnera pas.</p>
<p>Si vous voulez être sûr de votre choix, considérez le Père, le Fils et le Saint-Esprit. Tout avec la Divinité, sans elle, rien.</p>`
},

it: {
title:"Lui sa tutto — Parte 1 — La Parola in Capsule",
author:"Di J.V.",
heading:"Lui sa tutto",
part:"Parte 1",
nav:["Continua con la Parte 2 →","← Torna agli articoli"],
article:`
<p>Amici, nessuno è esente dal vivere qualcosa di terribile come un terremoto o una situazione angosciante. Ma di una cosa sono sicuro: Dio è misericordioso<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 1">¹<span class="footnote-popup">Efesini 2:4-5</span></span></sup> e possiamo quindi chiedere la sua protezione.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 2">²<span class="footnote-popup">Salmo 18:2</span></span></sup> Da qualche tempo, oltre alle mie preghiere abituali, ho aggiunto un <strong>rinforzo</strong>: chiedere all’Altissimo di proteggerci da ogni cosa negativa.</p>
<div class="cascade"><div>• Calamità, incidente, rapimento, tsunami, uragano o terremoto.</div><div>• Incidenti, rapine ed estorsioni.</div><div>• Malattie crudeli e dolorose.</div><div>• E, come dice la preghiera modello, che ci liberi da ogni male.</div></div>
<p>Come ho scritto sopra, ho incluso questi elementi nelle mie preghiere. Dobbiamo rivolgere la nostra richiesta all’unico Santo Padre che è nei cieli, nel nome di Gesù, e infine ringraziare, credendo che Egli abbia già agito. Adorate il Signore in quel momento con gratitudine, perché questo gli è gradito.</p>
<p>La Chiesa cristiana nel mondo non affida il proprio paese agli idoli, alle statue o a ciò che dispiace a Dio. Chi lo fa non è nato di nuovo; dobbiamo condividere con lui l’insegnamento di Dio, affinché possa intraprendere il cammino della conversione. Alcuni si sono rivolti agli idoli per ignoranza, non per convinzione: per questo i credenti devono annunciare il Vangelo a chi è in ricerca.</p>
<p>Geremia 7 e 44 sono capitoli della Bibbia molto chiari: il Signore avverte dei pericoli del culto della <em>regina del cielo</em>. Secondo la mitologia greca, nell’antichità questa divinità era chiamata Artemide e in seguito Diana in Asia Minore, l’attuale Turchia.</p>
<p>In seguito, i papi a Roma, cercando un nome per una divinità femminile simile alle antiche divinità pagane, scelsero il nome di una persona realmente esistita: «Maria».</p>
<p>Lei non ha mai voluto essere venerata. È stata la religione a farlo.</p>
<p>Maria, la madre di Gesù, era una donna devota, ma aveva anche lei bisogno di un Salvatore: suo figlio! Disse:</p>
<blockquote class="scripture">«L’anima mia magnifica il Signore, e lo spirito mio esulta in Dio, mio Salvatore».<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 3">³<span class="footnote-popup">Luca 1:46-47</span></span></sup></blockquote>
<p>Gesù è il Cristo,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 4">⁴<span class="footnote-popup">Matteo 16:16</span></span></sup> e Cristo è Dio sopra ogni cosa.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 5">⁵<span class="footnote-popup">Romani 9:5</span></span></sup></p>
<p>Alle nozze di Cana, Maria disse riguardo a suo figlio:</p>
<blockquote class="scripture">«Fate tutto quello che vi dirà».<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 6">⁶<span class="footnote-popup">Giovanni 2:5</span></span></sup></blockquote>
<p>Milioni di persone nel mondo non conoscono questa semplice verità, e ci sono ancora sacerdoti cattolici che servono un dio morto, appeso a una croce.</p>
<p>Alcune persone della religione tradizionale cercano di aiutare chi soffre, ma la loro dottrina errata impedisce loro di vedere oltre ciò che appare ai loro occhi, e continuano a immaginare Gesù sulla croce.</p>
<p>Se vuoi conoscere la verità, leggi la Bibbia per conoscere meglio Gesù, la sua vita e ciò che ha fatto per noi.</p>
<p>Dobbiamo pregare per i nostri governanti e annunciare loro il Vangelo, non solo perché è nostro dovere, ma anche perché, se non lo facciamo, non avremo un paese.</p>
<p>«Chi pecca per ignoranza, per ignoranza viene condannato» è un detto popolare. Se qualcuno non vive secondo la Bibbia ma ha buone intenzioni e desidera fare del bene, dobbiamo parlargli con rispetto affinché corregga il suo cammino.</p>
<blockquote class="scripture">La buona notizia è che Gesù non è più su un legno: dopo essere morto per i nostri peccati, è risorto dai morti il terzo giorno, è salito al cielo e siede alla destra del Padre.</blockquote>
<p>Dio è geloso e non accetta di essere condiviso.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 7">⁷<span class="footnote-popup">Esodo 20:5</span></span></sup> Se qualcuno parla di Gesù Cristo ma poi offre incenso a Maria o agli spiriti dei defunti,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 8">⁸<span class="footnote-popup">Deuteronomio 18:10-12</span></span></sup>, commette un grave errore che non porterà a nulla di buono.</p>
<p>Se vuoi fare la scelta giusta, considera il Padre, il Figlio e lo Spirito Santo. Tutto con la Divinità; senza di essa, niente.</p>`
},

pt: {
title:"Ele está ciente — Parte 1 — A Palavra em Cápsulas",
author:"Por J.V.",
heading:"Ele está ciente",
part:"Parte 1",
nav:["Continuar para a Parte 2 →","← Voltar aos artigos"],
article:`
<p>Amigos, ninguém está livre de sofrer algo tão terrível como um terremoto ou uma situação angustiante. Mas de uma coisa tenho certeza: Deus é misericordioso<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 1">¹<span class="footnote-popup">Efésios 2:4-5</span></span></sup> e, portanto, podemos pedir sua proteção.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 2">²<span class="footnote-popup">Salmos 18:2</span></span></sup> Há algum tempo, além das minhas orações habituais, acrescentei um <strong>reforço</strong>: pedir ao Altíssimo que nos proteja de todo mal.</p>
<div class="cascade"><div>• Calamidade, acidente, sequestro, tsunami, furacão ou terremoto.</div><div>• Acidentes, assaltos e extorsões.</div><div>• Doenças cruéis e dolorosas.</div><div>• E, como diz a oração-modelo, que nos livre de todo mal.</div></div>
<p>Como escrevi acima, incluí esses elementos nas minhas orações. Devemos apresentar nosso pedido ao único Santo Pai que está nos céus, em nome de Jesus, e agradecer ao final, crendo que Ele já o realizou. Adore o Senhor naquele mesmo instante com ações de graças, pois isso lhe agrada.</p>
<p>A igreja cristã no mundo não entrega seu próprio país a ídolos, estátuas ou a qualquer coisa que desagrade a Deus. Quem faz isso ainda não nasceu de novo; devemos compartilhar o conselho de Deus para que essa pessoa passe pelo processo de conversão. Algumas pessoas recorreram aos ídolos por ignorância, não por convicção; por isso, os cristãos devem anunciar o evangelho aos que estão buscando.</p>
<p>Jeremias 7 e 44 são capítulos contundentes da Bíblia, nos quais o Senhor adverte sobre os perigos de adorar a <em>rainha dos céus</em>. Segundo a mitologia grega, antigamente essa divindade era chamada Ártemis e, depois, Diana na Ásia Menor, hoje Turquia.</p>
<p>Mais tarde, os papas em Roma, procurando um nome para uma divindade feminina semelhante às antigas divindades pagãs, escolheram o nome de alguém que realmente existiu: “Maria”.</p>
<p>Ela nunca quis ser venerada. Foi a religião que fez isso.</p>
<p>Maria, mãe de Jesus, era uma mulher piedosa, mas também precisava de um Salvador: seu próprio filho! Ela disse:</p>
<blockquote class="scripture">“A minha alma engrandece ao Senhor, e o meu espírito se alegra em Deus, meu Salvador.”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 3">³<span class="footnote-popup">Lucas 1:46-47</span></span></sup></blockquote>
<p>Jesus é o Cristo,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 4">⁴<span class="footnote-popup">Mateus 16:16</span></span></sup> e Cristo é Deus sobre todas as coisas.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 5">⁵<span class="footnote-popup">Romanos 9:5</span></span></sup></p>
<p>Nas bodas de Caná, Maria disse a respeito de seu filho:</p>
<blockquote class="scripture">“Fazei tudo quanto ele vos disser.”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 6">⁶<span class="footnote-popup">João 2:5</span></span></sup></blockquote>
<p>Milhões de pessoas no mundo não conhecem essa verdade simples, e ainda há sacerdotes católicos que servem a um deus morto, pendurado numa cruz.</p>
<p>Algumas pessoas da religião tradicional tentam ajudar quem sofre, mas sua doutrina equivocada não lhes permite enxergar além do que os olhos veem, e continuam imaginando Jesus numa cruz.</p>
<p>Se você quer conhecer a verdade, leia a Bíblia para conhecer melhor Jesus, sua vida e o que Ele fez por nós.</p>
<p>Devemos orar por nossos governantes e anunciar-lhes o evangelho, não apenas porque é nosso dever, mas também porque, se não o fizermos, não teremos país.</p>
<p>“Quem peca por ignorância, por ignorância é condenado” é um ditado popular. Se alguém não vive conforme a Bíblia, mas tem boas intenções e deseja fazer o bem, devemos falar com respeito para que corrija seu caminho.</p>
<blockquote class="scripture">A boa notícia é que Jesus não está mais num madeiro: depois de morrer por nossos pecados, ressuscitou dos mortos ao terceiro dia, subiu ao céu e está sentado à direita do Pai.</blockquote>
<p>Deus é zeloso e não admite ser compartilhado.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 7">⁷<span class="footnote-popup">Êxodo 20:5</span></span></sup> Se alguém fala de Jesus Cristo, mas por outro lado queima incenso para Maria ou para espíritos de falecidos,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Nota 8">⁸<span class="footnote-popup">Deuteronômio 18:10-12</span></span></sup>, comete um grave erro que não dará bom resultado.</p>
<p>Se quiser ter certeza de sua escolha, considere o Pai, o Filho e o Espírito Santo. Tudo com a Divindade; sem ela, nada.</p>`
},

he: {
title:"הוא יודע — חלק ראשון — המילה בכמוסות",
author:"מאת J.V.",
heading:"הוא יודע",
part:"חלק ראשון",
nav:["המשך לחלק השני ←","← חזרה למאמרים"],
article:`
<p>חברים, איש אינו חסין מפני אסון נורא כמו רעידת אדמה או מפני מצב מעורר מצוקה. אבל בדבר אחד אני בטוח: אלוהים רחום<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 1">¹<span class="footnote-popup">האיגרת אל האפסים 2:4-5</span></span></sup>, ולכן אנו יכולים לבקש את הגנתו.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 2">²<span class="footnote-popup">תהילים 18:2</span></span></sup> מזה זמן מה, נוסף על תפילותיי הרגילות, הוספתי <strong>חיזוק</strong>: לבקש מהעליון להגן עלינו מכל דבר רע.</p>
<div class="cascade"><div>• אסון, תאונה, חטיפה, צונאמי, הוריקן או רעידת אדמה.</div><div>• תאונות, מעשי שוד וסחיטה.</div><div>• מחלות אכזריות וכואבות.</div><div>• וכפי שנאמר בתפילה לדוגמה, שיציל אותנו מכל רע.</div></div>
<p>כפי שכתבתי למעלה, שילבתי את הדברים האלה בתפילותיי. עלינו להפנות את בקשתנו אל האב הקדוש היחיד שבשמים, בשם ישוע, ולהודות בסוף מתוך אמונה שהוא כבר פעל. עבדו את האדון באותו רגע בהודיה, כי הדבר רצוי בעיניו.</p>
<p>הקהילה הנוצרית בעולם אינה מפקידה את ארצה בידי אלילים, פסלים או דברים המכעיסים את אלוהים. מי שעושה זאת עדיין לא נולד מחדש; עלינו לשתף אותו בעצת אלוהים כדי שיוכל לעבור תהליך של חזרה בתשובה. יש אנשים שפנו לאלילים מתוך בורות ולא מתוך אמונה שלמה, ולכן על המאמינים לבשר את הבשורה למבקשי האמת.</p>
<p>ירמיהו פרקים ז׳ ומ״ד מזהירים מפני הסכנות שבעבודת <em>מלכת השמים</em>. לפי המיתולוגיה היוונית, בעת העתיקה נקראה האלה ארטמיס, ובהמשך דיאנה באסיה הקטנה, בטורקיה של ימינו.</p>
<p>מאוחר יותר, האפיפיורים ברומא חיפשו שם לאלוהות נשית שתזכיר את האלוהויות הפגאניות הקדומות, ובחרו בשם של אישה שהתקיימה במציאות: „מרים”.</p>
<p>היא מעולם לא ביקשה שיסגדו לה. הדת היא שעשתה זאת.</p>
<p>מרים, אמו של ישוע, הייתה אישה יראת אלוהים, אך גם היא נזקקה למושיע: לבנה שלה! היא אמרה:</p>
<blockquote class="scripture">„תגדל נפשי את האדון ותגל רוחי באלוהים מושיעי.”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 3">³<span class="footnote-popup">לוקס 1:46-47</span></span></sup></blockquote>
<p>ישוע הוא המשיח,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 4">⁴<span class="footnote-popup">מתי 16:16</span></span></sup> והמשיח הוא אלוהים על הכול.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 5">⁵<span class="footnote-popup">רומים 9:5</span></span></sup></p>
<p>בחתונה בקנה אמרה מרים על בנה:</p>
<blockquote class="scripture">„כל אשר יאמר לכם עשו.”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 6">⁶<span class="footnote-popup">יוחנן 2:5</span></span></sup></blockquote>
<p>מיליונים בעולם אינם מכירים את האמת הפשוטה הזאת, ועדיין יש כמרים קתולים המשרתים אל מת התלוי על צלב.</p>
<p>יש אנשים בדת המסורתית המנסים לעזור לסובלים, אך תורתם השגויה מונעת מהם לראות מעבר למה שעיניהם רואות, והם ממשיכים לדמיין את ישוע על הצלב.</p>
<p>אם ברצונך לדעת את האמת, קרא את כתבי הקודש כדי להכיר טוב יותר את ישוע, את חייו ואת מה שעשה למעננו.</p>
<p>עלינו להתפלל בעד מנהיגינו ולהכריז בפניהם את הבשורה, לא רק מפני שזו חובתנו, אלא גם מפני שאם לא נעשה זאת, לא יהיה לנו עתיד לאומי.</p>
<p>„החוטא מתוך בורות נידון מתוך בורות” הוא פתגם עממי. אם אדם אינו חי לפי כתבי הקודש אך כוונותיו טובות והוא רוצה לעשות טוב, עלינו לדבר אליו בכבוד כדי שיוכל לתקן את דרכו.</p>
<blockquote class="scripture">הבשורה הטובה היא שישוע אינו עוד תלוי על עץ. לאחר שמת בעד חטאינו, הוא קם מן המתים ביום השלישי, עלה השמימה ויושב לימין האב.</blockquote>
<p>אלוהים הוא אל קנא ואינו מסכים לחלוק את כבודו עם אחרים.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 7">⁷<span class="footnote-popup">שמות 20:5</span></span></sup> אם אדם מדבר על ישוע המשיח ובו בזמן מקטיר קטורת למרים או לרוחות המתים,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="הערת שוליים 8">⁸<span class="footnote-popup">דברים 18:10-12</span></span></sup>, זו טעות חמורה שלא תביא לתוצאה טובה.</p>
<p>אם ברצונך לבחור בדרך הנכונה, פנה אל האב, הבן ורוח הקודש. הכול עם האלוהות; בלעדיה אין דבר.</p>`
},

ar: {
title:"إنه يعلم — الجزء الأول — الكلمة في كبسولات",
author:"بقلم J.V.",
heading:"إنه يعلم",
part:"الجزء الأول",
nav:["تابع إلى الجزء الثاني ←","← العودة إلى المقالات"],
article:`
<p>أصدقائي، لا أحد بمنأى عن التعرض لشيء فظيع كالزلزال أو لموقف يسبب الضيق. لكنني متأكد من أمر واحد: الله رحيم<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 1">¹<span class="footnote-popup">أفسس 2:4-5</span></span></sup>، ولذلك يمكننا أن نطلب حمايته.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 2">²<span class="footnote-popup">مزمور 18:2</span></span></sup> ومنذ فترة، أضفت إلى صلواتي المعتادة <strong>تعزيزًا</strong>: أن أطلب من العليّ أن يحمينا من كل شر.</p>
<div class="cascade"><div>• الكوارث والحوادث والاختطاف والتسونامي والأعاصير والزلازل.</div><div>• الحوادث والسرقات والابتزاز.</div><div>• الأمراض القاسية والمؤلمة.</div><div>• وكما تقول الصلاة النموذجية، أن ينقذنا من كل شر.</div></div>
<p>كما كتبت أعلاه، أدرجت هذه الأمور في صلواتي. علينا أن نرفع طلبنا إلى الآب القدوس الوحيد الذي في السماء، باسم يسوع، وأن نشكر في النهاية مؤمنين بأنه قد فعل ذلك بالفعل. اعبدوا الرب في تلك اللحظة بالشكر، لأن هذا يرضيه.</p>
<p>لا تسلّم الكنيسة المسيحية في العالم بلادها للأصنام أو التماثيل أو لأي شيء لا يرضي الله. ومن يفعل ذلك لم يولد من جديد؛ وعلينا أن نشاركه مشورة الله لكي يسير في طريق التوبة. بعض الناس لجؤوا إلى الأصنام بسبب الجهل لا الاقتناع، ولهذا ينبغي للمؤمنين أن يعلنوا الإنجيل للباحثين عن الحق.</p>
<p>يحذّر الإصحاحان السابع والرابع والأربعون من سفر إرميا من مخاطر عبادة <em>ملكة السماء</em>. ووفقًا للأساطير اليونانية، كان اسم هذه الإلهة في العصور القديمة أرتميس، ثم ديانا في آسيا الصغرى، أي تركيا اليوم.</p>
<p>وفي وقت لاحق، بحث باباوات روما عن اسم لإلهة أنثى يشبه أسماء الآلهة الوثنية القديمة، فاختاروا اسم امرأة وُجدت بالفعل وقالوا: «مريم».</p>
<p>لم تطلب مريم قط أن تُعبد أو تُكرّم بهذه الطريقة؛ بل فعل الدين ذلك.</p>
<p>كانت مريم، أم يسوع، امرأة تقية، لكنها احتاجت هي أيضًا إلى مخلّص: ابنها نفسه! قالت:</p>
<blockquote class="scripture">«تعظّم نفسي الرب، وتبتهج روحي بالله مخلّصي».<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 3">³<span class="footnote-popup">لوقا 1:46-47</span></span></sup></blockquote>
<p>يسوع هو المسيح،<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 4">⁴<span class="footnote-popup">متى 16:16</span></span></sup> والمسيح هو الله فوق الجميع.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 5">⁵<span class="footnote-popup">رومية 9:5</span></span></sup></p>
<p>في عرس قانا، قالت مريم عن ابنها:</p>
<blockquote class="scripture">«مهما قال لكم فافعلوه».<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 6">⁶<span class="footnote-popup">يوحنا 2:5</span></span></sup></blockquote>
<p>هناك ملايين في العالم لا يعرفون هذه الحقيقة البسيطة، ولا يزال بعض الكهنة الكاثوليك يخدمون إلهًا ميتًا معلّقًا على صليب.</p>
<p>يحاول بعض أتباع الديانات التقليدية مساعدة المتألمين، لكن عقيدتهم الخاطئة تمنعهم من رؤية ما وراء ما تراه أعينهم، ويستمرون في تصور يسوع معلّقًا على الصليب.</p>
<p>إذا أردت معرفة الحق، فاقرأ الكتاب المقدس لتتعرف أكثر إلى يسوع وحياته وما فعله من أجلنا.</p>
<p>علينا أن نصلي من أجل حكامنا ونعلن لهم الإنجيل، ليس فقط لأن ذلك واجبنا، بل لأننا إن لم نفعل فلن يكون لنا وطن.</p>
<p>«من يخطئ عن جهل يُدان عن جهل» قول شائع. إذا كان شخص لا يسلك وفق الكتاب المقدس، لكنه حسن النية ويريد فعل الخير، فعلينا أن نتحدث إليه باحترام حتى يصحح طريقه.</p>
<blockquote class="scripture">الخبر السار هو أن يسوع لم يعد على خشبة الصليب؛ فبعد أن مات من أجل خطايانا، قام من بين الأموات في اليوم الثالث، وصعد إلى السماء وجلس عن يمين الآب.</blockquote>
<p>الله غيور ولا يقبل أن يُشاركه أحد في العبادة.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 7">⁷<span class="footnote-popup">الخروج 20:5</span></span></sup> فإذا تحدث شخص عن يسوع المسيح من جهة، وأحرق البخور لمريم أو لأرواح الموتى من جهة أخرى،<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="الحاشية 8">⁸<span class="footnote-popup">التثنية 18:10-12</span></span></sup> فذلك خطأ جسيم لن يؤدي إلى نتيجة صالحة.</p>
<p>إذا أردت أن تختار الطريق الصحيح، فتمسّك بالآب والابن والروح القدس. كل شيء مع الله، وبدونه لا شيء.</p>`
},

hi: {
title:"वह सब जानता है — भाग 1 — कैप्सूल में परमेश्वर का वचन",
author:"लेखक: J.V.",
heading:"वह सब जानता है",
part:"भाग 1",
nav:["भाग 2 जारी रखें →","← लेखों पर वापस जाएँ"],
article:`
<p>मित्रों, कोई भी व्यक्ति भूकंप जैसी भयानक घटना या किसी अत्यंत पीड़ादायक परिस्थिति से पूरी तरह सुरक्षित नहीं है। लेकिन मुझे एक बात का पूरा विश्वास है: परमेश्वर दयालु है<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 1">¹<span class="footnote-popup">इफिसियों 2:4-5</span></span></sup>, इसलिए हम उसकी सुरक्षा माँग सकते हैं।<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 2">²<span class="footnote-popup">भजन संहिता 18:2</span></span></sup> कुछ समय से, अपनी नियमित प्रार्थनाओं के साथ, मैंने एक अतिरिक्त <strong>प्रार्थना</strong> भी शामिल की है: परमप्रधान से विनती करना कि वह हमें हर प्रकार की बुराई से बचाए।</p>
<div class="cascade"><div>• विपत्ति, दुर्घटना, अपहरण, सुनामी, तूफ़ान या भूकंप।</div><div>• दुर्घटनाएँ, लूटपाट और जबरन वसूली।</div><div>• क्रूर और पीड़ादायक बीमारियाँ।</div><div>• और, जैसा कि आदर्श प्रार्थना में कहा गया है, वह हमें हर बुराई से बचाए।</div></div>
<p>जैसा कि मैंने ऊपर लिखा, मैंने इन बातों को अपनी प्रार्थनाओं में शामिल किया है। हमें यीशु के नाम में स्वर्ग में रहने वाले एकमात्र पवित्र पिता से विनती करनी चाहिए और अंत में धन्यवाद देना चाहिए, यह विश्वास करते हुए कि उसने हमारी प्रार्थना सुन ली है। उसी क्षण धन्यवाद के साथ प्रभु की आराधना करें, क्योंकि यह उसे प्रसन्न करता है।</p>
<p>दुनिया भर में मसीही कलीसिया अपने देश को मूर्तियों, प्रतिमाओं या ऐसी किसी भी वस्तु के भरोसे नहीं छोड़ती जो परमेश्वर को अप्रसन्न करती है। जो ऐसा करते हैं, उन्होंने नया जन्म नहीं पाया है। हमें उन्हें परमेश्वर की शिक्षा बतानी चाहिए, ताकि वे मन-फिराव और परिवर्तन की प्रक्रिया से गुजर सकें। कुछ लोग दृढ़ विश्वास के कारण नहीं, बल्कि अज्ञानता के कारण मूर्तियों की ओर मुड़े हैं। इसलिए विश्वासियों को सत्य खोजने वालों तक सुसमाचार पहुँचाना चाहिए।</p>
<p>यिर्मयाह अध्याय 7 और 44 में प्रभु <em>स्वर्ग की रानी</em> की उपासना के खतरों के बारे में स्पष्ट चेतावनी देता है। यूनानी पौराणिक कथाओं के अनुसार, प्राचीन समय में इस देवी को आर्टेमिस कहा जाता था और बाद में एशिया माइनर—आज के तुर्किये—में डायना कहा गया।</p>
<p>बाद में, रोम के पोपों ने प्राचीन मूर्तिपूजक देवियों से मिलती-जुलती एक स्त्री-देवता के लिए नाम चुनने की कोशिश की। उन्होंने किसी ऐसी स्त्री का नाम चुना जो वास्तव में जीवित रही थी, और कहा: “मरियम।”</p>
<p>मरियम ने कभी यह नहीं चाहा कि उसकी वंदना की जाए। यह धर्म था जिसने ऐसा किया।</p>
<p>यीशु की माता मरियम एक भक्त स्त्री थी, लेकिन उसे भी एक उद्धारकर्ता की आवश्यकता थी—अपने ही पुत्र की! उसने कहा:</p>
<blockquote class="scripture">“मेरा प्राण प्रभु की बड़ाई करता है, और मेरी आत्मा मेरे उद्धारकर्ता परमेश्वर से आनन्दित हुई।”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 3">³<span class="footnote-popup">लूका 1:46-47</span></span></sup></blockquote>
<p>यीशु ही मसीह है,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 4">⁴<span class="footnote-popup">मत्ती 16:16</span></span></sup> और मसीह सब वस्तुओं के ऊपर परमेश्वर है।<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 5">⁵<span class="footnote-popup">रोमियों 9:5</span></span></sup></p>
<p>काना के विवाह में मरियम ने अपने पुत्र के विषय में कहा:</p>
<blockquote class="scripture">“जो कुछ वह तुम से कहे, वही करना।”<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 6">⁶<span class="footnote-popup">यूहन्ना 2:5</span></span></sup></blockquote>
<p>दुनिया में लाखों लोग इस सरल सत्य को नहीं जानते। आज भी कुछ कैथोलिक पादरी ऐसे मृत देवता की सेवा करते हैं जिसे क्रूस पर लटकाया गया है।</p>
<p>पारंपरिक धर्मों में कुछ लोग पीड़ितों की सहायता करने की कोशिश करते हैं, लेकिन उनकी गलत शिक्षा उन्हें अपनी आँखों से दिखाई देने वाली बातों से आगे देखने नहीं देती। इसलिए वे यीशु को अब भी क्रूस पर ही देखते हैं।</p>
<p>यदि आप सत्य जानना चाहते हैं, तो बाइबल पढ़ें, ताकि आप यीशु, उसके जीवन और हमारे लिए किए गए उसके कार्यों को और अच्छी तरह जान सकें।</p>
<p>हमें अपने शासकों के लिए प्रार्थना करनी चाहिए और उन्हें सुसमाचार सुनाना चाहिए। यह केवल हमारा कर्तव्य नहीं है; यदि हम ऐसा नहीं करेंगे, तो हमारा देश भी अपना सही मार्ग खो देगा।</p>
<p>“जो अज्ञानता में पाप करता है, वह अज्ञानता के कारण दोषी ठहरता है” एक प्रचलित कहावत है। यदि कोई व्यक्ति बाइबल के अनुसार नहीं चलता, लेकिन उसकी नीयत अच्छी है और वह भलाई करना चाहता है, तो हमें उससे आदरपूर्वक बात करनी चाहिए, ताकि वह अपना मार्ग सुधार सके।</p>
<blockquote class="scripture">सुसमाचार यह है कि यीशु अब लकड़ी के क्रूस पर नहीं है। हमारे पापों के लिए मरने के बाद वह तीसरे दिन मृतकों में से जी उठा, स्वर्ग पर चढ़ गया और पिता के दाहिने हाथ बैठा है।</blockquote>
<p>परमेश्वर जलन रखने वाला परमेश्वर है और अपनी आराधना किसी के साथ बाँटना स्वीकार नहीं करता।<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 7">⁷<span class="footnote-popup">निर्गमन 20:5</span></span></sup> यदि कोई एक ओर यीशु मसीह के बारे में बात करता है और दूसरी ओर मरियम या मृतकों की आत्माओं के लिए धूप जलाता है,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="टिप्पणी 8">⁸<span class="footnote-popup">व्यवस्थाविवरण 18:10-12</span></span></sup>, तो यह गंभीर भूल है और इसका अच्छा परिणाम नहीं होगा।</p>
<p>यदि आप सही मार्ग चुनना चाहते हैं, तो पिता, पुत्र और पवित्र आत्मा पर विश्वास रखें। सब कुछ परमेश्वर के साथ; उसके बिना कुछ भी नहीं।</p>`
},

ru: {
title:"Он всё знает — Часть 1 — Слово в капсулах",
author:"Автор: J.V.",
heading:"Он всё знает",
part:"Часть 1",
nav:["Перейти к части 2 →","← Вернуться к статьям"],
article:`
<p>Друзья, никто не застрахован от такого страшного события, как землетрясение, или от мучительных обстоятельств. Но в одном я уверен: Бог милосерден<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 1">¹<span class="footnote-popup">Ефесянам 2:4-5</span></span></sup>, поэтому мы можем просить Его о защите.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 2">²<span class="footnote-popup">Псалом 17:3 (18:2)</span></span></sup> Уже некоторое время, помимо обычных молитв, я добавляю к ним ещё одну важную просьбу: прошу Всевышнего защитить нас от всякого зла.</p>
<div class="cascade"><div>• Бедствия, несчастные случаи, похищения, цунами, ураганы или землетрясения.</div><div>• Аварии, ограбления и вымогательство.</div><div>• Жестокие и мучительные болезни.</div><div>• И, как сказано в образцовой молитве, чтобы Он избавил нас от всякого зла.</div></div>
<p>Как я уже писал, я включил эти просьбы в свои молитвы. Мы должны обращаться с просьбой к единственному Святому Отцу на небесах во имя Иисуса, а в конце благодарить, веря, что Он уже ответил. В тот же момент поклоняйтесь Господу с благодарностью, потому что это Ему угодно.</p>
<p>Христианская церковь во всём мире не должна вверять свою страну идолам, статуям или чему-либо, что неугодно Богу. Те, кто так поступает, не родились свыше. Мы должны делиться с ними Божьим наставлением, чтобы они могли пройти путь обращения к Богу. Некоторые обращаются к идолам по незнанию, а не по убеждению. Поэтому верующим следует возвещать Евангелие тем, кто ищет истину.</p>
<p>В 7-й и 44-й главах книги пророка Иеремии Господь ясно предупреждает об опасности поклонения <em>царице небесной</em>. Согласно греческой мифологии, в древности эту богиню называли Артемидой, а позднее в Малой Азии — Дианой. Сегодня эта территория относится к Турции.</p>
<p>Позднее римские папы, желая подобрать для женского божества имя, напоминающее древних языческих богинь, выбрали имя реально существовавшей женщины и назвали её «Марией».</p>
<p>Она никогда не просила, чтобы ей поклонялись. Это сделала религия.</p>
<p>Мария, мать Иисуса, была благочестивой женщиной, но и ей был нужен Спаситель — её собственный сын! Она сказала:</p>
<blockquote class="scripture">«Величит душа Моя Господа, и возрадовался дух Мой о Боге, Спасителе Моём».<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 3">³<span class="footnote-popup">Луки 1:46-47</span></span></sup></blockquote>
<p>Иисус есть Христос,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 4">⁴<span class="footnote-popup">Матфея 16:16</span></span></sup> а Христос — Бог над всем.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 5">⁵<span class="footnote-popup">Римлянам 9:5</span></span></sup></p>
<p>На браке в Кане Галилейской Мария сказала о своём сыне:</p>
<blockquote class="scripture">«Что скажет Он вам, то сделайте».<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 6">⁶<span class="footnote-popup">Иоанна 2:5</span></span></sup></blockquote>
<p>Миллионы людей в мире не знают этой простой истины. И сегодня есть католические священники, которые служат мёртвому богу, висящему на кресте.</p>
<p>Некоторые представители традиционной религии стараются помогать страдающим, однако ошибочное учение не позволяет им видеть дальше того, что видят их глаза. Поэтому они продолжают представлять Иисуса на кресте.</p>
<p>Если вы хотите узнать истину, читайте Библию, чтобы лучше узнать Иисуса, Его жизнь и то, что Он сделал для нас.</p>
<p>Мы должны молиться за наших правителей и возвещать им Евангелие не только потому, что это наш долг, но и потому, что без этого наше общество может утратить верный путь.</p>
<p>«Кто грешит по неведению, тот и осуждается по неведению» — народная поговорка. Если человек поступает не по Библии, но имеет добрые намерения и хочет делать добро, нужно уважительно поговорить с ним, чтобы он исправил свой путь.</p>
<blockquote class="scripture">Добрая весть заключается в том, что Иисус больше не на деревянном кресте. Умерев за наши грехи, Он на третий день воскрес из мёртвых, вознёсся на небо и воссел одесную Отца.</blockquote>
<p>Бог ревнует и не допускает, чтобы поклонение Ему разделяли с кем-либо ещё.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 7">⁷<span class="footnote-popup">Исход 20:5</span></span></sup> Если человек говорит об Иисусе Христе, но одновременно воскуряет фимиам Марии или духам умерших,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Примечание 8">⁸<span class="footnote-popup">Второзаконие 18:10-12</span></span></sup>, это серьёзная ошибка, которая не приведёт к доброму результату.</p>
<p>Если вы хотите сделать правильный выбор, обратитесь к Отцу, Сыну и Святому Духу. Всё с Богом; без Него — ничто.</p>`
},

de: {
title:"Er weiß Bescheid — Teil 1 — Das Wort in Kapseln",
author:"Von J.V.",
heading:"Er weiß Bescheid",
part:"Teil 1",
nav:["Weiter zu Teil 2 →","← Zurück zu den Artikeln"],
article:`
<p>Freunde, niemand ist davor gefeit, etwas so Schreckliches wie ein Erdbeben oder eine belastende Situation zu erleben. Doch eines weiß ich gewiss: Gott ist barmherzig<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 1">¹<span class="footnote-popup">Epheser 2,4-5</span></span></sup>, deshalb können wir um seinen Schutz bitten.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 2">²<span class="footnote-popup">Psalm 18,3</span></span></sup> Seit einiger Zeit ergänze ich meine regelmäßigen Gebete um eine zusätzliche Bitte: Ich bitte den Allerhöchsten, uns vor allem Bösen zu bewahren.</p>
<div class="cascade"><div>• Katastrophen, Unfälle, Entführungen, Tsunamis, Wirbelstürme oder Erdbeben.</div><div>• Unfälle, Raubüberfälle und Erpressung.</div><div>• Grausame und schmerzhafte Krankheiten.</div><div>• Und, wie es im Mustergebet heißt, dass er uns von allem Bösen erlöst.</div></div>
<p>Wie ich oben geschrieben habe, habe ich diese Anliegen in meine Gebete aufgenommen. Wir sollen unsere Bitte im Namen Jesu an den einzigen heiligen Vater im Himmel richten und am Ende danken, im Glauben daran, dass er bereits gehandelt hat. Betet in diesem Augenblick mit Dankbarkeit den Herrn an, denn das gefällt ihm.</p>
<p>Die christliche Kirche weltweit vertraut ihr Land nicht Götzenbildern, Statuen oder Dingen an, die Gott missfallen. Wer das tut, ist nicht von Neuem geboren. Wir sollten diesen Menschen Gottes Rat weitergeben, damit sie den Weg der Umkehr gehen können. Manche wenden sich aus Unwissenheit und nicht aus Überzeugung Götzen zu. Deshalb sollten Gläubige den Menschen, die nach Wahrheit suchen, das Evangelium verkünden.</p>
<p>In Jeremia 7 und 44 warnt der Herr eindringlich vor den Gefahren der Verehrung der <em>Himmelskönigin</em>. Nach der griechischen Mythologie wurde diese Gottheit in der Antike Artemis genannt und später in Kleinasien — dem heutigen Gebiet der Türkei — Diana.</p>
<p>Später suchten die Päpste in Rom nach einem Namen für eine weibliche Gottheit, die den alten heidnischen Gottheiten ähneln sollte. Sie wählten den Namen einer Frau, die tatsächlich gelebt hatte, und nannten sie „Maria“.</p>
<p>Sie selbst wollte niemals verehrt werden. Die Religion hat diese Verehrung eingeführt.</p>
<p>Maria, die Mutter Jesu, war eine gottesfürchtige Frau, doch auch sie brauchte einen Retter: ihren eigenen Sohn! Sie sagte:</p>
<blockquote class="scripture">„Meine Seele erhebt den Herrn, und mein Geist freut sich Gottes, meines Heilandes.“<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 3">³<span class="footnote-popup">Lukas 1,46-47</span></span></sup></blockquote>
<p>Jesus ist der Christus,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 4">⁴<span class="footnote-popup">Matthäus 16,16</span></span></sup> und Christus ist Gott über alles.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 5">⁵<span class="footnote-popup">Römer 9,5</span></span></sup></p>
<p>Bei der Hochzeit zu Kana sagte Maria über ihren Sohn:</p>
<blockquote class="scripture">„Was er euch sagt, das tut.“<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 6">⁶<span class="footnote-popup">Johannes 2,5</span></span></sup></blockquote>
<p>Millionen Menschen auf der Welt kennen diese einfache Wahrheit nicht. Noch immer gibt es katholische Priester, die einem toten Gott dienen, der an einem Kreuz hängt.</p>
<p>Manche Menschen in traditionellen Religionen versuchen, Leidenden zu helfen. Doch ihre falsche Lehre hindert sie daran, über das hinauszusehen, was ihre Augen wahrnehmen. Deshalb stellen sie sich Jesus weiterhin am Kreuz vor.</p>
<p>Wenn Sie die Wahrheit kennenlernen möchten, lesen Sie die Bibel, um Jesus, sein Leben und das, was er für uns getan hat, besser kennenzulernen.</p>
<p>Wir sollen für unsere Regierenden beten und ihnen das Evangelium verkünden, nicht nur weil es unsere Pflicht ist, sondern auch weil unser Land ohne dieses Zeugnis seinen richtigen Weg verlieren kann.</p>
<p>„Wer unwissentlich sündigt, wird unwissentlich verurteilt“ ist ein bekanntes Sprichwort. Wenn jemand nicht nach der Bibel lebt, aber gute Absichten hat und Gutes tun möchte, sollten wir respektvoll mit ihm sprechen, damit er seinen Weg korrigieren kann.</p>
<blockquote class="scripture">Die gute Nachricht lautet: Jesus hängt nicht mehr an einem Holzkreuz. Nachdem er für unsere Sünden gestorben war, ist er am dritten Tag von den Toten auferstanden, in den Himmel aufgefahren und sitzt zur Rechten des Vaters.</blockquote>
<p>Gott ist ein eifersüchtiger Gott und duldet nicht, dass seine Anbetung mit anderen geteilt wird.<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 7">⁷<span class="footnote-popup">2. Mose 20,5</span></span></sup> Wenn jemand einerseits über Jesus Christus spricht und andererseits Maria oder den Geistern Verstorbener Weihrauch darbringt,<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="Fußnote 8">⁸<span class="footnote-popup">5. Mose 18,10-12</span></span></sup>, begeht er einen schwerwiegenden Fehler, der zu keinem guten Ergebnis führen wird.</p>
<p>Wenn Sie den richtigen Weg wählen möchten, richten Sie sich nach dem Vater, dem Sohn und dem Heiligen Geist. Alles mit Gott; ohne ihn nichts.</p>`
},

ja: {
title:"神はすべてをご存じです — 第1部 — カプセルに込められたみことば",
author:"著者：J.V.",
heading:"神はすべてをご存じです",
part:"第1部",
nav:["第2部へ続く →","← 記事一覧に戻る"],
article:`
<p>皆さん、地震のような恐ろしい災害や、心を苦しめる状況を経験せずに済むと保証されている人はいません。しかし、私が確信していることが一つあります。それは、神は憐れみ深いお方であるということです。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注1">¹<span class="footnote-popup">エペソ人への手紙 2:4-5</span></span></sup> ですから、私たちは神の守りを求めることができます。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注2">²<span class="footnote-popup">詩篇 18:2</span></span></sup> 私はしばらく前から、普段の祈りに加えて、もう一つの大切な願いを加えています。それは、いと高き神に、あらゆる悪から私たちを守ってくださるよう願うことです。</p>
<div class="cascade"><div>• 災害、事故、誘拐、津波、ハリケーン、または地震。</div><div>• 事故、強盗、恐喝。</div><div>• 苦しく、痛みを伴う病気。</div><div>• そして、主の祈りにあるように、あらゆる悪から救い出してくださること。</div></div>
<p>上に書いたように、私はこれらの願いを祈りに含めています。私たちはイエスの御名によって、天におられる唯一の聖なる父に願いをささげ、神がすでに応えてくださったと信じて、最後に感謝すべきです。その時に感謝をもって主を礼拝してください。それは主の喜ばれることだからです。</p>
<p>世界中のキリスト教会は、自分たちの国を偶像や像、また神に喜ばれないものに委ねるべきではありません。そのようなことをする人は、新しく生まれていないのです。私たちは彼らに神の教えを伝え、悔い改めと回心の道を歩めるよう助けるべきです。確信からではなく、無知から偶像に頼る人もいます。だからこそ、信者は真理を求めている人々に福音を伝えるべきです。</p>
<p>エレミヤ書7章と44章では、<em>天の女王</em>を礼拝する危険について、主がはっきりと警告されています。ギリシャ神話によれば、古代にはこの女神はアルテミスと呼ばれ、後に小アジア、現在のトルコにあたる地域ではディアナと呼ばれました。</p>
<p>その後、ローマの教皇たちは、古代の異教の女神に似た女性神格に名前を付けようとし、実在した女性の名を選んで「マリア」と呼びました。</p>
<p>マリア自身は、決して自分が崇拝されることを望みませんでした。それを行ったのは宗教です。</p>
<p>イエスの母マリアは敬虔な女性でしたが、彼女にも救い主が必要でした。それは自分の息子です。彼女はこう言いました。</p>
<blockquote class="scripture">「わがたましいは主をあがめ、わが霊は、わが救い主なる神を喜びたたえます。」<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注3">³<span class="footnote-popup">ルカの福音書 1:46-47</span></span></sup></blockquote>
<p>イエスはキリストです。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注4">⁴<span class="footnote-popup">マタイの福音書 16:16</span></span></sup> そしてキリストは、すべてのものの上におられる神です。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注5">⁵<span class="footnote-popup">ローマ人への手紙 9:5</span></span></sup></p>
<p>カナの婚礼で、マリアは息子についてこう言いました。</p>
<blockquote class="scripture">「あの方が言われることを、何でもしてあげてください。」<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注6">⁶<span class="footnote-popup">ヨハネの福音書 2:5</span></span></sup></blockquote>
<p>世界には、この単純な真理を知らない人が何百万人もいます。今でも、十字架にかけられた死んだ神に仕えているカトリックの司祭がいます。</p>
<p>伝統的な宗教に属する人々の中には、苦しんでいる人を助けようとする人もいます。しかし、誤った教えのために、目に見えるものの先にある真理を見ることができず、イエスを今も十字架上にいるお方として捉え続けています。</p>
<p>真理を知りたいなら、聖書を読んで、イエスとその生涯、そして私たちのためにしてくださったことを、さらに深く知ってください。</p>
<p>私たちは指導者たちのために祈り、彼らにも福音を伝えなければなりません。それは私たちの務めだからというだけでなく、そうしなければ国が正しい道を失いかねないからです。</p>
<p>「知らずに罪を犯す者も、知らずに裁かれる」というのは、よく知られたことわざです。聖書に従って歩んでいない人でも、善意を持ち、善いことをしようとしているなら、敬意をもって話し、その歩みを正せるよう助けるべきです。</p>
<blockquote class="scripture">良い知らせは、イエスはもう木の十字架にかかっておられないということです。私たちの罪のために死なれた後、三日目によみがえり、天に昇り、父の右に座しておられます。</blockquote>
<p>神はねたむ神であり、礼拝をほかのものと分け合うことを認められません。<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注7">⁷<span class="footnote-popup">出エジプト記 20:5</span></span></sup> もし、ある人が一方でイエス・キリストについて語りながら、他方でマリアや死者の霊に香をたくなら、<sup><span class="footnote-ref" role="button" tabindex="0" aria-label="脚注8">⁸<span class="footnote-popup">申命記 18:10-12</span></span></sup>それは重大な誤りであり、良い結果にはつながりません。</p>
<p>正しい道を選びたいなら、父と子と聖霊に目を向けてください。神とともにあるすべて。神なしには何もありません。</p>`
}
};

(function () {
  const article = document.querySelector(".article");
  const buttons = document.querySelectorAll("[data-lang]");
  const nextLink = document.getElementById("next-link");
  const backLink = document.getElementById("back-link");
  const languageSelector = document.querySelector(".language-selector");

  const siteNames = {
    es:"LA PALABRA EN CÁPSULAS",
    en:"THE WORD IN CAPSULES",
    zh:"胶囊中的话语",
    fr:"LA PAROLE EN CAPSULES",
    it:"LA PAROLA IN CAPSULE",
    pt:"A PALAVRA EM CÁPSULAS",
    he:"המילה בכמוסות",
    ar:"الكلمة في كبسولات",
    hi:"कैप्सूल में परमेश्वर का वचन",
    ru:"СЛОВО В КАПСУЛАХ",
    de:"DAS WORT IN KAPSELN",
    ja:"カプセルに込められたみことば"
  };

  const selectorLabels = {
    es:"Seleccionar idioma",
    en:"Select language",
    zh:"选择语言",
    fr:"Choisir la langue",
    it:"Seleziona la lingua",
    pt:"Selecionar idioma",
    he:"בחירת שפה",
    ar:"اختيار اللغة",
    hi:"भाषा चुनें",
    ru:"Выбрать язык",
    de:"Sprache auswählen",
    ja:"言語を選択"
  };

  function closeNotes() {
    article.querySelectorAll(".footnote-ref.show-note").forEach(note => {
      note.classList.remove("show-note");
      note.setAttribute("aria-expanded","false");
    });
  }

  function bindNotes() {
    article.querySelectorAll(".footnote-ref").forEach(note => {
      note.setAttribute("aria-expanded","false");

      note.addEventListener("click",event => {
        event.preventDefault();
        event.stopPropagation();

        const wasOpen = note.classList.contains("show-note");
        closeNotes();

        if (!wasOpen) {
          note.classList.add("show-note");
          note.setAttribute("aria-expanded","true");
        }
      });

      note.addEventListener("keydown",event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          note.click();
        }

        if (event.key === "Escape") {
          note.classList.remove("show-note");
          note.setAttribute("aria-expanded","false");
        }
      });
    });
  }

  document.addEventListener("click",event => {
    if (!event.target.closest(".footnote-ref")) {
      closeNotes();
    }
  });

  function setLanguage(lang) {
    const translation = translations[lang];
    if (!translation) return;

    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.documentElement.dir =
      (lang === "he" || lang === "ar") ? "rtl" : "ltr";

    document.title = translation.title;
    document.querySelector(".site-name").textContent = siteNames[lang];
    document.querySelector(".author").textContent = translation.author;
    document.querySelector("h1").textContent = translation.heading;
    document.querySelector(".part-label").textContent = translation.part;

    article.innerHTML = translation.article;
    nextLink.textContent = translation.nav[0];
    backLink.textContent = translation.nav[1];

    buttons.forEach(button => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.lang === lang)
      );
    });

    languageSelector.setAttribute("aria-label",selectorLabels[lang]);

    bindNotes();

    try {
      localStorage.setItem("lpc-language",lang);
      localStorage.setItem("user_language",lang);
    } catch (error) {
      /* La página seguirá funcionando si el almacenamiento está bloqueado. */
    }
  }

  buttons.forEach(button => {
    button.addEventListener("click",() => {
      setLanguage(button.dataset.lang);
    });
  });

  let initialLanguage = "es";

  /* Primero se comprueba si la URL solicita un idioma. */
  try {
    const requestedLanguage = new URLSearchParams(window.location.search).get("lang");
    if (requestedLanguage && translations[requestedLanguage]) {
      initialLanguage = requestedLanguage;
    } else {
      const savedLanguage =
        localStorage.getItem("lpc-language") ||
        localStorage.getItem("user_language");

      if (savedLanguage && translations[savedLanguage]) {
        initialLanguage = savedLanguage;
      }
    }
  } catch (error) {
    /* Si no hay almacenamiento disponible, se utiliza español. */
  }

  setLanguage(initialLanguage);
})();
</script>
</body>
</html>
