es: {
title:'Él está al tanto — Parte 1 — La Palabra en Cápsulas', siteName:'LA PALABRA EN CÁPSULAS', author:'Por J.V.', heading:'Él está al tanto', part:'Parte 1', nav:['Continuar con Parte 2 →','← Volver a Artículos'],
article:`<p>Amigos, nadie está exento de sufrir algo tan terrible como un terremoto o de una situación angustiosa. Pero de algo sí estoy seguro: Dios es misericordioso<sup><span class="footnote-ref" title="Efesios 2:4-5" role="button" tabindex="0">¹<span class="footnote-popup">Efesios 2:4-5</span></span></sup>, y por tanto, podemos pedir su protección.<sup><span class="footnote-ref" title="Salmos 18:2" role="button" tabindex="0">²<span class="footnote-popup">Salmos 18:2</span></span></sup> Desde hace un tiempo, además de mis oraciones regulares, he incluido en ellas un <strong>refuerzo</strong>: pedir al Altísimo que nos proteja de toda cosa negativa.</p>
<div class="cascade"><div>• Calamidad, accidente, secuestro, tsunami, huracán o terremoto.</div><div>• Accidentes, atracos y extorsiones.</div><div>• Enfermedades crueles y dolorosas.</div><div>• Y, como dice la oración modelo, que nos libre de todo mal.</div></div>
<p>Como escribí arriba, esos elementos los he incluido en mis oraciones. Debemos elevar nuestra petición al único Santo Padre del cielo que hay, en el nombre de Jesús, y agradecer al final, creyendo que Él ya lo ha hecho. Adore al Señor en ese mismo instante con acción de gracias, pues eso es de su agrado.</p>
<p>La iglesia cristiana en el mundo no encomienda su propio país a ídolos, estatuas o a todo aquello que desagrade a Dios. Quien lo hace es porque no ha nacido de nuevo, y debemos compartirle el consejo de Dios para que pase por su proceso de conversión. Y déjenme decirles: hay personas que se han ido a ídolos por ignorancia, no por convicción, y es por ello que los creyentes debemos evangelizar a los que están en la búsqueda.</p>
<p>Jeremías 7 y 44 son dos capítulos de la Biblia muy contundentes, donde el Señor advierte sobre los peligros de adorar a la <em>reina del cielo</em>. En la antigüedad, a esa deidad le llamaban Artemis, según la mitología griega; luego Diana en Asia Menor —hoy Turquía—.</p>
<p>Posteriormente, los papas en Roma, pensando en qué nombre ponerle a una divinidad femenina para asemejarse a las antiguas deidades paganas, escogieron el nombre de alguien que hubiera existido y dijeron: “María”.</p><p>Ella nunca quiso ser venerada. La religión fue la que lo hizo.</p>
<p>Y aquí quiero ser claro. María, la madre de Jesús, fue una mujer piadosa, pero igual requirió de un Salvador: ¡su propio hijo! Ella dijo:</p>
<blockquote class="scripture">“Engrandece mi alma al Señor; y mi espíritu se regocija en Dios mi Salvador”.<sup><span class="footnote-ref" title="Lucas 1:46-47" role="button" tabindex="0">³<span class="footnote-popup">Lucas 1:46-47</span></span></sup></blockquote>
<p>Jesús es el Cristo,<sup><span class="footnote-ref" title="Mateo 16:16" role="button" tabindex="0">⁴<span class="footnote-popup">Mateo 16:16</span></span></sup> y Cristo es Dios sobre todas las cosas.<sup><span class="footnote-ref" title="Romanos 9:5" role="button" tabindex="0">⁵<span class="footnote-popup">Romanos 9:5</span></span></sup></p>
<p>En las bodas de Caná, María dijo con respecto a su hijo:</p><blockquote class="scripture">“Haced todo lo que él os dijere”.<sup><span class="footnote-ref" title="Juan 2:5" role="button" tabindex="0">⁶<span class="footnote-popup">Juan 2:5</span></span></sup></blockquote>
<p>Hay millones en el mundo que no conocen esta simple verdad, y hay aún sacerdotes católicos que sirven a un dios muerto, colgado en una cruz.</p>
<p>En realidad, no desconozco que haya personas en la religión tradicional que intenten ofrecer ayuda a muchos que sufren, pero su doctrina errónea no les deja ver más allá de lo que ven sus ojos y siguen percibiendo a Jesús en una cruz.</p>
<p>Si usted quiere conocer la verdad, deberá leer la Biblia para conocer más a Jesús, su vida y lo que hizo por nosotros.</p><p>Debemos orar por nuestros gobernantes y anunciarles el evangelio, no solo porque es nuestro deber, sino porque, si no lo hacemos, no tendremos país.</p>
<p>“El que ignorantemente peca, ignorantemente se condena” es un adagio popular. De nuevo: Si alguien no anda conforme a la Biblia y tiene buenas intenciones de hacer el bien, se le debe hablar con respeto para que corrija su caminar.</p>
<blockquote class="scripture">La buena noticia es que Jesús no está en un madero, pues después de morir por nuestros pecados, resucitó al tercer día de entre los muertos, ascendió al cielo y está sentado a la diestra del Padre.</blockquote>
<p>Dios es celoso y no admite ser compartido.<sup><span class="footnote-ref" title="Éxodo 20:5" role="button" tabindex="0">⁷<span class="footnote-popup">Éxodo 20:5</span></span></sup> Si por un lado alguien va a hablar de Jesucristo y por otro va a incensar a María o a espíritus de fallecidos,<sup><span class="footnote-ref" title="Deuteronomio 18:10-12" role="button" tabindex="0">⁸<span class="footnote-popup">Deuteronomio 18:10-12</span></span></sup>, siendo un craso error, la cosa no le va a funcionar.</p><p>Si quiere ir a la fija, considere al Padre, al Hijo y al Espíritu Santo. Todo con la Deidad, sin ella, nada.</p>`
},
en: {
title:'He Is Aware — Part 1 — The Word in Capsules', siteName:'THE WORD IN CAPSULES', author:'By J.V.', heading:'He Is Aware', part:'Part 1', nav:['Continue to Part 2 →','← Back to Articles'],
article:`<p>Friends, no one is exempt from suffering something as terrible as an earthquake or an anguishing situation. But there is one thing I am sure of: God is merciful<sup><span class="footnote-ref" title="Ephesians 2:4-5" role="button" tabindex="0">¹<span class="footnote-popup">Ephesians 2:4-5</span></span></sup>, and therefore we can ask for His protection.<sup><span class="footnote-ref" title="Psalm 18:2" role="button" tabindex="0">²<span class="footnote-popup">Psalm 18:2</span></span></sup> For some time now, in addition to my regular prayers, I have included an extra <strong>reinforcement</strong>: asking the Most High to protect us from every kind of harm.</p>
<div class="cascade"><div>• Calamity, accident, kidnapping, tsunami, hurricane, or earthquake.</div><div>• Accidents, robberies, and extortion.</div><div>• Cruel and painful illnesses.</div><div>• And, as the model prayer says, that He deliver us from all evil.</div></div>
<p>As I wrote above, I have included these things in my prayers. We should lift our request to the one Holy Father in heaven, in the name of Jesus, and give thanks at the end, believing that He has already done it. Worship the Lord at that very moment with thanksgiving, for this pleases Him.</p>
<p>The Christian church around the world does not entrust its own country to idols, statues, or anything that displeases God. Those who do so have not been born again, and we should share God’s counsel with them so they can go through the process of conversion. Let me tell you: some have turned to idols out of ignorance, not conviction; that is why believers should share the gospel with those who are seeking.</p>
<p>Jeremiah 7 and 44 are two very forceful chapters of the Bible in which the Lord warns about the dangers of worshiping the <em>queen of heaven</em>. In ancient times, according to Greek mythology, that deity was called Artemis; later, Diana in Asia Minor—today’s Turkey.</p><p>Later, the popes in Rome, thinking of what name to give a female divinity to resemble ancient pagan deities, chose the name of someone who had existed and said: “Mary.”</p><p>She never wanted to be venerated. Religion was the one that did so.</p>
<p>And here I want to be clear. Mary, the mother of Jesus, was a devout woman, but she too needed a Savior: her own son! She said:</p><blockquote class="scripture">“My soul magnifies the Lord, and my spirit rejoices in God my Savior.”<sup><span class="footnote-ref" title="Luke 1:46-47" role="button" tabindex="0">³<span class="footnote-popup">Luke 1:46-47</span></span></sup></blockquote>
<p>Jesus is the Christ,<sup><span class="footnote-ref" title="Matthew 16:16" role="button" tabindex="0">⁴<span class="footnote-popup">Matthew 16:16</span></span></sup> and Christ is God over all.<sup><span class="footnote-ref" title="Romans 9:5" role="button" tabindex="0">⁵<span class="footnote-popup">Romans 9:5</span></span></sup></p><p>At the wedding in Cana, Mary said about her son:</p><blockquote class="scripture">“Do whatever he tells you.”<sup><span class="footnote-ref" title="John 2:5" role="button" tabindex="0">⁶<span class="footnote-popup">John 2:5</span></span></sup></blockquote>
<p>Millions around the world do not know this simple truth, and there are still Catholic priests who serve a dead god hanging on a cross.</p><p>I do recognize that some people in traditional religion try to help many who suffer, but their mistaken doctrine does not let them see beyond what their eyes can see, and they continue to picture Jesus on a cross.</p><p>If you want to know the truth, you must read the Bible to learn more about Jesus, His life, and what He did for us.</p><p>We must pray for our leaders and proclaim the gospel to them, not only because it is our duty, but because if we do not, we will have no country.</p><p>“Those who sin in ignorance are condemned in ignorance” is a popular saying. Again, if someone does not walk according to the Bible but has good intentions and wants to do good, we should speak to that person respectfully so they can correct their path.</p><blockquote class="scripture">The good news is that Jesus is no longer on a wooden cross: after dying for our sins, He rose from the dead on the third day, ascended to heaven, and is seated at the Father’s right hand.</blockquote><p>God is jealous and does not allow Himself to be shared.<sup><span class="footnote-ref" title="Exodus 20:5" role="button" tabindex="0">⁷<span class="footnote-popup">Exodus 20:5</span></span></sup> If someone speaks about Jesus Christ on one hand and burns incense to Mary or to the spirits of the dead on the other,<sup><span class="footnote-ref" title="Deuteronomy 18:10-12" role="button" tabindex="0">⁸<span class="footnote-popup">Deuteronomy 18:10-12</span></span></sup>—a serious error—it will not work.</p><p>If you want to be sure, consider the Father, the Son, and the Holy Spirit. Everything with the Godhead; without it, nothing.</p>`
},
zh: {
title:'祂知晓一切 — 第一部分 — 胶囊中的话语', siteName:'胶囊中的圣言', author:'作者：J.V.', heading:'祂知晓一切', part:'第一部分', nav:['继续阅读第二部分 →','← 返回文章列表'],
article:`<p>朋友们，没有人能够完全避免地震这样可怕的灾难，或其他令人痛苦的处境。但有一件事我深信不疑：上帝满有怜悯<sup><span class="footnote-ref" title="以弗所书 2:4-5" role="button" tabindex="0">¹<span class="footnote-popup">以弗所书 2:4-5</span></span></sup>，因此我们可以祈求祂的保护。<sup><span class="footnote-ref" title="诗篇 18:2" role="button" tabindex="0">²<span class="footnote-popup">诗篇 18:2</span></span></sup> 这段时间以来，除了平常的祷告，我还特别加上一项<strong>加强的祈求</strong>：求至高者保护我们，使我们免受一切负面的事物侵害。</p>
<div class="cascade"><div>• 灾难、意外、绑架、海啸、飓风或地震。</div><div>• 事故、抢劫和敲诈勒索。</div><div>• 残酷而痛苦的疾病。</div><div>• 并且，正如主祷文所说，求祂救我们脱离一切凶恶。</div></div>
<p>正如我上面所写的，我已经把这些事项纳入自己的祷告中。我们应当奉耶稣的名，向那位在天上独一的圣父祈求，并在祷告结束时献上感谢，相信祂已经成就。就在那一刻，以感恩敬拜主，因为这是祂所喜悦的。</p>
<p>世界各地的基督教会不应把自己的国家托付给偶像、雕像，或任何令上帝不喜悦的事物。这样做的人尚未重生；我们应当把上帝的教导分享给他们，帮助他们走上悔改归主的道路。请听我说：有些人转向偶像是出于无知，而不是出于坚定的信念。因此，信徒应当向那些正在寻求真理的人传扬福音。</p>
<p>《耶利米书》第七章和第四十四章是圣经中措辞十分严厉的两章，经文警告人们敬拜<strong>天后</strong>的危险。按照希腊神话，古代人称这位女神为阿耳忒弥斯；后来在小亚细亚（今天的土耳其），她又被称为狄安娜。</p>
<p>后来，罗马的教皇想为一位女性神祇取一个名字，使她看起来与古代异教女神相似，于是选用了一个真实存在过的人物的名字，并称她为“玛利亚”。</p><p>她从未要求人敬拜她；是宗教使人这样做。</p>
<p>在这里，我想把话说清楚。耶稣的母亲玛利亚是一位敬虔的女子，但她同样需要一位救主——就是她自己的儿子！她说：</p><blockquote class="scripture">“我心尊主为大；我灵以神我的救主为乐。”<sup><span class="footnote-ref" title="路加福音 1:46-47" role="button" tabindex="0">³<span class="footnote-popup">路加福音 1:46-47</span></span></sup></blockquote>
<p>耶稣是基督，<sup><span class="footnote-ref" title="马太福音 16:16" role="button" tabindex="0">⁴<span class="footnote-popup">马太福音 16:16</span></span></sup> 而基督是超乎万有的上帝。<sup><span class="footnote-ref" title="罗马书 9:5" role="button" tabindex="0">⁵<span class="footnote-popup">罗马书 9:5</span></span></sup></p><p>在迦拿的婚宴上，玛利亚对她的儿子这样说：</p><blockquote class="scripture">“他告诉你们什么，你们就做什么。”<sup><span class="footnote-ref" title="约翰福音 2:5" role="button" tabindex="0">⁶<span class="footnote-popup">约翰福音 2:5</span></span></sup></blockquote>
<p>世界上有数以百万计的人不认识这个简单的真理，至今仍有天主教神父事奉一位被钉在十字架上、仿佛已经死去的神。</p><p>我并非不知道，传统宗教中有些人试图帮助许多受苦的人；然而，他们错误的教义使他们无法看见眼前所见之外的真相，仍然只把耶稣看作在十字架上的形象。</p><p>如果你想认识真理，就应当阅读圣经，更深入地认识耶稣、祂的一生，以及祂为我们所成就的事。</p><p>我们应当为执政者祷告，并向他们传扬福音；这不仅是我们的责任，因为如果我们不这样做，我们的国家也将失去方向。</p><p>俗话说：“无知而犯罪，也要为无知所承担的后果负责。”再说一次：如果有人没有按照圣经的教导行事，却真心想行善，我们就应当尊重地与他交谈，帮助他改正自己的道路。</p><blockquote class="scripture">好消息是，耶稣如今不再挂在木头十字架上。祂为我们的罪死了，第三天从死里复活，升上天，并坐在父的右边。</blockquote>
<p>上帝是忌邪的，不容许人把祂与别的对象并列敬拜。<sup><span class="footnote-ref" title="出埃及记 20:5" role="button" tabindex="0">⁷<span class="footnote-popup">出埃及记 20:5</span></span></sup> 如果有人一方面传讲耶稣基督，另一方面却向玛利亚或已故之人的灵焚香，<sup><span class="footnote-ref" title="申命记 18:10-12" role="button" tabindex="0">⁸<span class="footnote-popup">申命记 18:10-12</span></span></sup> 这就是严重的错误，终究不会行得通。</p><p>如果你想走在稳妥的道路上，就当仰望圣父、圣子和圣灵。凡事都当以三位一体的上帝为中心；离了祂，便一无所有。</p>`
},
fr: {
title:'Il est au courant — Partie 1 — La Parole en Capsules', siteName:'LA PAROLE EN CAPSULES', author:'Par J.V.', heading:'Il est au courant', part:'Partie 1', nav:['Continuer vers la partie 2 →','← Retour aux articles'],
article:`<p>Amis, personne n’est à l’abri d’une épreuve aussi terrible qu’un tremblement de terre ou d’une situation angoissante. Mais je suis sûr d’une chose : Dieu est miséricordieux<sup><span class="footnote-ref" title="Éphésiens 2:4-5" role="button" tabindex="0">¹<span class="footnote-popup">Éphésiens 2:4-5</span></span></sup> et nous pouvons donc demander sa protection.<sup><span class="footnote-ref" title="Psaume 18:2" role="button" tabindex="0">²<span class="footnote-popup">Psaume 18:2</span></span></sup> Depuis quelque temps, en plus de mes prières habituelles, j’y ai ajouté un <strong>renforcement</strong> : demander au Très-Haut de nous protéger de toute chose négative.</p>
<div class="cascade"><div>• Catastrophe, accident, enlèvement, tsunami, ouragan ou tremblement de terre.</div><div>• Accidents, vols et extorsions.</div><div>• Maladies cruelles et douloureuses.</div><div>• Et, comme le dit la prière modèle, qu’il nous délivre de tout mal.</div></div>
<p>Comme je l’ai écrit plus haut, j’ai inclus ces éléments dans mes prières. Nous devons adresser notre demande au seul Saint Père qui est au ciel, au nom de Jésus, puis rendre grâce en croyant qu’il l’a déjà exaucée. Adorez le Seigneur à cet instant même avec des actions de grâce, car cela lui plaît.</p><p>L’Église chrétienne dans le monde ne confie pas son propre pays à des idoles, à des statues ou à tout ce qui déplaît à Dieu. Ceux qui le font ne sont pas nés de nouveau ; nous devons leur transmettre le conseil de Dieu afin qu’ils puissent suivre un chemin de conversion. Certaines personnes se sont tournées vers les idoles par ignorance, et non par conviction. C’est pourquoi les croyants doivent annoncer l’Évangile à ceux qui cherchent.</p><p>Jérémie 7 et 44 sont deux chapitres très explicites de la Bible dans lesquels le Seigneur met en garde contre les dangers du culte de la <em>reine du ciel</em>. Dans l’Antiquité, cette divinité était appelée Artémis selon la mythologie grecque, puis Diane en Asie Mineure — l’actuelle Turquie.</p><p>Plus tard, les papes de Rome, cherchant un nom pour une divinité féminine qui rappelle les anciennes divinités païennes, ont choisi le nom d’une personne qui avait réellement existé et ont dit : « Marie ».</p><p>Elle n’a jamais voulu être vénérée. C’est la religion qui l’a fait.</p><p>Je veux être clair sur ce point. Marie, la mère de Jésus, était une femme pieuse, mais elle avait elle aussi besoin d’un Sauveur : son propre fils ! Elle a dit :</p><blockquote class="scripture">« Mon âme exalte le Seigneur, et mon esprit se réjouit en Dieu, mon Sauveur. »<sup><span class="footnote-ref" title="Luc 1:46-47" role="button" tabindex="0">³<span class="footnote-popup">Luc 1:46-47</span></span></sup></blockquote><p>Jésus est le Christ,<sup><span class="footnote-ref" title="Matthieu 16:16" role="button" tabindex="0">⁴<span class="footnote-popup">Matthieu 16:16</span></span></sup> et le Christ est Dieu au-dessus de toutes choses.<sup><span class="footnote-ref" title="Romains 9:5" role="button" tabindex="0">⁵<span class="footnote-popup">Romains 9:5</span></span></sup></p><p>Lors des noces de Cana, Marie a dit au sujet de son fils :</p><blockquote class="scripture">« Faites tout ce qu’il vous dira. »<sup><span class="footnote-ref" title="Jean 2:5" role="button" tabindex="0">⁶<span class="footnote-popup">Jean 2:5</span></span></sup></blockquote><p>Des millions de personnes dans le monde ne connaissent pas cette vérité simple, et il existe encore des prêtres catholiques qui servent un dieu mort, suspendu à une croix.</p><p>Je ne nie pas que certaines personnes de la religion traditionnelle essaient d’aider ceux qui souffrent, mais leur doctrine erronée les empêche de voir au-delà de ce que leurs yeux perçoivent ; ils continuent à représenter Jésus sur une croix.</p><p>Si vous voulez connaître la vérité, vous devez lire la Bible pour mieux connaître Jésus, sa vie et ce qu’il a fait pour nous.</p><p>Nous devons prier pour nos dirigeants et leur annoncer l’Évangile, non seulement parce que c’est notre devoir, mais aussi parce que, si nous ne le faisons pas, nous n’aurons plus de pays.</p><p>« Celui qui pèche par ignorance est condamné par ignorance » est un dicton populaire. Si quelqu’un ne marche pas selon la Bible mais a de bonnes intentions et veut faire le bien, il faut lui parler avec respect afin qu’il corrige sa conduite.</p><blockquote class="scripture">La bonne nouvelle, c’est que Jésus n’est plus sur un bois : après être mort pour nos péchés, il est ressuscité des morts le troisième jour, il est monté au ciel et siège à la droite du Père.</blockquote><p>Dieu est jaloux et n’accepte pas d’être partagé.<sup><span class="footnote-ref" title="Exode 20:5" role="button" tabindex="0">⁷<span class="footnote-popup">Exode 20:5</span></span></sup> Si quelqu’un parle de Jésus-Christ d’un côté et brûle de l’encens à Marie ou aux esprits des défunts de l’autre,<sup><span class="footnote-ref" title="Deutéronome 18:10-12" role="button" tabindex="0">⁸<span class="footnote-popup">Deutéronome 18:10-12</span></span></sup> — ce qui est une grave erreur — cela ne fonctionnera pas.</p><p>Si vous voulez être sûr de votre choix, considérez le Père, le Fils et le Saint-Esprit. Tout avec la Divinité, sans elle, rien.</p>`

(function(){
 const article=document.querySelector('.article');
 const buttons=document.querySelectorAll('[data-lang]');
 const navLinks=document.querySelectorAll('.footer-nav a');
 const data=window.translations;
 function bindNotes(){
  const notes=document.querySelectorAll('.footnote-ref');
  notes.forEach(n=>{n.setAttribute('aria-expanded','false');n.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const was=n.classList.contains('show-note');notes.forEach(x=>{x.classList.remove('show-note');x.setAttribute('aria-expanded','false')});if(!was){n.classList.add('show-note');n.setAttribute('aria-expanded','true')}});n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click()}if(e.key==='Escape'){notes.forEach(x=>{x.classList.remove('show-note');x.setAttribute('aria-expanded','false')})}})});
 }
 function setLanguage(lang){if(!data[lang])lang='es';const t=data[lang];document.documentElement.lang=lang;document.title=t.title;document.querySelector('.site-name').textContent=t.siteName;document.querySelector('.author').textContent=t.author;document.querySelector('h1').textContent=t.heading;document.querySelector('.part-label').textContent=t.part;article.innerHTML=t.article;navLinks.forEach((a,i)=>a.textContent=t.nav[i]);buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelector('.language-selector').setAttribute('aria-label',lang==='es'?'Selección de idioma':lang==='en'?'Language selector':lang==='zh'?'语言选择':'Sélection de la langue');try{localStorage.setItem('lpc-language',lang)}catch(e){}bindNotes();}
 buttons.forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
 let initial='es';try{const saved=localStorage.getItem('lpc-language');if(data[saved])initial=saved}catch(e){}setLanguage(initial);
 document.addEventListener('click',e=>{if(!e.target.closest('.footnote-ref'))document.querySelectorAll('.footnote-ref.show-note').forEach(n=>{n.classList.remove('show-note');n.setAttribute('aria-expanded','false')})});
})();
</script>
</body></html>
