
<script>
function setLanguage(language) {
  const selected = translations[language] ? language : "es";
  const data = translations[selected];

  document.documentElement.lang =
    selected === "zh" ? "zh-CN" : selected;

  document.documentElement.dir =
    ["he", "ar"].includes(selected) ? "rtl" : "ltr";

  document.title = data.title;

  document.getElementById("site-name").textContent = data.siteName;
  document.getElementById("page-title").textContent = data.pageTitle;
  document.getElementById("subtitle").textContent = data.subtitle;
  document.getElementById("heading-what").textContent = data.headingWhat;
  document.getElementById("text-what").innerHTML = data.textWhat;
  document.getElementById("heading-evolution").textContent = data.headingEvolution;
  document.getElementById("text-evolution-1").textContent = data.evolution1;
  document.getElementById("text-evolution-2").textContent = data.evolution2;
  document.getElementById("heading-daily").textContent = data.headingDaily;
  document.getElementById("verse-one").textContent = data.verseOne;
  document.getElementById("reference-one").textContent = data.referenceOne;
  document.getElementById("verse-two").textContent = data.verseTwo;
  document.getElementById("reference-two").textContent = data.referenceTwo;
  document.getElementById("back-link").textContent = data.back;

  document.querySelectorAll(".language-bar button").forEach(function(button) {
    const active = button.dataset.lang === selected;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", active ? "true" : "false");
  });

  try {
    localStorage.setItem("lpc-language", selected);
    localStorage.setItem("user_language", selected);
  } catch (error) {}
}

function getInitialLanguage() {
  const params = new URLSearchParams(window.location.search);
  const requested = params.get("lang");

  if (requested && translations[requested]) {
    return requested;
  }

  try {
    const saved =
      localStorage.getItem("lpc-language") ||
      localStorage.getItem("user_language");

    if (saved && translations[saved]) {
      return saved;
    }
  } catch (error) {}

  return "es";
}

document.querySelectorAll(".language-bar button").forEach(function(button) {
  button.addEventListener("click", function() {
    setLanguage(button.dataset.lang);
  });
});

setLanguage(getInitialLanguage());
</script>
