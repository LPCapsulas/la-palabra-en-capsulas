pt: {

  author:"Por J.V.",
  opening:[
    "O que desejo transmitir foi-me ensinado pela própria pessoa que compartilhou o evangelho comigo.",

    "Assim como você conta ao seu melhor amigo sobre uma moça que acabou de conhecer e por quem acredita estar apaixonado, o mesmo acontece nas coisas espirituais. Você encontrou seu Salvador, Senhor e Cuidador e, por isso, conversa com Ele e fala sobre Ele.",
    "Naquela manhã, embora o local fosse espaçoso, estava praticamente vazio e havia muitas mesas disponíveis. Como sempre, eu estava com minha maleta e a coloquei na cadeira ao lado. Pensei: <strong>“Há bastante espaço; vamos colocá-la ali.”</strong>",
    "O homem de Deus me disse:"
  ],
  dialogue:[
    "“Coloque-a no seu próprio assento.”",
    "“O quê?”, perguntei.",
    "“Sua maleta.”",
    "Então ele acrescentou suavemente:",
    "“Você está sendo egoísta com os outros.”",
    "“Amigo, praticamente não há ninguém aqui”, respondi, quase irritado.",
    "Ele então me respondeu:",
    "“Está vendo? Você está supondo que ninguém virá. Não percebe que, se alguém chegar, talvez deixe de lhe pedir o assento para não incomodá-lo e, na prática, você terá prejudicado essa pessoa. Você não está pensando nos outros!”"

    "בוקר אחד בשנים 1986–1987 היינו ב־Gullivers, מקום ברחוב 82 שבו מכרו כריך דגים טעים, קפה, תה ומאכלים נוספים.",
    "נהגנו ללכת לשם לעיתים קרובות כדי לשתות תה ולדבר על דבר אלוהים. כפי שסיפרתי בעדות האישית שלי, הלידה החדשה הביאה לחיי התלהבות מחודשת. הייתי מלא כל כך בלהט, שרצינו לדבר על האדון כל הזמן.",
    "כשם שאתה מספר לחברך הטוב ביותר על בחורה שזה עתה הכרת ושאתה חושב שהתאהבת בה, כך קורה גם בעניינים רוחניים. מצאת את המושיע שלך, את אדונך ואת מי שדואג לך, ולכן אתה מדבר איתו ועליו.",
    "באותו בוקר המקום היה מרווח אך כמעט ריק, ולכן היו שולחנות רבים פנויים. כמו תמיד, הייתה איתי תיקיית המסמכים שלי, והנחתי אותה על הכיסא שלצדי. חשבתי: <strong>״יש כאן הרבה מקום, נשים אותה שם.״</strong>",
    "איש האלוהים אמר לי:"
  ],
  dialogue:[
    "״שים אותה על הכיסא שלך.״",
    "״מה?״ שאלתי.",
    "״את התיק שלך.״",
    "ואז הוסיף בעדינות:",

    "״ידידי, כמעט שאין כאן איש,״ השבתי, כמעט בכעס.",
    "הוא ענה לי:",

    "עם הזמן נוכחתי לדעת שאדם שמעולם לא קיבל את סמכותו של חבר אחר בגוף המשיח מתקשה להודות שאדם אחר צודק, אפילו כאשר הוא עצמו טועה.",
    "באותו יום הבנתי שהדרך לא תהיה קלה כל כך, ושמעתה אקבל לא מעט תוכחה בתחום הרוחני.",
    "אני מבטיח לכם שזו לא הייתה הפעם היחידה שבה קיבלתי ״נזיפה״ רוחנית!"

    "לשמוע מסר במקום שבו אנו מתכנסים ולשמור אותו בזיכרון הוא דבר אחד. לקבל את ה״אמיתות״ בלב, לחיות לפיהן וליישם אותן לאורך כל החיים הוא דבר אחר.",

ar: {
  brand:"كلمة الله في كبسولات",
  title:"شاي في غوليفرز",
  author:"بقلم J.V.",
  opening:[
    "الشخص الذي علّمني ما أريد أن أنقله إليكم هو نفسه الذي شاركني بشارة الإنجيل.",
    "في صباح من عام 1986 أو 1987، كنا في مكان يُسمّى «غوليفرز» في الشارع الثاني والثمانين، وكانوا يبيعون فيه شطائر السمك اللذيذة والقهوة والشاي وغيرها من المأكولات.",
    "كنا نذهب إلى هناك كثيرًا لشرب الشاي والتحدث عن كلمة الله. وكما ذكرت في شهادتي، فإن ولادتي الجديدة جلبت إلى حياتي حماسة متجددة. كنت متحمسًا جدًا حتى إننا أردنا التحدث عن الرب طوال الوقت.",
    "كما تتحدث إلى أعز أصدقائك عن فتاة تعرّفت إليها للتو وتظن أنك وقعت في حبها، هكذا يحدث الأمر أيضًا في الحياة الروحية. لقد وجدت مخلّصك وربك ومن يعتني بك، ولذلك تتحدث معه وعنه.",
    "في ذلك الصباح، كان المكان واسعًا لكنه شبه خالٍ، وكانت هناك طاولات كثيرة متاحة. وكالعادة، كانت حقيبتي معي، فوضعتها على الكرسي المجاور. قلت في نفسي: <strong>«هناك مساحة كبيرة، فلنضعها هنا».</strong>",
    "فقال لي رجل الله:"
  ],
  dialogue:[
    "«ضعها على مقعدك أنت».",
    "«ماذا؟» سألته.",
    "«حقيبتك».",
    "ثم أضاف بهدوء:",
    "«أنت تتصرف بأنانية تجاه الآخرين».",
    "«يا صديقي، لا يوجد أحد هنا تقريبًا»، أجبته وقد بدأت أشعر بالانزعاج.",
    "فردّ عليّ قائلًا:",
    "«أرأيت؟ أنت تفترض أن أحدًا لن يأتي. ولا تدرك أنه إذا جاء شخص ما، فقد يمتنع عن طلب المقعد منك حتى لا يزعجك، وبذلك تكون قد أضررت به عمليًا. أنت لا تفكر في الآخرين!»"
  ],
  after:[
    "في بداياتي، كنت أتقبل التصحيح على مضض شديد، ولم يكن ذلك صحيحًا. علينا أن نعترف عندما يكون الآخرون على صواب ونكون نحن مخطئين. ولا أستطيع أن أؤكد بما يكفي أهمية المرشدين الروحيين والإخوة الذين يرافقوننا في مسيرتنا المسيحية.",
    "ومع مرور الوقت، أدركت أن الشخص الذي لم يخضع يومًا لعضو آخر في جسد المسيح يجد صعوبة في الاعتراف بأن شخصًا آخر على حق، حتى عندما يكون هو نفسه مخطئًا.",
    "في ذلك اليوم أدركت أن الأمر لن يكون سهلًا كما ظننت، وأنني سأتلقى منذ ذلك الحين توبيخًا وتأديبًا روحيًا.",
    "أؤكد لكم أن تلك لم تكن المرة الوحيدة التي تلقيت فيها مثل هذا «التأديب» الروحي!"
  ],
  reflectionTitle:"الاهتمام بالآخرين",
  reflection:[
    "باختصار، هذا هو جوهر المسيحية: أن <strong>نفكر ونتصرف</strong> من أجل خير الآخرين، حتى عندما لا نراهم، لكي ينالوا الخلاص.",
    "أن تسمع رسالة في مكان اجتماعك وتحتفظ بها في ذهنك أمر، وأن تستقبل «الحقائق» في قلبك وتعيش بها وتطبقها طوال حياتك أمر آخر.",
    "أحيانًا نقول إننا لن ندخر جهدًا، أو إننا سنواصل العمل «حتى آخر قطرة عرق» من أجل هذا الأمر أو ذاك. لكن <strong>يسوع</strong> بذل حياته حتى الموت، وهكذا أنقذنا الله من سلطان الظلمة ونقلنا إلى ملكوت ابنه الحبيب.",
    "لقد وضعنا الله دائمًا في حسبانه، ولا يزال يفعل ذلك حتى اليوم."
  ],

function makeParagraphs(items){
  return items.map(function(item){
    const p=document.createElement("p");
    p.innerHTML=item;
    return p;
  });
}

function renderSection(id,items){
  const section=document.getElementById(id);
  section.replaceChildren(...makeParagraphs(items));
}

function setLanguage(lang){
  if(!Object.prototype.hasOwnProperty.call(translations,lang)){
    lang="es";
  }

  const t=translations[lang];

  document.documentElement.lang=lang==="zh"?"zh-CN":lang;
  document.documentElement.dir=t.dir;
  document.title=t.docTitle;

  document.getElementById("brand").textContent=t.brand;
  document.getElementById("title").textContent=t.title;
  document.getElementById("author").textContent=t.author;

  renderSection("opening",t.opening);
  renderSection("dialogue",t.dialogue);
  renderSection("afterDialogue",t.after);
  renderSection("reflection",t.reflection);

  document.getElementById("reflectionTitle").textContent=t.reflectionTitle;
  document.getElementById("back1").textContent=t.back1;
  document.getElementById("back2").textContent=t.back2;

  document.querySelectorAll("[data-lang]").forEach(function(button){
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.lang===lang)
    );
  });

  try{
    localStorage.setItem("lpc-language",lang);
  }catch(error){
    // La página funciona también si el almacenamiento no está disponible.
  }
}

document.querySelectorAll("[data-lang]").forEach(function(button){
  button.addEventListener("click",function(){
    setLanguage(button.dataset.lang);
  });
});

(function initializeLanguage(){
  let lang="es";

  try{
    const saved=localStorage.getItem("lpc-language");
    if(Object.prototype.hasOwnProperty.call(translations,saved)){
      lang=saved;
    }
  }catch(error){
    // El idioma inicial será español.
  }

  setLanguage(lang);
})();
</script>
