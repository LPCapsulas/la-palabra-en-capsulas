function makeParagraphs(items){
  return items.map(function(item){
    const p=document.createElement("p");
    p.innerHTML=item;
    return p;
  });
}

function renderSection(id,items){
  const section=document.getElementById(id);
  section.replaceChildren(...makeParagraphs(items));
}

function setLanguage(lang){
  if(!Object.prototype.hasOwnProperty.call(translations,lang)){
    lang="es";
  }

  const t=translations[lang];

  document.documentElement.lang=lang==="zh"?"zh-CN":lang;
  document.documentElement.dir=t.dir;
  document.title=t.docTitle;

  document.getElementById("brand").textContent=t.brand;
  document.getElementById("title").textContent=t.title;
  document.getElementById("author").textContent=t.author;

  renderSection("opening",t.opening);
  renderSection("dialogue",t.dialogue);
  renderSection("afterDialogue",t.after);
  renderSection("reflection",t.reflection);

  document.getElementById("reflectionTitle").textContent=t.reflectionTitle;
  document.getElementById("back1").textContent=t.back1;
  document.getElementById("back2").textContent=t.back2;

  document.querySelectorAll("[data-lang]").forEach(function(button){
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.lang===lang)
    );
  });

  try{
    localStorage.setItem("lpc-language",lang);
  }catch(error){
    // La página funciona también si el almacenamiento no está disponible.
  }
}

document.querySelectorAll("[data-lang]").forEach(function(button){
  button.addEventListener("click",function(){
    setLanguage(button.dataset.lang);
  });
});

(function initializeLanguage(){
  let lang="es";

  try{
    const saved=localStorage.getItem("lpc-language");
    if(Object.prototype.hasOwnProperty.call(translations,saved)){
      lang=saved;
    }
  }catch(error){
    // El idioma inicial será español.
  }

  setLanguage(lang);
})();
</script>
