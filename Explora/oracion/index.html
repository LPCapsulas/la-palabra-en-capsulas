function setLanguage(lang) {
  if (!Object.prototype.hasOwnProperty.call(translations, lang)) {
    lang = "es";
  }

  const t = translations[lang];

  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.documentElement.dir = t.dir;

  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    const key = el.dataset.i18n;

    if (t[key] !== undefined) {
      el.textContent = t[key];
    }
  });

  document.querySelectorAll("[data-lang]").forEach(function(button) {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.lang === lang)
    );
  });

  document.title = t.pageTitle;

  const description = document.querySelector('meta[name="description"]');

  if (description) {
    description.setAttribute("content", t.description);
  }

  try {
    localStorage.setItem("lpc-language", lang);
  } catch (error) {
    // La página funciona también sin almacenamiento local.
  }
}

document.querySelectorAll("[data-lang]").forEach(function(button) {
  button.addEventListener("click", function() {
    setLanguage(button.dataset.lang);
  });
});

(function initializeLanguage() {
  let lang = "es";

  try {
    const saved = localStorage.getItem("lpc-language");

    if (Object.prototype.hasOwnProperty.call(translations, saved)) {
      lang = saved;
    }
  } catch (error) {
    // Español como idioma predeterminado.
  }

  setLanguage(lang);
})();
