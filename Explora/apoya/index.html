<title>Apoya — La Palabra en Cápsulas</title>
<style>
:root{--blue:#0F4C81;--cream:#F8F4EC;--gold:#B99A59;--ink:#17365D}
*{box-sizing:border-box}
body{margin:0;background:var(--blue);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.75}
.language-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:14px 12px 4px;max-width:1000px;margin:0 auto}
.language-bar button{border:1px solid var(--gold);background:var(--cream);color:var(--blue);border-radius:5px;padding:7px 11px;font:600 14px "Segoe UI",Arial,sans-serif;cursor:pointer}
.language-bar button[aria-pressed="true"]{background:var(--gold);color:#fff}
main{width:min(900px,calc(100% - 28px));margin:14px auto 30px;padding:26px 24px 30px;background:var(--cream);border-radius:8px;text-align:center;box-shadow:0 4px 16px #0002}
.hero-image{display:block;width:min(100%,680px);height:auto;max-height:390px;object-fit:contain;margin:0 auto 18px}
.message{max-width:760px;margin:0 auto 22px;text-align:justify}
.square-button{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;border-radius:5px;padding:11px 22px;border:1px solid var(--gold);line-height:1.45;margin:2px auto 20px}
.square-button:hover{background:#17365D}
.square-button[aria-disabled="true"]{opacity:.55;pointer-events:none;cursor:not-allowed}
.back-link{display:inline-block;color:var(--blue);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}
.back-link:hover{color:#8A6D32}
@media(max-width:600px){body{font-size:16px}.language-bar{gap:5px;padding-top:10px}.language-bar button{padding:6px 8px;font-size:13px}main{padding:18px 16px 24px;margin-top:10px}.hero-image{max-height:none}.square-button{max-width:100%;padding:10px 16px}}
</style>
</head>
<body>

<button type="button" data-language="zh" lang="zh" aria-pressed="false">中文</button>

<main>

<p id="support-message" class="message">Cualquier aportación que hagas a LPC nos permite dedicar más tiempo a preparar contenido, para seguir ofreciendo material que contribuya positivamente a la forma de pensar, las convicciones y la fe de nuestros lectores.</p>
<a id="support-button" class="square-button" href="https://square.link/u/Et13J8m1" target="_blank" rel="noopener noreferrer">Sí, quiero apoyar a LPC</a>
<br>
<a id="back-link" class="back-link" href="../menu.html?lang=es">← Volver al menú</a>

 en:{title:'Support — The Word in Capsules',alt:'Support The Word in Capsules',message:'Any contribution you make to LPC allows us to devote more time to preparing content, so we can continue offering material that positively contributes to our readers’ thinking, convictions, and faith.',button:'Yes, I want to support LPC',back:'← Back to menu'},

 he:{title:'תמכו — דבר אלוהים בכמוסות',alt:'תמכו בדבר אלוהים בכמוסות',message:'כל תרומה ל־LPC מאפשרת לנו להקדיש יותר זמן להכנת תוכן, כדי להמשיך להציע חומר שתורם באופן חיובי לחשיבה, לאמונות ולאמונה של קוראינו.',button:'כן, אני רוצה לתמוך ב־LPC',back:'חזרה לתפריט ←'},

 hi:{title:'सहयोग करें — कैप्सूल में परमेश्वर का वचन',alt:'La Palabra en Cápsulas का समर्थन करें',message:'LPC को दी जाने वाली किसी भी राशि की सहायता हमें सामग्री तैयार करने के लिए अधिक समय देने में सक्षम बनाती है, ताकि हम ऐसी सामग्री उपलब्ध कराते रहें जो हमारे पाठकों की सोच, विश्वासों और आस्था को मजबूत करने में सकारात्मक योगदान दे।',button:'हाँ, मैं LPC का समर्थन करना चाहता/चाहती हूँ',back:'← मेनू पर वापस जाएँ'},
 ru:{title:'Поддержите — Слово в капсулах',alt:'Поддержите «Слово в капсулах»',message:'Пожертвования в пользу LPC любого размера позволяют нам уделять больше времени созданию материалов и продолжать предлагать контент, который положительно влияет на мышление, убеждения и укрепление веры наших читателей.',button:'Да, я хочу поддержать LPC',back:'← Вернуться в меню'},
 de:{title:'Unterstützen — Das Wort in Kapseln',alt:'Das Wort in Kapseln unterstützen',message:'Beiträge für LPC in jeder Höhe ermöglichen es uns, mehr Zeit in die Erstellung von Inhalten zu investieren und weiterhin Materialien anzubieten, die das Denken, die Überzeugungen und den Glauben unserer Leser positiv stärken.',button:'Ja, ich möchte LPC unterstützen',back:'← Zurück zum Menü'},
 ja:{title:'支援する — カプセルに込められた御言葉',alt:'カプセルに込められた御言葉を支援する',message:'LPCへのご寄付は、金額を問わず、コンテンツ制作により多くの時間を充てる助けとなります。そして、読者の考え方や信念、信仰の成長に良い影響を与える資料を引き続き提供できるようになります。',button:'はい、LPCを支援したいです',back:'← メニューに戻る'}
};
const imageByLanguage={es:'apoya.png',en:'support.png',zh:'apoya-zh.png',fr:'soutenez.png',it:'sostieni.png',pt:'apoie.png',he:'support-he.png',ar:'support-ar.png',hi:'apoya.png',ru:'apoya.png',de:'apoya.png',ja:'apoya.png'};
const paymentLinkByLanguage={es:'https://square.link/u/Et13J8m1',en:'https://square.link/u/F8rZyhRi',fr:'https://square.link/u/96UuC9kW'};
const image=document.getElementById('support-image');
const message=document.getElementById('support-message');
const button=document.getElementById('support-button');
const back=document.getElementById('back-link');
function setLanguage(lang){if(!languages.includes(lang))lang='es';const t=translations[lang];document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.documentElement.dir=(lang==='he'||lang==='ar')?'rtl':'ltr';document.title=t.title;image.src=imageByLanguage[lang]||'apoya.png';image.alt=t.alt;message.textContent=t.message;button.textContent=t.button;back.textContent=t.back;back.href='../menu.html?lang='+lang;const payment=paymentLinkByLanguage[lang];if(payment){button.href=payment;button.removeAttribute('aria-disabled');button.removeAttribute('tabindex');button.style.pointerEvents='';button.style.opacity='';button.target='_blank';button.rel='noopener noreferrer';}else{button.removeAttribute('href');button.setAttribute('aria-disabled','true');button.setAttribute('tabindex','-1');button.style.pointerEvents='none';button.style.opacity='.55';}document.querySelectorAll('[data-language]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.language===lang)));try{localStorage.setItem('lpc-language',lang);}catch(e){}}
document.querySelectorAll('[data-language]').forEach(el=>el.addEventListener('click',()=>setLanguage(el.dataset.language)));
let initial='es';try{const params=new URLSearchParams(location.search);const fromUrl=params.get('lang');const saved=localStorage.getItem('lpc-language');if(languages.includes(fromUrl))initial=fromUrl;else if(languages.includes(saved))initial=saved;}catch(e){}setLanguage(initial);
})();
